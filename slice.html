<script type="module">
import * as THREE from 'three';

// ================= 基本セット =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd3ea);              // 明るい空色（BuildItの空気）
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;        // 映画的な色の乗り（白飛び・泥色を防ぐ）
renderer.toneMappingExposure = 1.25;
document.getElementById('app').appendChild(renderer.domElement);

const q = new URLSearchParams(location.search);            // ?t=17.5 などの検証用パラメータ

// 追従カメラ（斜め見下ろし）
const cam = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 500);
addEventListener('resize', ()=>{ renderer.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); });

// 光：暖かい午後の太陽
const hemi = new THREE.HemisphereLight(0xfff8ea, 0x7fae8a, 0.95); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 1.25);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-70; sun.shadow.camera.right=70;
sun.shadow.camera.top=70; sun.shadow.camera.bottom=-70;
scene.add(sun);

// 昼夜システムが色を触る対象の登録簿
const TOD = { tint:[], windows:[], lamps:[], pools:[] };
// 光だまり（街灯や窓の下の丸い明かり。夜のゲームの定石テク）
const poolTex = (()=>{
  const c=document.createElement('canvas'); c.width=128; c.height=128;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,4,64,64,62);
  gr.addColorStop(0,'rgba(255,225,150,0.85)'); gr.addColorStop(1,'rgba(255,225,150,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
})();
function lightPool(x,y,z,r,maxOp){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(r*2,r*2),
    new THREE.MeshBasicMaterial({map:poolTex, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending}));
  m.rotation.x=-Math.PI/2; m.position.set(x,y,z); scene.add(m);
  TOD.pools.push({mat:m.material, maxOp});
  return m;
}

// ================= 世界：海辺（南が海）=================
// 海岸線: z = COAST(x) より南(+z)が海。ゆるくカーブさせる
const COAST = x => 26 + 4*Math.sin(x*0.06) + 2*Math.sin(x*0.15+1);
const sdLand = (x,z) => COAST(x) - z;                      // 正=陸side / 負=海side（連続量=なめらか海岸線）
const clamp01 = v => Math.min(1, Math.max(0, v));
const hash = (i,j)=> (((i*73856093 ^ j*19349663)>>>0)%1000)/1000;

// 高さ: 街は完全フラット(0) → 砂浜へゆるく下る → 海底へ
function groundH(x,z){
  const sd = sdLand(x,z);
  if(sd <= 0) return -0.1 + Math.max(-1.8, sd*0.30);       // 海底
  if(sd <= 1.2) return -0.1 + sd*0.20;                     // 波打ち際の斜面
  if(sd <= 9) return 0.14;                                 // 砂浜（低くフラット）
  if(sd <= 15) return 0.14 + (sd-9)/6*0.36;                // 浜から街へのゆるい上がり
  return 0.5;                                              // 街（完全フラット）
}

// 地形メッシュ（頂点色でBuildIt風の鮮やかグラデ）
{
  const SIZE=170, STEP=1.0, NV=Math.round(SIZE/STEP), V=NV+1, H=SIZE/2;
  const pos=new Float32Array(V*V*3), col=new Float32Array(V*V*3);
  const cGrass=new THREE.Color(0x6cb14c), cSand=new THREE.Color(0xf0dca8), cSandWet=new THREE.Color(0xd9c491), cBed=new THREE.Color(0xc9b788);
  const tmp=new THREE.Color();
  for(let j=0;j<V;j++)for(let i=0;i<V;i++){
    const x=-H+i*STEP, z=-H+j*STEP, sd=sdLand(x,z);
    const y=groundH(x,z);
    const o=(j*V+i)*3;
    pos[o]=x; pos[o+1]=y; pos[o+2]=z;
    // 草(内陸) → 砂(浜) → 濡れ砂(水際) → 海底、全て連続ブレンド
    tmp.copy(cGrass);
    const f=1+((hash(i>>3,j>>3)*0.6+hash(i>>1,j>>1)*0.4)-0.5)*0.08;
    tmp.r*=f; tmp.g*=f; tmp.b*=f;
    const sandF = 1-clamp01((sd-11)/4);
    if(sandF>0) tmp.lerp(cSand, sandF);
    const wetF = clamp01((1.8-sd)/2.2);
    if(wetF>0) tmp.lerp(cSandWet, wetF);
    if(sd<-1.5) tmp.lerp(cBed, clamp01((-sd-1.5)/2));
    col[o]=tmp.r; col[o+1]=tmp.g; col[o+2]=tmp.b;
  }
  const idx=[];
  for(let j=0;j<NV;j++)for(let i=0;i<NV;i++){ const a=j*V+i,b=a+1,c=a+V,d=c+1; idx.push(a,c,b,b,c,d); }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.95});
  TOD.tint.push(mat);                                       // 夜は世界の色味ごと落とす
  const m=new THREE.Mesh(geo, mat);
  m.receiveShadow=true; scene.add(m);
}
// 海面（岸=白い泡→ターコイズ→沖=濃い青、連続グラデ）
{
  const SIZE=340, STEP=2.0, NV=Math.round(SIZE/STEP), V=NV+1, H=SIZE/2;
  const pos=new Float32Array(V*V*3), col=new Float32Array(V*V*3);
  const cFoam=new THREE.Color(0xf4fbf7), cShal=new THREE.Color(0x5fc8da), cDeep=new THREE.Color(0x2a72b8);
  const tmp=new THREE.Color();
  for(let j=0;j<V;j++)for(let i=0;i<V;i++){
    const x=-H+i*STEP, z=-H+j*STEP;
    const w=-sdLand(x,z);
    tmp.copy(cShal).lerp(cDeep, clamp01((w-1.5)/14));
    const foamF=1-clamp01((w-0.2)/2.0);
    if(foamF>0) tmp.lerp(cFoam, foamF);
    const o=(j*V+i)*3;
    pos[o]=x; pos[o+1]=0.02; pos[o+2]=z;
    col[o]=tmp.r; col[o+1]=tmp.g; col[o+2]=tmp.b;
  }
  const idx=[];
  for(let j=0;j<NV;j++)for(let i=0;i<NV;i++){ const a=j*V+i,b=a+1,c=a+V,d=c+1; idx.push(a,c,b,b,c,d); }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.3, metalness:0.05});
  TOD.tint.push(mat);
  scene.add(new THREE.Mesh(geo, mat));
}
// 海沿いの通り（商店街のメインストリート。x方向にまっすぐ＝歩きやすさ優先）
const STREET_Z = 4;                                        // 通りの中心線
{
  const pts=[]; for(let x=-84;x<=84;x+=3) pts.push(x);
  const mkRibbon=(w,y,color,rough)=>{
    const p=[]; for(const x of pts){ p.push(x,y,STREET_Z-w/2, x,y,STREET_Z+w/2); }
    const posA=[];
    for(let i=0;i+3<p.length/3*1;i++){}
    const geo=new THREE.PlaneGeometry(168, w, 1, 1);
    const m=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:rough}));
    m.rotation.x=-Math.PI/2; m.position.set(0, y, STREET_Z); m.receiveShadow=true; scene.add(m); return m;
  };
  mkRibbon(9.4, 0.52, 0xd9d2c0, 0.95);                     // 歩道（明るいベージュ＝商店街の顔）
  mkRibbon(6.2, 0.54, 0x8a9098, 0.85);                     // 車道
  for(let x=-80;x<=80;x+=7){                               // 白破線
    const d=new THREE.Mesh(new THREE.PlaneGeometry(3,0.4), new THREE.MeshStandardMaterial({color:0xf7f5ec}));
    d.rotation.x=-Math.PI/2; d.position.set(x,0.56,STREET_Z); scene.add(d);
  }
}
// ボードウォーク（海岸線に沿ってカーブする木道。BuildItの海辺の象徴）
{
  const W=3.4, Y=0.30;
  const pts=[]; for(let x=-84;x<=84;x+=3) pts.push([x, COAST(x)-7.5]);
  const pos=[];
  const nrm=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)];
    let dx=b[0]-a[0], dz=b[1]-a[1]; const L=Math.hypot(dx,dz)||1;
    nrm.push([-dz/L, dx/L]);
  }
  for(let i=0;i+1<pts.length;i++){
    const h=W/2;
    const ax=pts[i][0]+nrm[i][0]*h, az=pts[i][1]+nrm[i][1]*h, bx=pts[i][0]-nrm[i][0]*h, bz=pts[i][1]-nrm[i][1]*h;
    const cx=pts[i+1][0]+nrm[i+1][0]*h, cz=pts[i+1][1]+nrm[i+1][1]*h, dx2=pts[i+1][0]-nrm[i+1][0]*h, dz2=pts[i+1][1]-nrm[i+1][1]*h;
    pos.push(ax,Y,az, bx,Y,bz, cx,Y,cz,  bx,Y,bz, dx2,Y,dz2, cx,Y,cz);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.computeVertexNormals();
  const bw=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xc98f56, roughness:0.9, side:THREE.DoubleSide}));
  bw.receiveShadow=true; scene.add(bw);
  for(let i=0;i<pts.length;i++){                            // 板の目地（進行方向と直交）
    const g=new THREE.Mesh(new THREE.PlaneGeometry(0.14,W), new THREE.MeshStandardMaterial({color:0xb37c47}));
    g.rotation.x=-Math.PI/2;
    g.rotation.z=Math.atan2(nrm[i][1], nrm[i][0]);
    g.position.set(pts[i][0], Y+0.006, pts[i][1]); scene.add(g);
  }
}
// ヤシの木（浜の空気づくり。仮アセット）
function palm(x,z,s=1){
  const g=new THREE.Group(); g.position.set(x, groundH(x,z), z); scene.add(g);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.14*s,0.22*s,2.6*s,6), new THREE.MeshStandardMaterial({color:0x9a6b42}));
  trunk.position.y=1.3*s; trunk.rotation.z=0.08; trunk.castShadow=true; g.add(trunk);
  for(let k=0;k<6;k++){
    const a=k/6*Math.PI*2;
    const leaf=new THREE.Mesh(new THREE.BoxGeometry(2.0*s,0.06,0.5*s), new THREE.MeshStandardMaterial({color:0x3f9a4d}));
    leaf.position.set(Math.cos(a)*0.8*s, 2.6*s, Math.sin(a)*0.8*s);
    leaf.rotation.y=-a; leaf.rotation.z=0.35; leaf.castShadow=true; g.add(leaf);
  }
  return g;
}
for(const [x,z] of [[-30,17],[-10,18],[12,17.5],[34,18],[52,16.5],[-52,16.5]]) palm(x,z,1+((x*7)%10)/30);

// ================= 商店街の建物5軒（キットバッシング：箱の組合せ＋色替え展開） =================
const SOLIDS=[];                                            // 当たり判定ボックス {x0,x1,z0,z1}
function makeSignTex(text, bg, fg='#ffffff'){
  const c=document.createElement('canvas'); c.width=256; c.height=96;
  const g=c.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,256,96);
  g.strokeStyle='rgba(255,255,255,.75)'; g.lineWidth=6; g.strokeRect(6,6,244,84);
  g.fillStyle=fg; g.font='bold 44px sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(text, 128, 52);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function shop({x, w=10, d=7.5, hh=5.6, wall, upper, roof, awn, sign, signBg}){
  const zFront=-0.9, zc=zFront-d/2, GY=0.5;                 // 前面は歩道の縁、街の高さに建つ
  const g=new THREE.Group(); g.position.set(x, GY, zc); scene.add(g);
  const box=(bw,bh,bd,color,px,py,pz,emissive)=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,bd),
      new THREE.MeshStandardMaterial(emissive? {color, emissive:emissive.c, emissiveIntensity:emissive.i} : {color, roughness:0.9}));
    m.position.set(px,py,pz); m.castShadow=true; m.receiveShadow=true; g.add(m); return m;
  };
  box(w, hh, d, wall, 0, hh/2, 0);                           // 本体
  box(w*0.985, 2.0, d*0.985, upper, 0, hh-1.0, 0.02);        // 2階の色帯（外壁の変化）
  box(w+0.5, 0.4, d+0.5, roof, 0, hh+0.2, 0);                // コーニス（軒先の縁）
  box(w*0.35, 0.7, d*0.4, 0xcfd6da, w*0.18, hh+0.75, -d*0.15); // 屋上の室外機
  // --- 1階の顔（店先）---
  box(w*0.88, 2.1, 0.18, 0x4a4038, 0, 1.15, d/2+0.02);       // 店先の枠（濃い木枠）
  const win=box(w*0.60, 1.35, 0.1, 0xfff2c8, -w*0.10, 1.15, d/2+0.14, {c:0xffdf9a, i:0.55}); // ショーウィンドウ（灯り）
  TOD.windows.push(win.material);                            // 夜に灯る
  box(w*0.16, 1.7, 0.12, 0x7a5a3a, w*0.30, 0.95, d/2+0.14);  // ドア
  box(w*0.16, 0.16, 0.14, 0xf2e8d8, w*0.30, 1.86, d/2+0.15); // ドアの庇
  // --- ひさし（アウニング）：白フチ＋店色 ---
  const aw=box(w*0.92, 0.14, 1.7, awn, 0, 2.42, d/2+0.85);
  aw.rotation.x=0.28;
  box(w*0.92, 0.14, 0.35, 0xf6f3ea, 0, 2.20, d/2+1.58);      // 白フチ
  // --- 看板 ---
  const st=new THREE.Mesh(new THREE.PlaneGeometry(w*0.55, w*0.55*96/256),
    new THREE.MeshBasicMaterial({map:makeSignTex(sign, signBg)}));
  st.position.set(0, 3.35, d/2+0.12); g.add(st);
  // --- 2階の窓（白フレーム＋昼は空色）---
  for(const wx of [-w*0.26, 0, w*0.26]){
    box(1.15, 1.15, 0.1, 0xffffff, wx, hh-1.0, d/2+0.06);
    box(0.92, 0.92, 0.1, 0xa9cfe0, wx, hh-1.0, d/2+0.10);
  }
  // 当たり判定（前面に少し余白）
  SOLIDS.push({x0:x-w/2-0.2, x1:x+w/2+0.2, z0:zc-d/2-0.2, z1:zFront+0.15});
  return g;
}
shop({x:-32, wall:0xf3e0bc, upper:0xe8d2a8, roof:0x9a6a48, awn:0xd97f4e, sign:'BAKERY', signBg:'#b06a35'});
shop({x:-16, wall:0xe0906a, upper:0xd08058, roof:0x6a4a3a, awn:0x8a5a3a, sign:'CAFE',   signBg:'#6f4a32', hh:6.4});
shop({x:  0, wall:0xcfe6d2, upper:0xbcd8c2, roof:0x5f8a5a, awn:0xe08aa8, sign:'FLOWER', signBg:'#4f7a4a'});
shop({x: 16, wall:0xaecbe8, upper:0x9cbcd8, roof:0x5a6a8a, awn:0x4a6a9a, sign:'GOODS',  signBg:'#3f5a80', hh:6.0});
shop({x: 32, wall:0xeef4f6, upper:0xdfe9ec, roof:0x3f5a78, awn:0x2f6a9a, sign:'FISH',   signBg:'#1f4a70'});
// 店前の小物（ベンチと植木鉢＝生活感）
for(const bx of [-24, 8, 24]){

// 街灯（海側の歩道沿い。夜に灯る）
{

for(const sx of [-32,-16,0,16,32]) lightPool(sx-1, 0.575, 0.8, 2.6, 0.5);

// ================= あなたの分身 =================
const player = new THREE.Group(); scene.add(player);
{

// ================= 操作：タップ移動＋WASD =================
const keys={};
addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',   e=>keys[e.key.toLowerCase()]=false);
let target=null;
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0), -0.5);   // 街の高さの水平面
addEventListener('pointerdown', e=>{
  if(e.target.closest('#pad')) return;                     // パッド操作はタップ移動にしない
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc, cam);
  const hit=new THREE.Vector3();
  if(ray.ray.intersectPlane(groundPlane, hit)){
    hit.x=Math.max(-82, Math.min(82, hit.x));
    hit.z=Math.max(-70, Math.min(24, hit.z));               // 海には入らない（今はね）
    target=hit;
  }
});

// --- バーチャルパッド（左下スティック。倒し具合で歩く速さも変わるアナログ式）---
const padEl=document.getElementById('pad'), stickEl=document.getElementById('stick');
const padVec={x:0,y:0,on:false};                            // 画面座標系: x右+ / y下+
{
  const R=45; let pid=null;
  const center=()=>{ const r=padEl.getBoundingClientRect(); return {cx:r.left+r.width/2, cy:r.top+r.height/2}; };
  const update=e=>{
    const {cx,cy}=center();
    let dx=e.clientX-cx, dy=e.clientY-cy;
    const L=Math.hypot(dx,dy);
    if(L>R){ dx*=R/L; dy*=R/L; }
    stickEl.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    padVec.x=dx/R; padVec.y=dy/R;
  };
  padEl.addEventListener('pointerdown', e=>{ pid=e.pointerId; padEl.setPointerCapture(pid); padVec.on=true; target=null; update(e); });
  padEl.addEventListener('pointermove', e=>{ if(e.pointerId===pid && padVec.on) update(e); });
  const end=e=>{ if(e.pointerId!==pid) return; padVec.on=false; padVec.x=0; padVec.y=0; pid=null;
    stickEl.style.transform='translate(-50%,-50%)'; };
  padEl.addEventListener('pointerup', end);
  padEl.addEventListener('pointercancel', end);
}

// ================= 時間と光（昼夜サイクル）=================
const DAY_SEC = 300;                                        // 現実5分 = ゲーム内1日
let gameHour = q.get('t')!==null ? +q.get('t') : 10;        // ?t=17.5 で夕方から開始（検証用）
const clockEl = document.getElementById('clock');
// キーフレーム: [時刻, 空, 半球光強度, 太陽色, 太陽強度, 世界の色味]
const KEYS = [
  [0.0, 0x101d33, 0.36, 0x6f86c0, 0.18, 0x7086ab],          // 深夜（月明かり）
  [4.5, 0x152441, 0.38, 0x7690c8, 0.20, 0x7690b0],
  [6.0, 0xf2b26a, 0.58, 0xffb066, 0.60, 0xd4b195],          // 朝焼け
  [8.0, 0xa8d8ec, 0.95, 0xfff0d0, 1.05, 0xffffff],
  [12,  0x8fd3ea, 1.05, 0xffffff, 1.20, 0xffffff],
  [16,  0x92cbe4, 1.00, 0xffedc0, 1.10, 0xfff5e8],
  [17.5,0xf7a45e, 0.85, 0xff8a3a, 1.9,  0xffe0bc],          // 夕日（太陽を主役に）
  [18.7,0xe06a45, 0.52, 0xff6a30, 0.60, 0xd9a890],          // 日没
  [19.6,0x1d2c4a, 0.42, 0x6f86c0, 0.16, 0x7690b0],          // 宵
  [24,  0x101d33, 0.36, 0x6f86c0, 0.18, 0x7086ab],
];
const _cA=new THREE.Color(), _cB=new THREE.Color();
function lerpHex(a,b,t,into){ _cA.setHex(a); _cB.setHex(b); into.copy(_cA).lerp(_cB,t); return into; }
const skyC=new THREE.Color(), sunC=new THREE.Color(), tintC=new THREE.Color();
function applyTimeOfDay(){
  const h=gameHour%24;
  let i=0; while(i<KEYS.length-1 && KEYS[i+1][0]<h) i++;
  const A=KEYS[i], B=KEYS[Math.min(i+1,KEYS.length-1)];
  const t=(h-A[0])/Math.max(0.001,(B[0]-A[0]));
  scene.background = lerpHex(A[1],B[1],t,skyC);
  hemi.intensity = A[2]+(B[2]-A[2])*t;
  hemi.color.copy(skyC).lerp(_cA.setHex(0xffffff), 0.35);   // 環境光の「色」も空に合わせる（夕方の空気感の正体）
  sun.color.copy(lerpHex(A[3],B[3],t,sunC));
  sun.intensity = A[4]+(B[4]-A[4])*t;
  lerpHex(A[5],B[5],t,tintC).lerp(_cA.setHex(0xffffff), 0.35);   // 乗算は控えめに（泥色化防止）
  for(const m of TOD.tint) m.color.copy(tintC);
  // 太陽の位置: 朝は陸側から昇り、夕方は海の向こうへ沈む
  const dayT=Math.min(1,Math.max(0,(h-6)/12.7));
  sun.position.set(Math.cos(dayT*Math.PI)*70, Math.sin(dayT*Math.PI)*75+6, 20+dayT*45);
  // 窓明かりと街灯: 夕方から灯り朝に消える
  const n = (h>=16.8 ? Math.min(1,(h-16.8)/1.4) : (h<6.8 ? 1-Math.max(0,(h-5.2)/1.6) : 0));   // 夕暮れに早めに灯る
  for(const m of TOD.windows) m.emissiveIntensity = 0.06 + n*1.5;
  for(const m of TOD.lamps)   m.emissiveIntensity = 0.05 + n*2.2;
  for(const p of TOD.pools)   p.mat.opacity = n * p.maxOp;
  const hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  clockEl.textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

// ================= ゲームループ（道場第1週と同じ心臓！）=================
const SPEED=6.5;
const camOff=new THREE.Vector3(14, 24, 22);     // 海側上空から陸へ＝店の顔が見えて、手前に浜が入るBuildIt構図
const camLook=new THREE.Vector3();
let last=performance.now();
function tick(now){
  const delta=Math.min(0.05,(now-last)/1000); last=now;    // delta秒（道場で学ぶやつ）
  gameHour=(gameHour + delta*24/DAY_SEC)%24;               // 時間が流れる
  applyTimeOfDay();
  // --- 入力 → 移動方向（優先度: パッド > キー > タップ目的地）---
  const dir=new THREE.Vector3();
  let power=1;                                              // パッドの倒し具合＝歩く速さ（アナログ）
  if(padVec.on && Math.hypot(padVec.x,padVec.y)>0.12){
    // 画面の上=カメラの向く先、として世界方向へ変換
    const fwd=new THREE.Vector3(-camOff.x,0,-camOff.z).normalize();
    const right=new THREE.Vector3(-fwd.z,0,fwd.x);
    dir.addScaledVector(right, padVec.x).addScaledVector(fwd, -padVec.y);
    power=Math.min(1, Math.hypot(padVec.x,padVec.y));
    dir.normalize(); target=null;
  }
  else {
    if(keys['w']||keys['arrowup'])    { dir.x-=1; dir.z-=1; }
    if(keys['s']||keys['arrowdown'])  { dir.x+=1; dir.z+=1; }
    if(keys['a']||keys['arrowleft'])  { dir.x-=1; dir.z+=1; }
    if(keys['d']||keys['arrowright']) { dir.x+=1; dir.z-=1; }
    if(dir.lengthSq()>0){ target=null; dir.normalize(); }
    else if(target){
      const to=new THREE.Vector3().subVectors(target, player.position); to.y=0;
      if(to.length()<0.25) target=null;
      else dir.copy(to.normalize());
    }
  }
  // --- 移動＋向き ---
  if(dir.lengthSq()>0){
    player.position.addScaledVector(dir, SPEED*power*delta);
    player.position.x=Math.max(-82, Math.min(82, player.position.x));
    player.position.z=Math.max(-70, Math.min(24, player.position.z));
    // 建物にめり込まない（一番浅い方向へ押し出す）
    for(const s of SOLIDS){
      const px=player.position.x, pz=player.position.z, r=0.45;
      if(px>s.x0-r && px<s.x1+r && pz>s.z0-r && pz<s.z1+r){
        const dxl=px-(s.x0-r), dxr=(s.x1+r)-px, dzf=pz-(s.z0-r), dzb=(s.z1+r)-pz;
        const m=Math.min(dxl,dxr,dzf,dzb);
        if(m===dxl) player.position.x=s.x0-r;
        else if(m===dxr) player.position.x=s.x1+r;
        else if(m===dzf) player.position.z=s.z0-r;
        else player.position.z=s.z1+r;
      }
    }
    const yaw=Math.atan2(dir.x, dir.z);
    let d=yaw-player.rotation.y;
    while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    player.rotation.y+=d*Math.min(1, delta*12);
  }
  // 地面の高さに立つ
  player.position.y = Math.max(0.5, groundH(player.position.x, player.position.z));
  // --- 追従カメラ（少し遅れてついてくる＝気持ちよさの秘訣）---
  const wantPos=new THREE.Vector3().addVectors(player.position, camOff);
  cam.position.lerp(wantPos, Math.min(1, delta*4));
  camLook.lerp(player.position, Math.min(1, delta*6));
  cam.lookAt(camLook.x, camLook.y+1.0, camLook.z+3.5);   // 注視点を少し海側へ＝画面下に浜と海が入る
  renderer.render(scene, cam);
}
cam.position.copy(player.position).add(camOff);
camLook.copy(player.position);
renderer.setAnimationLoop(tick);
</script>
