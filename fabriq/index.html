<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#080810" />
<title>Fabriq — 社内ワークスペース</title>
<meta name="description" content="Fabriq：プロジェクトとチャンネルで動く、足立 開の社内ワークスペース。MOMENTUM をはじめ、プロジェクトをここで回す。" />
<style>
  :root{
    --bg:#080810; --bg2:#0d0d1a;
    --panel:rgba(20,20,38,0.55); --panel2:rgba(30,30,54,0.6); --panel3:rgba(40,40,70,0.5);
    --stroke:rgba(255,255,255,0.08); --stroke2:rgba(255,255,255,0.14);
    --text:#e9e9f4; --muted:#9aa0b8; --faint:#6b7088;
    --violet:#8b5cf6; --cyan:#22d3ee; --pink:#f472b6; --green:#34d399; --amber:#fbbf24;
    --grad:linear-gradient(135deg,#8b5cf6,#22d3ee);
    --grad-soft:linear-gradient(135deg,rgba(139,92,246,.18),rgba(34,211,238,.18));
    --radius:14px; --radius-sm:10px;
    --sidebar:264px;
    --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--font);color:var(--text);
    background:radial-gradient(1200px 800px at 80% -10%,rgba(139,92,246,.18),transparent 60%),
               radial-gradient(1000px 700px at -10% 110%,rgba(34,211,238,.14),transparent 55%),
               var(--bg);
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  /* starfield */
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;
    background-image:
      radial-gradient(1px 1px at 20% 30%,#fff,transparent),
      radial-gradient(1px 1px at 70% 60%,#cfd3ff,transparent),
      radial-gradient(1px 1px at 40% 80%,#fff,transparent),
      radial-gradient(1.4px 1.4px at 85% 20%,#a5b4ff,transparent),
      radial-gradient(1px 1px at 55% 15%,#fff,transparent),
      radial-gradient(1px 1px at 12% 70%,#bcd,transparent),
      radial-gradient(1.2px 1.2px at 90% 85%,#fff,transparent);
    background-repeat:no-repeat;animation:twinkle 6s ease-in-out infinite alternate;}
  @keyframes twinkle{from{opacity:.35}to{opacity:.7}}

  .app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar) 1fr;height:100dvh}

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:linear-gradient(180deg,rgba(16,16,32,.85),rgba(10,10,22,.92));
    border-right:1px solid var(--stroke);backdrop-filter:blur(14px);
    display:flex;flex-direction:column;min-height:0;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:18px 16px 14px;border-bottom:1px solid var(--stroke)}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;
    font-size:20px;box-shadow:0 6px 20px rgba(139,92,246,.45)}
  .brand h1{font-size:17px;margin:0;letter-spacing:.3px;font-weight:800;
    background:linear-gradient(90deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .sub{font-size:11px;color:var(--muted);margin-top:1px}

  .nav{flex:1;overflow-y:auto;padding:12px 10px 8px;min-height:0}
  .nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}
  .sec{margin:6px 0 14px}
  .sec-h{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;margin-bottom:4px}
  .sec-h span{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--faint);text-transform:uppercase}
  .sec-h button{all:unset;cursor:pointer;color:var(--faint);font-size:16px;line-height:1;padding:0 4px;border-radius:6px}
  .sec-h button:hover{color:var(--text);background:rgba(255,255,255,.06)}

  .item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);
    cursor:pointer;color:var(--muted);font-size:14.5px;position:relative;transition:.12s}
  .item:hover{background:rgba(255,255,255,.05);color:var(--text)}
  .item.active{background:var(--grad-soft);color:#fff;font-weight:600}
  .item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
    width:3px;height:18px;border-radius:3px;background:var(--grad)}
  .item .hash{color:var(--faint);font-weight:600}
  .item.active .hash{color:var(--cyan)}
  .item .ic{width:18px;text-align:center}
  .item .badge{margin-left:auto;font-size:10px;background:var(--violet);color:#fff;border-radius:10px;padding:1px 6px;font-weight:700}

  .me{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--stroke)}
  .me .status{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}

  .avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#0b0b14;flex:none}
  .avatar.lg{width:40px;height:40px;border-radius:11px;font-size:16px}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--stroke);
    background:rgba(10,10,22,.5);backdrop-filter:blur(10px)}
  .topbar .hb{display:none;all:unset;cursor:pointer;font-size:22px;color:var(--text);padding:2px 6px}
  .topbar .title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
  .topbar .title .hash{color:var(--cyan)}
  .topbar .topic{color:var(--muted);font-size:12.5px;border-left:1px solid var(--stroke2);padding-left:12px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  .topbar .right{margin-left:auto;display:flex;gap:8px}
  .chip{font-size:12px;color:var(--muted);border:1px solid var(--stroke);border-radius:20px;padding:5px 11px;display:flex;gap:6px;align-items:center}

  .content{flex:1;overflow-y:auto;min-height:0;padding:8px 0 4px}
  .content::-webkit-scrollbar{width:10px}.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:8px}

  /* messages */
  .day{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:11.5px;margin:14px 22px 6px}
  .day::before,.day::after{content:"";flex:1;height:1px;background:var(--stroke)}
  .msg{display:flex;gap:12px;padding:8px 22px;transition:.1s}
  .msg:hover{background:rgba(255,255,255,.025)}
  .msg .body{min-width:0}
  .msg .head{display:flex;align-items:baseline;gap:9px}
  .msg .name{font-weight:700;font-size:14px}
  .msg .time{color:var(--faint);font-size:11px}
  .msg .text{color:#dcdcea;font-size:14.5px;line-height:1.6;margin-top:2px;white-space:pre-wrap;word-break:break-word}
  .msg .text a{color:var(--cyan)}
  .bot-tag{font-size:9px;background:rgba(34,211,238,.16);color:var(--cyan);border-radius:5px;padding:1px 5px;font-weight:800;letter-spacing:.4px;transform:translateY(-1px)}

  .pinned{margin:12px 22px 4px;border:1px solid var(--stroke);border-radius:var(--radius);
    background:var(--grad-soft);padding:13px 15px;display:flex;gap:13px;align-items:center}
  .pinned .pe{font-size:26px}
  .pinned .pt{font-weight:700;font-size:14px}
  .pinned .pd{color:var(--muted);font-size:12.5px;margin-top:2px}
  .pinned .pa{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:9px;
    background:var(--grad);color:#0b0b14;text-align:center;box-shadow:0 4px 14px rgba(139,92,246,.3)}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--stroke2);box-shadow:none}
  .btn.ghost:hover{background:rgba(255,255,255,.06)}

  /* composer */
  .composer{padding:12px 20px 18px;border-top:1px solid var(--stroke);background:rgba(10,10,22,.5)}
  .composer .box{display:flex;align-items:flex-end;gap:10px;border:1px solid var(--stroke2);border-radius:var(--radius);
    background:rgba(20,20,40,.6);padding:8px 8px 8px 14px;transition:.15s}
  .composer .box:focus-within{border-color:rgba(139,92,246,.6);box-shadow:0 0 0 3px rgba(139,92,246,.14)}
  .composer textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;
    font-size:14.5px;line-height:1.5;resize:none;max-height:160px;padding:6px 0}
  .composer textarea::placeholder{color:var(--faint)}
  .send{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;background:var(--grad);
    display:grid;place-items:center;color:#0b0b14;flex:none;box-shadow:0 4px 14px rgba(34,211,238,.3)}
  .send:hover{filter:brightness(1.08)} .send:disabled{opacity:.4;cursor:default;filter:none}
  .hint{color:var(--faint);font-size:11px;margin:7px 4px 0}

  /* projects board */
  .board{padding:20px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{border:1px solid var(--stroke);border-radius:var(--radius);background:var(--panel);backdrop-filter:blur(10px);
    padding:18px;display:flex;flex-direction:column;gap:11px;transition:.15s;position:relative;overflow:hidden}
  .card:hover{border-color:var(--stroke2);transform:translateY(-2px);box-shadow:0 12px 34px rgba(0,0,0,.35)}
  .card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);opacity:.9}
  .card .ce{font-size:30px}
  .card .cn{font-size:17px;font-weight:800}
  .card .cd{color:var(--muted);font-size:13px;line-height:1.55;flex:1}
  .card .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--stroke2);color:var(--muted)}
  .pill.dev{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
  .pill.plan{color:var(--amber);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
  .pill.done{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
  .owner{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px}
  .clinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .card.add{border-style:dashed;align-items:center;justify-content:center;color:var(--faint);cursor:pointer;min-height:170px;gap:6px}
  .card.add::after{display:none}
  .card.add:hover{color:var(--text);border-color:var(--violet)}
  .card.add .plus{font-size:34px;line-height:1}

  /* members */
  .mlist{padding:18px 22px;display:flex;flex-direction:column;gap:8px;max-width:680px}
  .mrow{display:flex;align-items:center;gap:13px;border:1px solid var(--stroke);border-radius:var(--radius);
    background:var(--panel);padding:13px 16px}
  .mrow .mn{font-weight:700;font-size:14.5px}
  .mrow .mr{color:var(--muted);font-size:12.5px}
  .mrow .tag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.4px;padding:3px 8px;border-radius:6px}
  .tag.human{background:rgba(139,92,246,.16);color:#c4b5fd}
  .tag.bot{background:rgba(34,211,238,.16);color:var(--cyan)}

  .section-intro{padding:6px 22px 2px;color:var(--muted);font-size:13px}
  .section-title{padding:18px 22px 2px;font-size:20px;font-weight:800;letter-spacing:.3px}
  .section-title .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* mobile */
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5}
  @media(max-width:820px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;z-index:6;width:min(86vw,300px);height:100dvh;transform:translateX(-105%);transition:.25s}
    .sidebar.open{transform:none;box-shadow:0 0 50px rgba(0,0,0,.6)}
    .scrim.show{display:block}
    .topbar .hb{display:block}
    .topbar .topic{max-width:38vw}
    .board{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="stars"></div>
<div class="scrim" id="scrim"></div>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">☄️</div>
      <div>
        <h1>Fabriq</h1>
        <div class="sub" id="wsSub">社内ワークスペース</div>
      </div>
    </div>

    <div class="nav" id="nav">
      <div class="sec">
        <div class="sec-h"><span>ビュー</span></div>
        <div class="item" data-view="projects" id="navProjects"><span class="ic">🗂️</span> プロジェクト</div>
        <div class="item" data-view="members" id="navMembers"><span class="ic">👥</span> メンバー</div>
      </div>

      <div class="sec">
        <div class="sec-h"><span>チャンネル</span><button id="addChannel" title="チャンネルを追加">＋</button></div>
        <div id="channelList"></div>
      </div>
    </div>

    <div class="me" id="meChip"></div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="hb" id="hb">☰</button>
      <div class="title" id="topTitle">#&nbsp;general</div>
      <div class="topic" id="topTopic"></div>
      <div class="right">
        <div class="chip" id="memCount">👥 0</div>
      </div>
    </div>
    <div class="content" id="content"></div>
    <div class="composer" id="composer" style="display:none">
      <div class="box">
        <textarea id="input" rows="1" placeholder="メッセージを送信"></textarea>
        <button class="send" id="send" title="送信 (Enter)">➤</button>
      </div>
      <div class="hint">Enterで送信 / Shift+Enterで改行 — このワークスペースの記録は端末内(localStorage)に保存されます。</div>
    </div>
  </main>
</div>

<script>
/* =========================================================================
   Fabriq — 単一ファイル社内ワークスペース（依存ゼロ・バニラJS・localStorage）
   MOMENTUM を「最初のプロジェクト + #momentum チャンネル」として同梱。
   ========================================================================= */
const LS_KEY = "fabriq_state_v1";
const ME = "kai";

const COLORS = {
  violet:"linear-gradient(135deg,#8b5cf6,#a78bfa)",
  cyan:"linear-gradient(135deg,#22d3ee,#67e8f9)",
  pink:"linear-gradient(135deg,#f472b6,#fb7185)",
  green:"linear-gradient(135deg,#34d399,#6ee7b7)",
  amber:"linear-gradient(135deg,#fbbf24,#fcd34d)"
};

/* ---- 初期シード ---- */
function seed(){
  const t = (h,m)=> new Date(2026,5,23,h,m).getTime(); // 2026-06-23
  return {
    workspace:{ name:"Fabriq", sub:"社内ワークスペース" },
    members:[
      {id:"kai",   name:"足立 開",  role:"Founder / Project Lead", color:"violet", bot:false},
      {id:"cosmo", name:"Cosmo",    role:"PM・進行（planning）",   color:"cyan",   bot:true},
      {id:"aria",  name:"Aria",     role:"クリエイティブ（creative）", color:"pink", bot:true},
      {id:"rin",   name:"Rin",      role:"バックオフィス（backoffice）", color:"green", bot:true}
    ],
    channels:[
      {id:"general",  name:"general",  topic:"全体連絡・母艦", projectId:null},
      {id:"momentum", name:"momentum", topic:"プロジェクト『MOMENTUM』専用", projectId:"momentum"},
      {id:"ideas",    name:"ideas",    topic:"アイデア・ネタの種", projectId:null},
      {id:"random",   name:"random",   topic:"雑談", projectId:null}
    ],
    projects:[
      {
        id:"momentum", name:"MOMENTUM", emoji:"☄️", status:"dev", statusLabel:"開発中・Phase1完成",
        owner:"kai", channelId:"momentum",
        desc:"意志力に頼らない目標達成OS。ビジョン→目標→ロードマップ→今日の一歩を一本の線でつなぐPWA。勢い(Momentum)スコアで継続を可視化。",
        links:[
          {label:"アプリを開く", url:"../momentum/index.html"},
          {label:"README", url:"../momentum/README.md"}
        ]
      }
    ],
    messages:{
      general:[
        {id:"m1", author:"cosmo", ts:t(9,2),  text:"Fabリク、立ち上げ完了 🎉 ここが社内の母艦です。各プロジェクトは左の『プロジェクト』から。チャンネルでやり取りしていきましょう。"},
        {id:"m2", author:"kai",   ts:t(9,8),  text:"いい感じ。まずは MOMENTUM をここで回していく。埋もれないように専用チャンネルも切った。"},
        {id:"m3", author:"rin",   ts:t(9,15), text:"了解です。議事録・タスクはバックオフィス側でも拾っていきます 📝"}
      ],
      momentum:[
        {id:"m4", author:"cosmo", ts:t(10,1),  text:"📌 プロジェクト『MOMENTUM』専用チャンネル。現状：Phase1（販売LP＋アプリ本体／PWA・オフライン対応）完成 ✅"},
        {id:"m5", author:"aria",  ts:t(10,12), text:"次は Phase2：クラウド同期＆ログイン（Firebase Auth/Firestore）。UIは Cosmic Ascent を踏襲で統一感だしましょう ✨"},
        {id:"m6", author:"kai",   ts:t(10,20), text:"ロードマップ画面のタイムライン、ズームが気持ちいいから推しポイントにしたい。LPのファーストビューでも見せよう。"},
        {id:"m7", author:"cosmo", ts:t(10,24), text:"上のピン留めから『アプリを開く』で本体に飛べます。タスク化したいものはスレッドで投げてください。"}
      ],
      ideas:[
        {id:"m8", author:"cosmo", ts:t(11,0), text:"思いついたネタはここに気軽に放り込んでください。良さげなものはプロジェクト化します 💡"}
      ],
      random:[
        {id:"m9", author:"rin", ts:t(12,30), text:"☕ 雑談どうぞ〜"}
      ]
    },
    ui:{ view:"channel", channel:"general" }
  };
}

/* ---- 状態の読み込み/保存 ---- */
let S;
function load(){
  try{ S = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ S=null; }
  if(!S || !S.channels){ S = seed(); save(); }
  if(!S.ui) S.ui = {view:"channel", channel:"general"};
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ---- ヘルパー ---- */
const $ = s=>document.querySelector(s);
const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s=>esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const member = id=>S.members.find(m=>m.id===id) || {name:id,color:"violet",bot:false};
const fmtTime = ts=>{const d=new Date(ts);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const fmtDay = ts=>{const d=new Date(ts);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;};
function avatar(id,lg){const m=member(id);const init=(m.name||"?").trim().slice(0,1);
  return `<div class="avatar ${lg?'lg':''}" style="background:${COLORS[m.color]||COLORS.violet}">${esc(init)}</div>`;}

/* ---- レンダリング ---- */
function renderSidebar(){
  $("#wsSub").textContent = S.workspace.sub;
  // channels
  $("#channelList").innerHTML = S.channels.map(c=>{
    const active = S.ui.view==="channel" && S.ui.channel===c.id ? "active":"";
    return `<div class="item ${active}" data-channel="${c.id}"><span class="hash">#</span> ${esc(c.name)}</div>`;
  }).join("");
  // nav highlight
  $("#navProjects").classList.toggle("active", S.ui.view==="projects");
  $("#navMembers").classList.toggle("active", S.ui.view==="members");
  // me
  const me = member(ME);
  $("#meChip").innerHTML = `${avatar(ME)}<div><div style="font-weight:700;font-size:13.5px">${esc(me.name)}</div>
    <div style="color:var(--muted);font-size:11px">${esc(me.role||"")}</div></div><div class="status" title="オンライン"></div>`;
  $("#memCount").textContent = `👥 ${S.members.length}`;
}

function renderMain(){
  const composer = $("#composer");
  if(S.ui.view==="channel"){
    const ch = S.channels.find(c=>c.id===S.ui.channel) || S.channels[0];
    $("#topTitle").innerHTML = `<span class="hash">#</span>&nbsp;${esc(ch.name)}`;
    $("#topTopic").textContent = ch.topic||"";
    composer.style.display = "block";
    renderChannel(ch);
  }else{
    composer.style.display = "none";
    $("#topTitle").innerHTML = S.ui.view==="projects" ? "🗂️&nbsp;プロジェクト" : "👥&nbsp;メンバー";
    $("#topTopic").textContent = S.ui.view==="projects" ? "ここにあるプロジェクトを Fabリクが回す" : "このワークスペースのメンバー";
    if(S.ui.view==="projects") renderProjects(); else renderMembers();
  }
}

function renderChannel(ch){
  const msgs = S.messages[ch.id] || [];
  let html = "";
  // pinned project header
  const proj = ch.projectId && S.projects.find(p=>p.id===ch.projectId);
  if(proj){
    html += `<div class="pinned">
      <div class="pe">${esc(proj.emoji)}</div>
      <div style="min-width:0">
        <div class="pt">プロジェクト：${esc(proj.name)} <span class="pill ${proj.status}">${esc(proj.statusLabel)}</span></div>
        <div class="pd">${esc(proj.desc)}</div>
      </div>
      <div class="pa">${(proj.links||[]).map(l=>`<a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>
    </div>`;
  }
  let lastDay = "";
  msgs.forEach(m=>{
    const day = fmtDay(m.ts);
    if(day!==lastDay){ html += `<div class="day">${day}</div>`; lastDay=day; }
    const mem = member(m.author);
    html += `<div class="msg">${avatar(m.author)}
      <div class="body">
        <div class="head"><span class="name">${esc(mem.name)}</span>
          ${mem.bot?'<span class="bot-tag">BOT</span>':''}
          <span class="time">${fmtTime(m.ts)}</span></div>
        <div class="text">${linkify(m.text)}</div>
      </div></div>`;
  });
  if(!msgs.length) html += `<div class="section-intro" style="padding-top:30px">まだメッセージがありません。最初の一言を書きましょう ✍️</div>`;
  const c = $("#content"); c.innerHTML = html; c.scrollTop = c.scrollHeight;
}

function renderProjects(){
  const cards = S.projects.map(p=>{
    const owner = member(p.owner);
    const links = (p.links||[]).map(l=>`<a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("");
    return `<div class="card">
      <div class="ce">${esc(p.emoji)}</div>
      <div class="cn">${esc(p.name)}</div>
      <div class="meta"><span class="pill ${p.status}">${esc(p.statusLabel)}</span></div>
      <div class="cd">${esc(p.desc)}</div>
      <div class="owner">${avatar(p.owner)} <span>${esc(owner.name)}</span></div>
      <div class="clinks">${links}
        ${p.channelId?`<button class="btn" data-open-channel="${p.channelId}">#${esc((S.channels.find(c=>c.id===p.channelId)||{}).name||p.channelId)} を開く →</button>`:""}
      </div>
    </div>`;
  }).join("");
  const add = `<div class="card add" id="addProject"><div class="plus">＋</div><div>新規プロジェクト</div></div>`;
  $("#content").innerHTML = `<div class="section-title">プロジェクト<span class="accent"> 盤</span></div>
    <div class="section-intro">それぞれのプロジェクトに専用チャンネルが紐づきます。クリックでそのチャンネルへ。</div>
    <div class="board">${cards}${add}</div>`;
}

function renderMembers(){
  const rows = S.members.map(m=>`<div class="mrow">${avatar(m.id,true)}
    <div><div class="mn">${esc(m.name)}</div><div class="mr">${esc(m.role||"")}</div></div>
    <span class="tag ${m.bot?'bot':'human'}">${m.bot?'AI':'HUMAN'}</span></div>`).join("");
  $("#content").innerHTML = `<div class="section-title">メンバー</div>
    <div class="section-intro">人＋AIクルーで構成された Fabリクのチーム。</div>
    <div class="mlist">${rows}</div>`;
}

function render(){ renderSidebar(); renderMain(); }

/* ---- アクション ---- */
function openChannel(id){ S.ui={view:"channel",channel:id}; save(); render(); closeDrawer(); }
function openView(v){ S.ui.view=v; save(); render(); closeDrawer(); }

function post(){
  const inp=$("#input"); const text=inp.value.trim(); if(!text) return;
  if(S.ui.view!=="channel") return;
  const ch=S.ui.channel;
  (S.messages[ch]=S.messages[ch]||[]).push({id:"m"+Date.now(), author:ME, ts:Date.now(), text});
  inp.value=""; autosize(); save();
  const c=S.channels.find(x=>x.id===ch); renderChannel(c);
}

function addChannel(){
  const raw=prompt("新しいチャンネル名（# は不要）"); if(!raw) return;
  const name=raw.trim().replace(/^#/,"").replace(/\s+/g,"-").toLowerCase();
  if(!name) return;
  if(S.channels.some(c=>c.id===name)){ openChannel(name); return; }
  S.channels.push({id:name,name,topic:"",projectId:null}); S.messages[name]=[];
  openChannel(name);
}

function addProject(){
  const name=prompt("プロジェクト名"); if(!name||!name.trim()) return;
  const id="p"+Date.now();
  const chId=name.trim().replace(/\s+/g,"-").toLowerCase().slice(0,24)||id;
  const chan = S.channels.some(c=>c.id===chId)? chId+"-"+Date.now().toString().slice(-4):chId;
  S.channels.push({id:chan,name:chan,topic:`プロジェクト『${name.trim()}』専用`,projectId:id});
  S.messages[chan]=[{id:"m"+Date.now(),author:"cosmo",ts:Date.now(),text:`📌 プロジェクト『${name.trim()}』のチャンネルを作成しました。`}];
  S.projects.push({id,name:name.trim(),emoji:"🚀",status:"plan",statusLabel:"計画中",
    owner:ME,channelId:chan,desc:"（説明はあとで編集）",links:[]});
  save(); openView("projects");
}

/* ---- composer UX ---- */
function autosize(){const t=$("#input");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,160)+"px";}

/* ---- drawer (mobile) ---- */
function openDrawer(){$("#sidebar").classList.add("open");$("#scrim").classList.add("show");}
function closeDrawer(){$("#sidebar").classList.remove("open");$("#scrim").classList.remove("show");}

/* ---- events ---- */
function bind(){
  $("#nav").addEventListener("click",e=>{
    const ch=e.target.closest("[data-channel]"); if(ch){ openChannel(ch.dataset.channel); return; }
    const v=e.target.closest("[data-view]"); if(v){ openView(v.dataset.view); return; }
  });
  $("#addChannel").addEventListener("click",addChannel);
  $("#content").addEventListener("click",e=>{
    const oc=e.target.closest("[data-open-channel]"); if(oc){ openChannel(oc.dataset.openChannel); return; }
    if(e.target.closest("#addProject")){ addProject(); return; }
  });
  $("#send").addEventListener("click",post);
  const inp=$("#input");
  inp.addEventListener("input",autosize);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); post(); }});
  $("#hb").addEventListener("click",openDrawer);
  $("#scrim").addEventListener("click",closeDrawer);
}

/* ---- init ---- */
load(); bind(); render();
</script>
</body>
</html>
