s:20px;padding:3px 10px;margin:2px 3px 2px 0;font-weight:500}.avatar{width:40px;height:40px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0}.avatar.sm{width:32px;height:32px;font-size:13px}.avatar.lg{width:72px;height:72px;font-size:28px;border:3px solid white;box-shadow:var(--shadow-md)}.divider{height:1px;background:var(--border);margin:0}.icon-btn{background:none;border:none;cursor:pointer;padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:background .15s}.icon-btn:active{background:#0000000f}@keyframes fadeInUp{0%{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeInUp .3s ease both}@keyframes slideUp{0%{transform:translateY(100%)}to{transform:translateY(0)}}.slide-up{animation:slideUp .32s cubic-bezier(.34,1.12,.64,1) both}@keyframes shimmer{0%{background-position:-200% 0}to{background-position:200% 0}}.skeleton{background:linear-gradient(90deg,#f0eeff 25%,#e8e4f8,#f0eeff 75%);background-size:200% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px}

<div id="root"></div>
<script>
const MOCK_POSTS=[
  {id:'1',userId:'1',name:'みお',username:'mio_98',era:'1998年生まれ',ageLabel:'26歳',birthYear:1998,text:'ふと、思ったこと。\n将来のことを考えると、\n不安になるけど、\nそれ以上にワクワクしてる。',tags:['#将来のこと','#モヤモヤ'],resonances:128,comments:23,shares:12,createdAt:'2024-05-18T10:00:00Z',type:'now'},
  {id:'2',userId:'2',name:'jun',username:'jun_70s',era:'1970年代生まれ',ageLabel:'50代',birthYear:1973,text:'若い頃の自分へ。\n焦らなくていいよ。\n道は、ちゃんと\nあとからつながってる。',tags:['#若い頃へ','#人生'],resonances:96,comments:12,shares:8,createdAt:'2024-05-18T09:00:00Z',type:'past'},
  {id:'3',userId:'3',name:'はる',username:'haru_05',era:'2005年生まれ',ageLabel:'19歳',birthYear:2005,text:'みんなと同じように\nできない自分が嫌になる日もある。\nでも、その日もきっと意味がある。',tags:[],resonances:45,comments:7,shares:3,createdAt:'2024-05-17T20:00:00Z',type:'future'},
  {id:'4',userId:'2',name:'jun',username:'jun_70s',era:'1970年代生まれ',ageLabel:'50代',birthYear:1973,text:'30代の頃、夢を諦めかけた。\nでも続けてよかった。\nあなたも、まだ諦めないで。',tags:['#夢','#人生'],resonances:203,comments:31,shares:19,createdAt:'2024-05-16T15:00:00Z',type:'past'},
  {id:'5',userId:'1',name:'みお',username:'mio_98',era:'1998年生まれ',ageLabel:'26歳',birthYear:1998,text:'10年後の自分へ。\nあの時の決断は正しかったですか？\n今は怖くて仕方ないけど、進んでいます。',tags:['#10年後へ','#将来のこと'],resonances:76,comments:18,shares:5,createdAt:'2024-05-15T12:00:00Z',type:'now'},
  {id:'6',userId:'3',name:'はる',username:'haru_05',era:'2005年生まれ',ageLabel:'19歳',birthYear:2005,text:'就活がこんなに辛いとは思わなかった。\n先輩たち、どうやって乗り越えたんですか？',tags:['#就活','#モヤモヤ'],resonances:112,comments:42,shares:7,createdAt:'2024-05-14T18:00:00Z',type:'future'}
];
const MOCK_COMMENTS=[
  {id:'c1',postId:'1',name:'はる',username:'haru_05',era:'2005年生まれ',ageLabel:'19歳',text:'ありがとうございます。今、すごく救われました。',resonances:32},
  {id:'c2',postId:'1',name:'みお',username:'mio_98',era:'1998年生まれ',ageLabel:'26歳',text:'泣きそうになった。\nいつか、私も誰かに届けたい。',resonances:18},
  {id:'c3',postId:'2',name:'はる',username:'haru_05',era:'2005年生まれ',ageLabel:'19歳',text:'「道はあとからつながる」って言葉、刺さりました。',resonances:24}
];
window.__M__={posts:MOCK_POSTS,comments:MOCK_COMMENTS};
const _f=window.fetch.bind(window);
window.fetch=function(url,opts){
  const s=typeof url==='string'?url:(url&&url.url)||'';
  if(!s.startsWith('/api'))return _f(url,opts);
  const method=(opts&&opts.method)||'GET';
  const p=s.replace('/api','').split('?')[0];
  const ok=(d,st=200)=>Promise.resolve({ok:st<400,status:st,json:()=>Promise.resolve(d)});
  if(method==='GET'&&p==='/posts'){
    const q=s.includes('?')?new URLSearchParams(s.split('?')[1]):new URLSearchParams();
    let r=[...window.__M__.posts];
    const t=q.get('type');if(t&&t!=='all')r=r.filter(x=>x.type===t);
    const qk=q.get('q');if(qk)r=r.filter(x=>x.text.includes(qk)||x.tags.some(t=>t.includes(qk)));
    return ok(r);
  }
  if(method==='GET'&&p.match(/^\/posts\/[^/]+$/)&&!p.includes('comments')){
    const id=p.split('/')[2];
    const post=window.__M__.posts.find(x=>x.id===id);
    return post?ok(post):ok({error:'Not found'},404);
  }
  if(method==='POST'&&p==='/posts'){
    const b=JSON.parse(opts.body||'{}');
    const np={id:Date.now().toString(),...b,resonances:0,comments:0,shares:0,createdAt:new Date().toISOString()};
    window.__M__.posts.unshift(np);return ok(np,201);
  }
  if(method==='POST'&&p.includes('/resonate')){
    const id=p.split('/')[2];
    const post=window.__M__.posts.find(x=>x.id===id);
    if(post)post.resonances++;return ok(post);
  }
  if(method==='GET'&&p.match(/\/posts\/[^/]+\/comments/)){
    const id=p.split('/')[2];
    return ok(window.__M__.comments.filter(c=>c.postId===id));
  }
  if(method==='POST'&&p==='/comments'){
    const b=JSON.parse(opts.body||'{}');
    const nc={id:Date.now().toString(),...b,resonances:0,createdAt:new Date().toISOString()};
    window.__M__.comments.push(nc);
    const post=window.__M__.posts.find(x=>x.id===b.postId);
    if(post)post.comments++;return ok(nc,201);
  }
  if(method==='GET'&&p.match(/^\/users\//)){
    return ok({id:'1',name:'みお',username:'mio_98',era:'1998年生まれ',ageLabel:'26歳',bio:'未来の自分に、ちょっと期待してる。\n今を、ちゃんと生きたい。',postCount:128,resonanceCount:342,timeleapCount:78,posts:window.__M__.posts.filter(x=>x.userId==='1')});
  }
  if(method==='GET'&&p==='/notifications'){
    return ok([
      {id:'n1',type:'resonance',message:'@haru_05 さんがあなたの投稿に「共鳴」しました。',read:false,createdAt:'2024-05-18T11:05:00Z'},
      {id:'n2',type:'timeleap',message:'あなたの声に、1970年代生まれの方が返信しました。',read:false,createdAt:'2024-05-18T11:00:00Z'},
      {id:'n3',type:'today',message:'今日の1通が更新されました。',read:true,createdAt:'2024-05-18T08:00:00Z'},
      {id:'n4',type:'follow',message:'@mio_98 さんがあなたをフォローしました。',read:true,createdAt:'2024-05-18T07:30:00Z'},
      {id:'n5',type:'milestone',message:'あなたの投稿が100回共鳴されました！🎉',read:true,createdAt:'2024-05-18T05:00:00Z'}
    ]);
  }
  if(p.includes('/read'))return ok({ok:true});
  if(method==='GET'&&p==='/today'){
    return ok({fromEra:'1970年代生まれ',fromAgeLabel:'50代',toEra:'20代',text:'「大丈夫。\nなんとかなるよ、\nきっと。」',username:'jun_70s',pastMessages:[{id:'p1',text:'若さは最強の武器。',fromEra:'60代',date:'5/17'},{id:'p2',text:'失敗を恐れるな。',fromEra:'40代',date:'5/16'},{id:'p3',text:'今この瞬間を大事に。',fromEra:'50代',date:'5/15'}]});
  }
  if(method==='GET'&&p==='/timecapsules')return ok([{id:'tc1',text:'3年後の自分へ。\nその時のあなたに、\n伝えたいことを。',deliverAt:'2027-05-18',status:'pending'}]);
  if(method==='POST'&&p==='/timecapsules'){
    const b=JSON.parse(opts.body||'{}');
    return ok({id:Date.now().toString(),...b,status:'pending',createdAt:new Date().toISOString()},201);
  }
  if(method==='GET'&&p==='/tags/popular'){
    return ok([{tag:'#将来のこと',count:12345},{tag:'#恋愛',count:8765},{tag:'#仕事',count:9301},{tag:'#人生',count:15679},{tag:'#夢',count:6543},{tag:'#家族',count:7890},{tag:'#モヤモヤ',count:5432},{tag:'#感謝',count:9001}]);
  }
  return ok({error:'not found'},404);
};
