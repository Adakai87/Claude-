<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>マイシティ — 市長モード（第一歩）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue1:#5bc6f0; --blue2:#2e9ad8; --navy:rgba(16,52,88,.92);
    --green1:#8ee06a; --green2:#45b13a; --red1:#ff8a7a; --red2:#e8503f;
    --cream:#fff8ea; --gold:#ffc63f;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:#79c7e3;touch-action:none;
    font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',system-ui,sans-serif}
  #app{position:fixed;inset:0}
  .btn{border:none;color:#fff;font-family:inherit;font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none;
    text-shadow:0 2px 0 rgba(0,0,60,.25);
    background:linear-gradient(#5bc6f0,#2e9ad8);
    border:3px solid #fff;border-radius:20px;
    box-shadow:0 4px 10px rgba(10,40,80,.35), inset 0 -5px 0 rgba(10,40,90,.28), inset 0 2px 0 rgba(255,255,255,.45);}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 5px rgba(10,40,80,.35), inset 0 -3px 0 rgba(10,40,90,.28)}
  .btn.green{background:linear-gradient(var(--green1),var(--green2))}
  .btn.red{background:linear-gradient(var(--red1),var(--red2))}
  /* 上部HUD */
  #cityname{position:fixed;left:12px;top:12px;color:#fff;font-weight:900;font-size:15px;letter-spacing:1px;
    background:var(--navy);padding:8px 18px;border-radius:20px;border:2.5px solid rgba(255,255,255,.85);
    box-shadow:0 3px 8px rgba(10,40,80,.3)}
  #dive{position:fixed;right:12px;top:12px;padding:9px 16px;font-size:14px;border-radius:20px}
  /* 建設ボタン（右下の大きな丸） */
  #build{position:fixed;right:18px;bottom:22px;width:74px;height:74px;border-radius:50%;font-size:32px;line-height:1}
  /* 建設メニュー（下からのパネル） */
  #menu{position:fixed;left:0;right:0;bottom:0;background:var(--navy);border-radius:22px 22px 0 0;
    padding:10px 12px calc(14px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .22s ease;
    box-shadow:0 -6px 24px rgba(10,30,60,.35);border-top:3px solid rgba(255,255,255,.7)}
  #menu.show{transform:translateY(0)}
  #menu .handle{width:52px;height:5px;border-radius:3px;background:rgba(255,255,255,.5);margin:2px auto 10px}
  #tabs{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px}
  .tab{flex:0 0 auto;color:#dceefc;font-weight:800;font-size:13px;padding:7px 14px;border-radius:16px;
    background:rgba(255,255,255,.13);border:2px solid transparent;cursor:pointer}
  .tab.sel{background:#fff;color:#1d6fae;border-color:var(--gold)}
  #items{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px}
  .card{flex:0 0 auto;width:96px;background:var(--cream);border-radius:16px;padding:8px 6px 7px;text-align:center;
    border:3px solid #f0e2c4;box-shadow:0 3px 6px rgba(60,40,10,.18);cursor:pointer}
  .card .ic{font-size:30px;line-height:1.2}
  .card .nm{font-size:12px;font-weight:800;color:#5a4a30;margin-top:3px}
  .card.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,198,63,.45),0 3px 6px rgba(60,40,10,.18)}
  .card.dis{opacity:.45;filter:grayscale(.4)}
  /* 敷設モードUI */
  #modebar{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:none;align-items:center;gap:10px}
  #modebar.show{display:flex}
  #modetext{color:#fff;font-weight:800;font-size:14px;background:var(--navy);
    padding:9px 18px;border-radius:20px;border:2.5px solid rgba(255,255,255,.85)}
  #cancel{position:fixed;left:18px;bottom:26px;width:44px;height:44px;border-radius:50%;font-size:19px;padding:0;
    display:none}   /* 建設中の✕は左下（親指が届く位置）。modebarと連動表示 */
  #modebar.show + #cancel{display:block}
  #confirm{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:none;
    padding:13px 30px;font-size:17px;border-radius:26px}
  #confirm.show{display:block}
  /* 敷設モード中の画面フチ */
  #modeframe{position:fixed;inset:0;pointer-events:none;display:none;
    box-shadow:inset 0 0 0 4px rgba(255,198,63,.9), inset 0 0 26px rgba(255,198,63,.35);border-radius:2px}
  #modeframe.show{display:block}
  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);color:#fff;font-weight:800;font-size:14px;
    background:var(--navy);padding:10px 20px;border-radius:20px;border:2.5px solid rgba(255,255,255,.85);
    opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
  #clock{position:fixed;left:12px;top:58px;color:#fff;font-weight:800;font-size:14px;letter-spacing:1px;
    background:var(--navy);padding:6px 14px;border-radius:16px;border:2.5px solid rgba(255,255,255,.85)}
  #money,#pop,#daily{position:fixed;left:12px;color:#fff;font-weight:800;font-size:14px;letter-spacing:.5px;
    background:var(--navy);padding:6px 14px;border-radius:16px;border:2.5px solid rgba(255,255,255,.85)}
  #money{top:100px;color:var(--gold)} #pop{top:142px} #daily{top:184px;color:#8fe8a0}
  #skip{position:fixed;left:178px;top:56px;padding:6px 13px;font-size:13px;border-radius:16px}
  #reset{position:fixed;left:12px;top:228px;width:38px;height:38px;border-radius:50%;font-size:16px;padding:0;opacity:.85}
  #share{position:fixed;left:12px;top:274px;width:38px;height:38px;border-radius:50%;font-size:15px;padding:0;opacity:.85}
  #sharepanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--navy);
    border:2.5px solid rgba(255,255,255,.85);border-radius:18px;padding:16px;width:min(420px,92vw);
    box-shadow:0 6px 20px rgba(10,40,80,.5);display:none;z-index:20;text-align:center}
  #sharepanel.show{display:block}
  #sharetext{width:100%;height:110px;border-radius:10px;border:2px solid rgba(255,255,255,.4);
    background:#0d2846;color:#cfe4f4;font-size:10px;font-family:monospace;padding:8px;resize:none;box-sizing:border-box}
  #bpanel{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);border-radius:18px;
    padding:12px 18px;border:2.5px solid rgba(255,255,255,.85);text-align:center;display:none;min-width:220px}
  #bpanel.show{display:block}
  #bptitle{color:#fff;font-weight:900;font-size:15px}
  #bpbody{color:#cfe4f4;font-weight:700;font-size:13px;margin-top:2px}
  /* 歩きモード用UI */
  #pad{position:fixed;left:22px;bottom:22px;width:124px;height:124px;border-radius:50%;
    background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);touch-action:none;z-index:10;display:none}
  #pad.show{display:block}
  #stick{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;
    background:rgba(255,255,255,.55);border:2px solid rgba(255,255,255,.8);transform:translate(-50%,-50%)}
  #mayorbtn{position:fixed;right:12px;top:12px;padding:9px 16px;font-size:14px;border-radius:20px;display:none}
  #mayorbtn.show{display:block}
</style>

<body>
<div id="app"></div>
<div id="cityname">🏙️ マイシティ</div>
<div id="clock">Day 1・10:00</div>
<button class="btn" id="skip">⏭ 次の日</button>
<div id="money">💰 ¥2.5億</div>

<button class="btn red" id="reset">🗑️</button>

<div id="sharepanel">
  <div style="color:#fff;font-weight:900;font-size:15px;margin-bottom:8px">📋 街のデータ共有</div>

  <div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
    <button class="btn green" id="shcopy">📤 コピー</button>

    <button class="btn red" id="shclose" style="width:44px;border-radius:50%;padding:0">✕</button>
  </div>
  <div style="color:#8fa8c7;font-size:11px;font-weight:700;margin-top:8px;line-height:1.5">
    コピーしてチャットに貼れば開発者が同じ街を再現できます。<br>貼り付けて「読み込む」でバックアップ復元もOK。</div>
</div>
<button class="btn" id="dive">🚶 ダイブイン</button>
<button class="btn" id="build">🔨</button>

<div id="menu">
  <div class="handle"></div>
  <div id="tabs">
    <div class="tab sel" data-tab="road">🛣️ 道路</div>
    <div class="tab" data-tab="home">🏠 住宅</div>
    <div class="tab" data-tab="shop">🏪 商業</div>
    <div class="tab" data-tab="civic">🏛️ 公共</div>
    <div class="tab" data-tab="deco">🌳 装飾</div>
  </div>
  <div id="items"></div>
</div>

<div id="modebar"><div id="modetext">道路をなぞって敷こう</div></div>

<button class="btn" id="mayorbtn">🗺️ 市長ビュー</button>
<div id="pad"><div id="stick"></div></div>
<button class="btn green" id="confirm">✓ 建設</button>
<div id="modeframe"></div>
<div id="toast"></div>

  <div id="bptitle">🏬 マンション</div>
  <div id="bpbody">3階建て</div>
  <div style="display:flex;gap:10px;justify-content:center;margin-top:8px">
    <button class="btn green" id="bpup">⬆️ 増築する</button>
    <button class="btn red" id="bpclose" style="width:44px;height:44px;border-radius:50%;padding:0">✕</button>
  </div>
</div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

// ================= 基本 =================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd3ea);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.2;
document.getElementById('app').appendChild(renderer.domElement);

const cam=new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 1, 1600);
scene.fog=new THREE.Fog(0x8fd3ea, 520, 1400);          // 遠景をうっすら空に溶かす（近距離プレイには影響しない）
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
const q=new URLSearchParams(location.search);
const hemi=new THREE.HemisphereLight(0xfff8ea,0x7fae8a,1.0); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0,1.15); sun.position.set(60,90,30);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-120; sun.shadow.camera.right=120; sun.shadow.camera.top=120; sun.shadow.camera.bottom=-120;
scene.add(sun);

const TOD={tint:[],windows:[],glow:[]};   // 昼夜が色を触る材質の登録簿（glow=光だまりの透明度）

// ================= 経済（フェーズ3: お金と人口） =================
const M_=10000, OKU=100000000;                       // 万・億
const COSTS={ road:1000000, cottage:20000000, jh_s:22000000, jh_m:35000000,
  mod_s:25000000, mod_m:40000000, apart:60000000, mansion:150000000, lux:300000000,
  bakery:40000000, cafe:40000000, flower:40000000, mart:60000000,
  koban:80000000, tree:500000, park:20000000, fountain:50000000 };
const RES={ cottage:4, jh_s:4, jh_m:6, mod_s:4, mod_m:6, apart:12, lux:5, mansionPerFloor:6 };
const RENT_RATE=0.01, TAX_PER_RES=1000;              // 賃料1%/日・住民税¥1,000/人/日（docs/economy.md v3）
const RENT=new Set(['cottage','jh_s','jh_m','mod_s','mod_m','apart','mansion','lux',
                    'bakery','cafe','flower','mart']);   // 賃料が入る建物（公共・装飾は対象外）
let money=250000000;   // 初期資金¥2.5億（最初の街区バスケット×1.2で逆算）
let day=1;
// ---- 建物ライフサイクル（着工日sdだけ保存し、状態は日数差から計算する） ----
const BUILD_DAYS={ cottage:3, jh_s:3, mod_s:3, jh_m:4, mod_m:4, apart:4,
  mansion:5, lux:5, bakery:3, cafe:3, flower:3, mart:4, koban:3,
  tree:0, park:2, fountain:2 };                        // 工事日数（ユーザー決定: 小3/中4/大5）
function stageOf(b){                                   // site=整地 → frame=工事囲い → done=完成
  const dur=BUILD_DAYS[b.type]||0; if(!dur) return 'done';
  const el=day-(b.sd??-999);
  if(el>=dur) return 'done';
  return el<Math.max(1,Math.round(dur*0.4)) ? 'site' : 'frame';
}
function occOf(b){                                     // 入居済み人数（一軒家=一気、集合住宅=順次）
  const dur=BUILD_DAYS[b.type]||0;
  const el=day-(b.sd??-999)-dur;                       // 完成からの日数
  if(el<0) return 0;
  const cap= b.type==='mansion' ? RES.mansionPerFloor*b.floors : (RES[b.type]||0);
  if(!cap) return 0;
  const rc=homeRoadCell(b);
  if(!rc || !CONN[rc[1]*N+rc[0]]) return 0;            // 幹線道路に未接続=別世界から移住が来られない
  if(b.type==='apart')   return Math.min(cap, 4*el);                    // 4人/日
  if(b.type==='mansion') return Math.min(cap, RES.mansionPerFloor*el);  // 1フロア/日
  return el>=1 ? cap : 0;                              // 一軒家は完成の翌日に一気に入居
}
function bldInvested(b){                             // 建設費＋増築の累計投資額（賃料の元本）
  let c=COSTS[b.type]||0;
  if(b.type==='mansion'&&b.floors>3) c+=50000000*(((b.floors-2)*(b.floors-1))/2-1);
  return c;
}
function calcDaily(){
  let rent=0;
  for(const b of buildingsRef()){
    if(!RENT.has(b.type)) continue;
    if(stageOf(b)!=='done') continue;                  // 工事中は収入ゼロ
    const cap= b.type==='mansion' ? RES.mansionPerFloor*b.floors : (RES[b.type]||0);
    if(cap>0){ const o=occOf(b); if(o>0) rent+=bldInvested(b)*RENT_RATE*(o/cap); }   // 入居率に比例
    else rent+=bldInvested(b)*RENT_RATE;               // 商業はお披露目=開店から満額
  }
  rent=Math.round(rent);
  const tax=calcPop()*TAX_PER_RES;
  return {rent, tax, total:rent+tax};
}
function newDay(){                                   // 0時: 賃料＋住民税を1日分まとめて入金
  const prevOcc=buildingsRef().map(b=>occOf(b));     // 入居の増加検知用（引っ越しトラック）
  day++;
  let fin=0;                                         // 工事の進行と完成チェック
  for(const b of buildingsRef()){
    const prev=b.vstage;
    refreshBuildingVisual(b);
    if(prev&&prev!=='done'&&b.vstage==='done') fin++;
  }
  buildingsRef().forEach((b,ix)=>{                   // 今日入居が増えた家へ引っ越しトラック
    if(occOf(b)>prevOcc[ix]) queueTruck(homeRoadCell(b));
  });
  rebuildNPCs();                                     // 入居が進むと歩く住民も増える
  const d=calcDaily();
  if(d.total>0){
    money+=d.total;
    toast(`🌅 Day ${day}｜収入 +${fmt(d.total)}（賃料${fmt(d.rent)}・住民税${fmt(d.tax)}）`);
  }else{
    toast(`🌅 Day ${day} スタート`);
  }
  if(fin) setTimeout(()=>toast(`🎉 工事完了！新しい建物がお披露目です（${fin}件）`),1900);
  updateHUD(); saveCity();
}
function calcPop(){                                    // 人口=実際に入居した人数
  let p=0;
  for(const b of buildingsRef()) p+=occOf(b);
  return p;
}
let buildingsRef=()=>[];                             // buildings定義後に差し替え
function fmt(n){
  if(n>=OKU){ const o=n/OKU; return '¥'+(o%1? o.toFixed(1) : o)+'億'; }
  if(n>=M_){ return '¥'+Math.floor(n/M_).toLocaleString('ja-JP')+'万'; }
  return '¥'+n.toLocaleString('ja-JP');
}
function updateHUD(){
  document.getElementById('money').textContent='💰 '+fmt(money);
  document.getElementById('pop').textContent='👥 '+calcPop()+'人';
  document.getElementById('daily').textContent='📈 '+fmt(calcDaily().total)+'/日';
}
function pay(cost){
  if(money<cost) return false;
  money-=cost; updateHUD(); return true;
}

// ================= 土地（草原＋南に浜と海＋東の川＋外周の丘） =================
const clamp01=v=>Math.min(1,Math.max(0,v));
const hash=(i,j)=>(((i*73856093^j*19349663)>>>0)%1000)/1000;
const COAST=x=>96+5*Math.sin(x*0.045)+2.5*Math.sin(x*0.13+2);
const RIVX=z=>116+13*Math.sin(z*0.018+2.2)+5*Math.sin(z*0.05+0.7);   // 川の中心線（建設エリアの東外側）
const ssm=u=>{u=Math.max(0,Math.min(1,u));return u*u*(3-2*u);};
const HWX=z=> -90 - 6*ssm((-z-70)/55) + 4*ssm((z-42)/28);            // 幹線道路の中心線（IC付近は直線、北と南で緩カーブ）
const RIVW=z=>6.5+1.5*Math.sin(z*0.045)+Math.max(0,(z-85)*0.3);      // 川幅（河口で広がる）
const sdSea=(x,z)=>COAST(x)-z;
const sdRiv=(x,z)=>Math.abs(x-RIVX(z))-RIVW(z);
const sdLand=(x,z)=>Math.min(sdSea(x,z), sdRiv(x,z));                // 水辺までの距離（海と川の近い方）
const rockF=x=>clamp01((Math.sin(x*0.024+1.2)+Math.sin(x*0.055+0.3))*0.9-0.15);   // 岩場海岸ゾーン(0..1)
function hillH(x,z){                                                 // 外周の丘（建設エリアと水辺では0）
  const m0=clamp01((Math.max(Math.abs(x),Math.abs(z))-92)/26)
           *clamp01((156-Math.max(Math.abs(x),Math.abs(z)))/12)    // マップ外縁では0に戻す（崖の断面が見えないように）
           *clamp01((Math.abs(x-HWX(z))-9)/8);                      // 幹線道路の回廊は平ら（カーブ追従）
  if(m0<=0) return 0;
  const mSea=clamp01((sdSea(x,z)-16)/14), mRiv=clamp01((sdRiv(x,z)-6.5)/10);
  const n=0.5+0.5*Math.sin(x*0.041+1.7)*Math.sin(z*0.036+0.6);
  const n2=0.5+0.5*Math.sin(x*0.017+4.1)*Math.sin(z*0.021+2.3);
  return Math.pow(n*0.55+n2*0.45,1.4)*13*m0*mSea*mRiv;
}
function shoreH(sd,flatEnd,rampEnd){                                 // 水辺の断面（浜→平地）
  if(sd<=0) return -0.1+Math.max(-1.8,sd*0.3);
  if(sd<=1.2) return -0.1+sd*0.2;
  if(sd<=flatEnd) return 0.14;
  if(sd<=rampEnd) return 0.14+(sd-flatEnd)/(rampEnd-flatEnd)*0.36;
  return 0.5;
}
function groundH(x,z){
  const h=Math.min(shoreH(sdSea(x,z),8,14), shoreH(sdRiv(x,z),2.5,6.5));   // 海は広い浜、川は狭い河原
  return h+hillH(x,z);
}
{ // 地形（1mメッシュ: 海岸線なめらか+草地に質感+岩場海岸+川岸+丘の高度色）
  const S=320, ST=1, NVx=S/ST, V=NVx+1, H=S/2;
  const pos=new Float32Array(V*V*3), col=new Float32Array(V*V*3), uv=new Float32Array(V*V*2);
  const g1=new THREE.Color(0x6cb14c), gHi=new THREE.Color(0x4e8f3e), sd1=new THREE.Color(0xf0dca8),
        peb=new THREE.Color(0xb0aa9c), wet=new THREE.Color(0xd9c491), bed=new THREE.Color(0xc9b788);
  const tmp=new THREE.Color(), sand=new THREE.Color();
  for(let j=0;j<V;j++)for(let i=0;i<V;i++){
    const x=-H+i*ST, z=-H+j*ST, o=(j*V+i)*3;
    const s=sdSea(x,z), r=sdRiv(x,z), sd=Math.min(s,r), hh=hillH(x,z);
    pos[o]=x; pos[o+1]=groundH(x,z); pos[o+2]=z;
    uv[(j*V+i)*2]=x/13; uv[(j*V+i)*2+1]=z/13;
    tmp.copy(g1);

const road=new Uint8Array(N*N);                    // 0=なし 1=道路
const ci=x=>Math.floor((x+GH)/CS), cj=z=>Math.floor((z+GH)/CS);
const cx=i=>-GH+i*CS+CS/2, cz=j=>-GH+j*CS+CS/2;
const inGrid=(i,j)=>i>=0&&j>=0&&i<N&&j<N;
const buildable=(i,j)=> inGrid(i,j) && sdLand(cx(i),cz(j))>10;   // 浜と海はNG(赤)

const ENTRIES=[[0,12],[0,26]];                       // 接続口（撤去不可の道路マス）
const isEntry=(i,j)=>ENTRIES.some(e=>e[0]===i&&e[1]===j);
const CONN=new Uint8Array(N*N);                      // 幹線道路に繋がっている道路マス=1
function recomputeConn(){                            // 接続口からBFSで塗る
  CONN.fill(0);
  const q=[];
  for(const [ei,ej] of ENTRIES) if(road[ej*N+ei]){ CONN[ej*N+ei]=1; q.push([ei,ej]); }
  while(q.length){
    const [i,j]=q.pop();
    for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ii=i+dx, jj=j+dz;
      if(inGrid(ii,jj)&&road[jj*N+ii]&&!CONN[jj*N+ii]){ CONN[jj*N+ii]=1; q.push([ii,jj]); }
    }
  }
}

const roadGroup=new THREE.Group(); scene.add(roadGroup);
const asMat=new THREE.MeshStandardMaterial({color:0x8a9098,roughness:0.85,map:texRoad});
const swMat=new THREE.MeshStandardMaterial({color:0xd9d2c0,roughness:0.95,map:texWalk});
const dashMat=new THREE.MeshStandardMaterial({color:0xf7f5ec,roughness:0.8});
function rebuildRoads(){
  roadGroup.clear();
  const Y=0.52;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    if(!road[j*N+i]) continue;
    const x=cx(i), z=cz(j);
    const sw=new THREE.Mesh(new THREE.BoxGeometry(CS,0.05,CS), swMat);
    sw.position.set(x,Y,z); sw.receiveShadow=true; roadGroup.add(sw);
    const a=new THREE.Mesh(new THREE.BoxGeometry(CS*0.78,0.06,CS*0.78), asMat);
    a.position.set(x,Y+0.02,z); a.receiveShadow=true; roadGroup.add(a);
    // 隣接方向へアスファルトを繋げる
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    let mask=0;
    dirs.forEach(([dx,dz],k)=>{
      const nbr=inGrid(i+dx,j+dz)&&road[(j+dz)*N+i+dx];
      const virt=isEntry(i,j)&&dx===-1;                // 接続口は西(ランプ側)へ道が開く
      if(nbr||virt){
        mask|=1<<k;
        const c=new THREE.Mesh(new THREE.BoxGeometry(dx?CS*0.24:CS*0.78,0.06,dz?CS*0.24:CS*0.78), asMat);
        c.position.set(x+dx*CS*0.44, Y+0.02, z+dz*CS*0.44); roadGroup.add(c);
      }
    });
    // 白破線（直線部分のみ）
    if(mask===0b0011||mask===0b0001||mask===0b0010){ const d=new THREE.Mesh(new THREE.BoxGeometry(CS*0.34,0.02,0.28),dashMat); d.position.set(x,Y+0.06,z); roadGroup.add(d); }
    if(mask===0b1100||mask===0b0100||mask===0b1000){ const d=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.02,CS*0.34),dashMat); d.position.set(x,Y+0.06,z); roadGroup.add(d); }
    // 街灯（直線区間に間引いて自動配置。道路を引き直すと街灯もついてくる）
    if((mask===0b0011||mask===0b1100) && (i*7+j*11)%3===0){
      const side=((i+j)&1)?1:-1;
      if(mask===0b0011) roadGroup.add(makeLamp(x, z+side*(CS/2-0.35), 0, side));
      else              roadGroup.add(makeLamp(x+side*(CS/2-0.35), z, 1, side));
    }
    // 交差点(3方向以上)に横断歩道+停止線（実物準拠: バーは進行方向に平行・停止線は左車線側）
    const arms=((mask&1)?1:0)+((mask&2)?1:0)+((mask&4)?1:0)+((mask&8)?1:0);
    if(arms>=3){
      dirs.forEach(([dx,dz],k)=>{
        if(!(mask&(1<<k))) return;
        for(let o=-3;o<=3;o++){
          const cw=new THREE.Mesh(new THREE.BoxGeometry(dx?1.35:0.24,0.02,dx?0.24:1.35),dashMat);
          cw.position.set(x+dx*2.0+(dx?0:o*0.44), Y+0.075, z+dz*2.0+(dz?0:o*0.44));
          roadGroup.add(cw);
        }
        const sl=new THREE.Mesh(new THREE.BoxGeometry(dx?0.18:1.45,0.02,dx?1.45:0.18),dashMat);
        sl.position.set(x+dx*3.1-dz*0.8, Y+0.075, z+dz*3.1+dx*0.8);
        roadGroup.add(sl);
      });
    }
  }
  recomputeConn();                                   // 道路が変わるたびに幹線道路との接続を再計算
  rebuildCars();                                     // 道路の形が変わったら車も再配置
}

function makeCar(k){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.55,0.55,3.1),

  base.position.y=0.16; g.add(base);
  return g;
}
function rebuildCars(){
  for(const c of CARS) scene.remove(c.mesh);
  CARS.length=0;
  const cells=[];
  for(let j=0;j<N;j++)for(let i=0;i<N;i++) if(road[j*N+i]) cells.push([i,j]);
  const n=Math.min(10, Math.floor(cells.length/9));
  for(let k=0;k<n;k++){
    const c0=cells[(k*53+7)%cells.length];
    const mesh=makeCar(k); scene.add(mesh);
    CARS.push({mesh, from:c0, to:c0, t:1, prev:null, speed:6+(k%4)*1.2});
  }
}
function carNext(c){
  const cand=[[1,0],[-1,0],[0,1],[0,-1]]
    .map(d=>[c.from[0]+d[0],c.from[1]+d[1]])
    .filter(cc=>inGrid(cc[0],cc[1])&&road[cc[1]*N+cc[0]]);
  if(!cand.length) return c.from;
  const fwd=cand.filter(cc=>!(c.prev&&cc[0]===c.prev[0]&&cc[1]===c.prev[1]));
  const pool=fwd.length?fwd:cand;
  return pool[Math.floor(Math.random()*pool.length)];
}

function queueTruck(goal){ if(goal) TRUCKQ.push(goal); }
function stepTrucks(dt){
  const h=gameHour%24;
  while(TRUCKS.length<3 && TRUCKQ.length && h>6.8 && h<19.5){   // 日中だけ出発
    const goal=TRUCKQ.shift();
    let best=null;
    for(const [ei,ej] of ENTRIES){                    // 近い方の接続口から
      const p2=pathTo([ei,ej],goal);
      if(p2 && (!best || p2.length<best.length)) best=[[ei,ej],...p2];
    }
    if(!best || best.length<2) continue;
    const mesh=makeTruck(); scene.add(mesh);
    TRUCKS.push({mesh, path:best, idx:0, t:0, state:'go', stay:0});
  }
  for(let ti=TRUCKS.length-1;ti>=0;ti--){
    const tr=TRUCKS[ti];
    if(tr.state==='stay'){                            // 家の前で荷降ろし
      tr.stay-=dt;
      if(tr.stay<=0){ tr.path.reverse(); tr.idx=0; tr.t=0; tr.state='back'; }
      continue;
    }
    tr.t+=dt*7/CS;
    if(tr.t>=1){
      tr.idx++; tr.t=0;
      if(tr.idx>=tr.path.length-1){
        if(tr.state==='go'){ tr.state='stay'; tr.stay=12; continue; }   // 12秒荷降ろし
        scene.remove(tr.mesh); TRUCKS.splice(ti,1); continue;           // 帰宅完了
      }
    }
    const a=tr.path[tr.idx], b2=tr.path[Math.min(tr.idx+1,tr.path.length-1)];
    const fx=cx(a[0]), fz=cz(a[1]), dx=cx(b2[0])-fx, dz=cz(b2[1])-fz;
    const len=Math.hypot(dx,dz)||1, ox=dz/len*0.95, oz=-dx/len*0.95;
    tr.mesh.position.set(fx+dx*tr.t+ox, 0.56, fz+dz*tr.t+oz);
    if(dx||dz) tr.mesh.rotation.y=Math.atan2(dx,dz);
  }
}
function stepPath(o,dt,speed){                       // 3D折れ線に沿って進む（ランプ走行用）
  let rem=dt*speed;
  while(rem>0&&!o.done){
    const a=o.path[o.seg], b2=o.path[o.seg+1];
    const len=Math.hypot(b2[0]-a[0],b2[1]-a[1],b2[2]-a[2])||0.01;
    const left=(1-o.t)*len;
    if(rem<left){ o.t+=rem/len; rem=0; }
    else { rem-=left; o.seg++; o.t=0;
      if(o.seg>=o.path.length-1){ o.done=true; o.seg=o.path.length-2; o.t=1; } }
  }
  const a=o.path[o.seg], b2=o.path[o.seg+1];
  o.mesh.position.set(a[0]+(b2[0]-a[0])*o.t, a[1]+(b2[1]-a[1])*o.t, a[2]+(b2[2]-a[2])*o.t);
  const dx=b2[0]-a[0], dzz=b2[2]-a[2];
  if(dx||dzz) o.mesh.rotation.y=Math.atan2(dx,dzz);
}
function stepCars(dt){
  for(let ci=CARS.length-1;ci>=0;ci--){
    const c=CARS[ci];
    c.t+=dt*c.speed/CS;
    if(c.t>=1){
      c.prev=c.from; c.from=c.to;
      const rp=RAMP_PATHS.find(r=>c.from[0]===0&&c.from[1]===r.ej);
      if(rp && Math.random()<0.35){                  // 接続口に来た街の車は時々ハイウェイへ
        CLIMBERS.push({mesh:c.mesh,path:rp.up,seg:0,t:0,done:false});
        CARS.splice(ci,1); continue;
      }
      c.to=carNext(c); c.t=0;
    }
    const fx=cx(c.from[0]), fz=cz(c.from[1]), dx=cx(c.to[0])-fx, dz=cz(c.to[1])-fz;
    const len=Math.hypot(dx,dz)||1, ox=dz/len*0.95, oz=-dx/len*0.95;   // 左側通行
    c.mesh.position.set(fx+dx*c.t+ox, 0.56, fz+dz*c.t+oz);
    if(dx||dz) c.mesh.rotation.y=Math.atan2(dx,dz);
  }
  for(let li=CLIMBERS.length-1;li>=0;li--){          // 上りランプ走行中
    const cl=CLIMBERS[li];
    stepPath(cl,dt,8);
    if(cl.done){
      if(HWCARS.length<10){
        cl.mesh.rotation.y=Math.PI;
        HWCARS.push({mesh:cl.mesh, dir:-1, z:cl.path[cl.path.length-1][2], y:6.0, mode:null});
      } else scene.remove(cl.mesh);
      CLIMBERS.splice(li,1);
    }
  }
  for(const h of HWCARS){                            // 本線の流れ（南行きは時々ICで降りる）
    if(h.mode==='down'){
      stepPath(h,dt,9);
      if(h.done){
        CARS.push({mesh:h.mesh, from:h.entryCell, to:h.entryCell, t:1, prev:null,
          speed:6.5, k:(Math.random()*8)|0});
        h.mesh=makeCar((Math.random()*8)|0); scene.add(h.mesh);   // 本線には代わりの車が北から
        h.mode=null; h.done=false; h.seg=0; h.t=0; h.z=-156; h.dir=1;
      }
      continue;
    }
    h.z+=h.dir*15*dt;
    if(h.dir>0){
      const rp=RAMP_PATHS.find(r=>Math.abs(h.z-(r.z-47))<dt*15+0.4);
      if(rp && isRoadCell(1,rp.ej) && Math.random()<0.5){          // 街に道があれば降りてみる
        h.mode='down'; h.path=rp.down; h.seg=0; h.t=0; h.done=false;
        h.entryCell=[0,rp.ej];
        continue;
      }
    }
    if(h.z>82) h.z=-156; if(h.z<-158) h.z=80;
    const x=HWX(h.z)+2.4*h.dir;
    h.mesh.position.set(x,h.y,h.z);
    h.mesh.rotation.y=Math.atan2(HWX(h.z+2*h.dir)-HWX(h.z),2*h.dir);
  }
}

function footprintOK(i,j,fw,fd){
  if(i<0||j<0||i>N-fw||j>N-fd) return false;
  for(let a=0;a<fw;a++)for(let b=0;b<fd;b++){
    if(!buildable(i+a,j+b)) return false;
    const k=(j+b)*N+(i+a);
    if(road[k]||bld[k]) return false;
  }
  return true;
}
function nearRoadDir(i,j,fw,fd){
  for(let a=0;a<fw;a++)for(let b=0;b<fd;b++){
    for(const [dx,dz] of [[0,1],[0,-1],[1,0],[-1,0]]){
      const ii=i+a+dx, jj=j+b+dz;
      if(inGrid(ii,jj)&&road[jj*N+ii]) return [dx,dz];
    }
  }
  return null;
}

}

const TEXCACHE={};
function makeTex(key,w,h,draw){
  if(TEXCACHE[key]) return TEXCACHE[key];
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  TEXCACHE[key]=t; return t;
}

function buildMesh(type, ghost=false, floors=3){

  const M=(color,extra={})=>{ const m=new THREE.MeshStandardMaterial({color,roughness:0.9,...extra});
    if(ghost){ m.transparent=true; m.opacity=0.55; } return m; };
  const winM=(col=0xfff2c8)=>{ const m=M(col,{emissive:0xffdf9a,emissiveIntensity:0.06});
    if(!ghost) TOD.windows.push(m); return m; };
  const TX=(tex,color=0xffffff,rx=1,ry=1)=>{ const t=tex().clone(); t.needsUpdate=true; t.repeat.set(rx,ry);
    const m=new THREE.MeshStandardMaterial({map:t,color,roughness:0.92});
    if(ghost){ m.transparent=true; m.opacity=0.55; } return m; };
  const box=(w,h,d,mat,x,y,z,rx=0)=>{ const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    b.position.set(x,y,z); b.rotation.x=rx; if(!ghost){b.castShadow=true;b.receiveShadow=true;} g.add(b); return b; };
  const gableRoof=(w,d,y,color,over=0.8)=>{ const m=M(color);
    box(w+over,0.22,d*0.62,m, 0,y,-d*0.26,-0.62);   // 北側スロープ（中央の棟が高い山形Λ）
    box(w+over,0.22,d*0.62,m, 0,y, d*0.26, 0.62);   // 南側スロープ
    box(w+over*0.5,0.3,0.3, m, 0,y+0.85,0); };      // 棟木
  if(type==='cottage'){
    box(6.4,3.0,5.4, M(0xf2e3c2), 0,1.5,0);

    box(1.1,1.8,0.14, M(0x8a5a38), 1.6,0.9,2.72);

function bldCenter(def,i,j){ return [ cx(i)+CS*(def.fw-1)/2, cz(j)+CS*(def.fd-1)/2 ]; }
function placeBuilding(type,i,j,floors=3,sd=null){
  const def=BLD_DEFS[type];
  const dir=nearRoadDir(i,j,def.fw,def.fd)||[0,1];
  const [x,z]=bldCenter(def,i,j);
  for(let a=0;a<def.fw;a++)for(let b=0;b<def.fd;b++) bld[(j+b)*N+(i+a)]=1;
  let solid=null;
  if(!def.walkIn){
    const m=def.slim?1.3:0.3;
    solid={x0:x-def.fw*CS/2+m,x1:x+def.fw*CS/2-m,z0:z-def.fd*CS/2+(def.slim?1.3:0.4),z1:z+def.fd*CS/2-(def.slim?1.3:0.4)};
    SOLIDS.push(solid);
  }
  const entry={type,i,j,floors,solid, sd:(sd==null?day:sd), group:null, vstage:null,
    rotY: def.noRoad ? ((i*7+j*13)%4)*(Math.PI/2) : Math.atan2(dir[0],dir[1])};
  buildings.push(entry);
  refreshBuildingVisual(entry);                        // 着工日に応じて工事現場 or 完成形を表示
  if(typeof rebuildNPCs==='function') rebuildNPCs();
  return entry;
}

function buildSite(def,stage){
  const g=new THREE.Group();
  const w=def.fw*CS, d=def.fd*CS;
  const dirt=new THREE.Mesh(new THREE.BoxGeometry(w-0.4,0.16,d-0.4),
    new THREE.MeshStandardMaterial({color:0xb08a5e,roughness:1}));

  const fm=new THREE.MeshStandardMaterial({color:0xeceff2,roughness:0.8});
  const pm=new THREE.MeshStandardMaterial({color:0x93a0ab});
  const fh=1.8;
  for(const [px,pz,sx,sz] of [[0,-d/2+0.08,w-0.1,0.12],[0,d/2-0.08,w-0.1,0.12],
                              [-w/2+0.08,0,0.12,d-0.1],[w/2-0.08,0,0.12,d-0.1]]){
    const f=new THREE.Mesh(new THREE.BoxGeometry(sx,fh,sz),fm);
    f.position.set(px,fh/2,pz); g.add(f);
  }
  for(const [px,pz] of [[-w/2+0.08,-d/2+0.08],[w/2-0.08,-d/2+0.08],[-w/2+0.08,d/2-0.08],[w/2-0.08,d/2-0.08]]){
    const p=new THREE.Mesh(new THREE.BoxGeometry(0.22,fh+0.4,0.22),pm);
    p.position.set(px,(fh+0.4)/2,pz); g.add(p);
  }
  if(stage==='frame'){
    const hh=def.up?8.5:(def.fw>=3?5.5:4.4);           // 建物の輪郭を覆う工事シート
    const sheet=new THREE.Mesh(new THREE.BoxGeometry(w*0.78,hh,d*0.78),

    sheet.position.y=hh/2+0.1; g.add(sheet);
    const band=new THREE.Mesh(new THREE.BoxGeometry(w*0.79,0.5,d*0.79),
      new THREE.MeshStandardMaterial({color:0x4a7fc9}));

      new THREE.MeshStandardMaterial({color:0xe8a41f}));
    pole.position.set(w*0.36,(hh+2.6)/2,d*0.36); g.add(pole);

  }
  g.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
  return g;
}
function refreshBuildingVisual(b){
  const st=stageOf(b);
  if(b.vstage===st && b.group) return;
  if(b.group) scene.remove(b.group);
  const def=BLD_DEFS[b.type];
  b.group = st==='done' ? buildMesh(b.type,false,b.floors) : buildSite(def,st);
  const [x,z]=bldCenter(def,b.i,b.j);
  b.group.position.set(x,0.5,z);
  b.group.rotation.y = st==='done' ? b.rotY : 0;
  scene.add(b.group);
  b.vstage=st;
}
// マンションの増築（追加工事）
function upgradeBuilding(b){
  if(!BLD_DEFS[b.type].up || b.floors>=8) return false;
  b.floors++;
  const pos=b.group.position.clone(), rot=b.group.rotation.y;
  scene.remove(b.group);
  b.group=buildMesh(b.type,false,b.floors);
  b.group.position.copy(pos); b.group.rotation.y=rot;
  scene.add(b.group);
  return true;
}

function homeRoadCell(b){                              // 家の外周から接する道路マスを探す
  const def=BLD_DEFS[b.type];
  for(let a=-1;a<=def.fw;a++)for(let c=-1;c<=def.fd;c++){
    if(a>=0&&a<def.fw&&c>=0&&c<def.fd) continue;

const WORKPLACES=new Set(['bakery','cafe','flower','mart','koban']);
function pathTo(from,to){                              // 道路グリッド上のBFS経路探索
  const key=c=>c[1]*N+c[0];
  if(key(from)===key(to)) return [];
  const prev=new Map(); const q=[from]; prev.set(key(from),null);
  while(q.length){
    const c=q.shift();
    if(key(c)===key(to)){
      const path=[]; let k=c;
      while(k && key(k)!==key(from)){ path.push(k); k=prev.get(key(k)); }
      return path.reverse();
    }
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nc=[c[0]+d[0],c[1]+d[1]];
      if(!isRoadCell(nc[0],nc[1])||prev.has(key(nc))) continue;
      prev.set(key(nc),c); q.push(nc);
    }
  }
  return null;                                         // つながっていない
}
function rebuildNPCs(){
  for(const n of npcs) npcGroup.remove(n.mesh);
  npcs.length=0;
  const roadCells=[];                                  // 「郊外勤務」用の遠い道路マス候補
  for(let j=0;j<N;j++)for(let i=0;i<N;i++) if(road[j*N+i]) roadCells.push([i,j]);
  const works=buildings.filter(b=>WORKPLACES.has(b.type)&&stageOf(b)==='done')
    .map(b=>homeRoadCell(b)).filter(Boolean);          // 職場（完成済みの店・施設の前）
  const parks=buildings.filter(b=>(b.type==='park'||b.type==='fountain')&&stageOf(b)==='done')
    .map(b=>homeRoadCell(b)).filter(Boolean);          // 憩いの場（公園・噴水の前）
  let k=0;
  for(const b of buildings){
    if(!(b.type in RES || b.type==='mansion')) continue;
    if(occOf(b)<=0) continue;                          // 入居前の家からは出てこない
    const home=homeRoadCell(b); if(!home) continue;
    if(npcs.length>=24) break;
    let work= (k%4===3 && parks.length) ? parks[k%parks.length] : null;   // 4人に1人は公園派（日中は公園で過ごす）
    if(!work) work= works.length ? works[k%works.length] : null;
    if(!work && roadCells.length){                     // 店も公園も無ければ遠くの道路へ「通勤」
      for(let t2=0;t2<6;t2++){ const c=roadCells[(k*31+t2*17)%roadCells.length];
        if(Math.abs(c[0]-home[0])+Math.abs(c[1]-home[1])>=6){ work=c; break; } }
      work=work||home;
    }
    const mesh=makeNPC(k);
    npcs.push({mesh, home, work:work||home, from:home, to:home, t:1, prev:null,
      anchor:null, path:[],
      side:(k%2?1:-1)*(0.9+(k%3)*0.25),
      speed:1.0+((k*29)%10)/14, k});
    npcGroup.add(mesh);
    k++;
  }
}
function npcWander(n){                                 // 拠点(anchor)の周り2マスをうろうろ
  const cand=[[1,0],[-1,0],[0,1],[0,-1]]
    .map(d=>[n.from[0]+d[0],n.from[1]+d[1]])
    .filter(c=>isRoadCell(c[0],c[1]));
  if(!cand.length) return n.from;
  let pool=cand;
  if(n.anchor){
    const near=cand.filter(c=>Math.abs(c[0]-n.anchor[0])+Math.abs(c[1]-n.anchor[1])<=2);
    if(near.length) pool=near;
  }
  const fwd=pool.filter(c=>!(n.prev&&c[0]===n.prev[0]&&c[1]===n.prev[1]));
  const p2=fwd.length?fwd:pool;
  return p2[Math.floor(Math.random()*p2.length)];
}

  cars:()=>CARS.length, hw:()=>HWCARS.map(h=>h.mode||'run'), climbers:()=>CLIMBERS.length };
function npcAnchorFor(n,h){                            // 生活スケジュール: 時間帯→今いるべき場所
  if(h>=6.5&&h<16) return n.work;                      // 出勤〜勤務
  if(h>=16&&h<22.2) return n.home;                     // 帰宅〜家の近所
  return null;                                         // 就寝
}
function stepNPCs(dt,now){
  const h=gameHour%24;
  for(const n of npcs){
    const anchor=npcAnchorFor(n,h);
    const awake= anchor!==null || n.k%7===0;           // 夜は就寝（夜ふかし枠だけ徘徊）
    n.mesh.visible=awake;
    if(!awake){                                        // 寝ている間に家へ戻しておく（朝は家から出発）
      n.from=n.home; n.to=n.home; n.t=1; n.path=[]; n.anchor=null;
      continue;
    }
    n.t+=dt*n.speed/CS;
    if(n.t>=1){
      n.prev=n.from; n.from=n.to;
      if(anchor && (!n.anchor||anchor[0]!==n.anchor[0]||anchor[1]!==n.anchor[1])){
        n.anchor=anchor;                               // 目的地が変わった→経路を引き直す
        n.path=pathTo(n.from,anchor)||[];
      }
      n.to = (n.path&&n.path.length) ? n.path.shift() : npcWander(n);
      n.t=0;
    }
    const fx=cx(n.from[0]), fz=cz(n.from[1]), dx=cx(n.to[0])-fx, dz=cz(n.to[1])-fz;
    const len=Math.hypot(dx,dz)||1, ox=-dz/len*n.side, oz=dx/len*n.side;
    n.mesh.position.set(fx+dx*n.t+ox, 0.55+Math.abs(Math.sin(now*0.009+n.k*2))*0.05, fz+dz*n.t+oz);
    if(dx||dz) n.mesh.rotation.y=Math.atan2(dx,dz);
  }
}

  }
  if(mode==='placing'){ drawing=true; strokeLast=null; paint(e); }
  else if(mode==='walk'){                            // タップ移動
    ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(ndc,cam);
    const hit=new THREE.Vector3();
    if(ray.ray.intersectPlane(gPlane,hit)) walkTarget=hit;
  }
  else if(mode==='browse') panLast={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(tiltLast!==null && (e.buttons&2)){
    yaw-=(e.clientX-tiltLast.x)*0.005;
    setPitch(pitch+(e.clientY-tiltLast.y)*0.005);
    tiltLast={x:e.clientX,y:e.clientY}; return;
  }
  if(!touches.has(e.pointerId)) return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2 && pinchLast){                   // 2本指 = ピンチでズーム + ひねりで回転 + 上下で俯瞰角
    const [a,b]=[...touches.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    dist=Math.max(MIND,Math.min(MAXD, dist*pinchLast.d/Math.max(1,d)));
    let dA=ang-pinchLast.ang;
    if(dA>Math.PI)dA-=Math.PI*2; if(dA<-Math.PI)dA+=Math.PI*2;
    yaw+=dA;                                           // 地図が指のひねりに付いてくる向き
    pitch=Math.max(MINP,Math.min(MAXP, pitch+(my-pinchLast.cy)*0.004));
    pinchLast={d,cx:mx,cy:my,ang}; applyCam(); return;
  }
  if(drawing && mode==='placing'){ paint(e); return; }
  if(panLast){                                         // パンは回転(yaw)に合わせて世界方向へ変換
    const k=dist*0.0011, dx=(e.clientX-panLast.x)*k, dy=(e.clientY-panLast.y)*k;
    const c=Math.cos(yaw), s=Math.sin(yaw);
    target.x-=dx*c+dy*s;
    target.z-=-dx*s+dy*c;
    target.x=Math.max(-110,Math.min(110,target.x));
    target.z=Math.max(-110,Math.min(120,target.z));
    panLast={x:e.clientX,y:e.clientY}; applyCam();
  }
});
const endPointer=e=>{
  tiltLast=null;
  touches.delete(e.pointerId);
  if(touches.size<2) pinchLast=null;
  if(touches.size===0){ panLast=null; drawing=false; strokeLast=null; }
};
renderer.domElement.addEventListener('pointerup',endPointer);
renderer.domElement.addEventListener('pointercancel',endPointer);
addEventListener('wheel',e=>{
  if(e.shiftKey){ setPitch(pitch+e.deltaY*0.0022); return; }   // Shift+ホイール=俯瞰角
  dist=Math.max(MIND,Math.min(MAXD,dist+e.deltaY*0.12)); applyCam();
},{passive:true});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

let strokeLast=null;                                 // なぞり補間用（速いスワイプでもマスが飛ばない）
function lineCells(a,b2){
  const cells=[]; const di=b2[0]-a[0], dj=b2[1]-a[1];
  const steps=Math.max(Math.abs(di),Math.abs(dj));
  for(let t=1;t<=steps;t++) cells.push([a[0]+Math.round(di*t/steps), a[1]+Math.round(dj*t/steps)]);
  return cells;
}
function paint(e){
  const c=pickCell(e); if(!c) return;
  const {i,j}=c;
  if(tool&&tool.startsWith('bld:')){ moveGhost(i,j); updateConfirm(); return; }
  const targets = strokeLast ? lineCells(strokeLast,[i,j]) : [[i,j]];
  strokeLast=[i,j];
  for(const [ti,tj] of targets) paintCell(ti,tj);
  return;
}
function paintCell(i,j){
  if(tool==='erase'){
    if(isEntry(i,j)){ toast('🛣️ 幹線道路の接続口は撤去できないよ'); return; }
    if(inGrid(i,j)&&road[j*N+i]){ pending.add(i+','+j); redrawPreview(); updateConfirm(); }
    else if(inGrid(i,j)&&bld[j*N+i]){                       // 建物の撤去は即時
      const idx=buildings.findIndex(b=>{ const def=BLD_DEFS[b.type];
        return i>=b.i&&i<b.i+def.fw&&j>=b.j&&j<b.j+def.fd; });
      if(idx>=0){ const b=buildings[idx]; const def=BLD_DEFS[b.type];
        scene.remove(b.group);
        for(let a2=0;a2<def.fw;a2++)for(let b2=0;b2<def.fd;b2++) bld[(b.j+b2)*N+(b.i+a2)]=0;
        if(b.solid){ const si=SOLIDS.indexOf(b.solid); if(si>=0) SOLIDS.splice(si,1); }
        const refund=Math.floor((COSTS[b.type]||0)/2);
        money+=refund; updateHUD();
        buildings.splice(idx,1); rebuildNPCs(); saveCity(); toast('🧹 撤去！ +'+fmt(refund));
      }
    }
    return;
  }
  if(!buildable(i,j)){ flashNG(i,j); return; }      // 浜・海は赤フラッシュ
  if(road[j*N+i]) return;
  const key=i+','+j;
  if(!pending.has(key)){ pending.add(key); redrawPreview(); updateConfirm(); }
}

// ================= 時間と光（昼夜サイクル：スライスから移植） =================
const DAY_SEC=300;
let gameHour = q.get('t')!==null ? +q.get('t') : 10;
const clockEl=$('clock');
const KEYS=[
  [0.0, 0x1d2f58, 1.30, 0xaebfe8, 0.60, 0xa0aed4],
  [4.5, 0x223764, 1.30, 0xb5c5ec, 0.62, 0xa6b4d8],
  [6.0, 0xf2b26a, 0.58, 0xffb066, 0.60, 0xd4b195],
  [8.0, 0xa8d8ec, 0.95, 0xfff0d0, 1.05, 0xffffff],
  [12,  0x8fd3ea, 1.05, 0xffffff, 1.20, 0xffffff],
  [16,  0x92cbe4, 1.00, 0xffedc0, 1.10, 0xfff5e8],
  [17.5,0xf7a45e, 1.05, 0xff8a3a, 1.9,  0xffd9a8],
  [18.7,0xe06a45, 0.66, 0xff6a30, 0.60, 0xe0b096],
  [19.6,0x2a3f70, 1.30, 0xaebfe8, 0.60, 0xaab6d8],
  [24,  0x1d2f58, 1.30, 0xaebfe8, 0.60, 0xa0aed4],
];
const _cA=new THREE.Color(), _cB=new THREE.Color();
function lerpHex(a,b,t,into){ _cA.setHex(a); _cB.setHex(b); into.copy(_cA).lerp(_cB,t); return into; }
const skyC=new THREE.Color(), sunC=new THREE.Color(), tintC=new THREE.Color();
function applyTimeOfDay(){
  const h=gameHour%24;
  let i=0; while(i<KEYS.length-1 && KEYS[i+1][0]<h) i++;
  const A=KEYS[i], B=KEYS[Math.min(i+1,KEYS.length-1)];
  const t=(h-A[0])/Math.max(0.001,(B[0]-A[0]));
  scene.background=lerpHex(A[1],B[1],t,skyC);
  scene.fog.color.copy(skyC);
  hemi.intensity=A[2]+(B[2]-A[2])*t;
  hemi.color.copy(lerpHex(A[3],B[3],t,_cB));   // 環境光の色はキーの光色から（夜は青白い月光）
  sun.color.copy(lerpHex(A[3],B[3],t,sunC));
  sun.intensity=A[4]+(B[4]-A[4])*t;
  lerpHex(A[5],B[5],t,tintC).lerp(_cA.setHex(0xffffff),0.22);
  for(const m of TOD.tint) m.color.copy(tintC);
  const n=(h>=16.8?Math.min(1,(h-16.8)/1.4):(h<6.8?1-Math.max(0,(h-5.2)/1.6):0));
  for(const m of TOD.windows) m.emissiveIntensity=0.06+n*1.5;   // 夕暮れに窓が灯る
  for(const m of TOD.glow) m.opacity=n*0.28;                    // 街灯の光だまり（控えめ）
  const dayT=Math.min(1,Math.max(0,(h-6)/12.7));
  sun.position.set(Math.cos(dayT*Math.PI)*80, Math.max(24, Math.sin(dayT*Math.PI)*85+8), 30+dayT*55);   // 夕方も地面に光が届く高さを確保
  const hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  clockEl.textContent=`Day ${day}・${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

// 起動時にロード（保存があれば街が蘇る）
if(loadCity()) toast('🏙️ おかえりなさい、市長！');
for(const [ei,ej] of ENTRIES) road[ej*N+ei]=1;       // 幹線道路の接続口は常に存在
rebuildRoads();
setTimeout(()=>{                                     // 未接続の家があればヒント
  if(buildings.some(b=>(b.type in RES||b.type==='mansion') && stageOf(b)==='done' && occOf(b)===0))
    toast('🛣️ 幹線道路（西の高速）に道をつないで移住者を呼ぼう！');
},2600);
updateHUD();

// ================= ループ =================
const SPEED=6.5, camLook=new THREE.Vector3();
let last=performance.now(), lastSave=performance.now();
renderer.setAnimationLoop((now)=>{
  const rawDelta=(now-last)/1000;                    // 演出用は実時間（低FPS端末でも所要時間一定）
  const delta=Math.min(0.05,rawDelta); last=now;     // 移動用は上限つき（コマ落ち時の瞬間移動防止）
  const prevHour=Math.floor(gameHour);
  gameHour=(gameHour+delta*24/DAY_SEC)%24;
  if(prevHour===23 && Math.floor(gameHour)===0) newDay();   // 0時: 賃料＋住民税を入金
  if(seaMesh) seaMesh.position.y=0.02+0.05*Math.sin(now*0.0011);   // 波: 水面がゆっくり上下→波打ち際が動く
  stepNPCs(delta,now);                                 // 住民の散歩（両レンズ共通）
  stepCars(delta);                                     // 街の車+ハイウェイの流れ
  stepTrucks(delta);                                   // 引っ越しトラック（別世界からの移住）

  applyTimeOfDay();
  if(now-lastSave>10000){ saveCity(); lastSave=now; }   // 時刻も10秒ごとに保存
  if(mode==='descend'||mode==='ascend'){             // レンズの切替演出
    trans.t+=rawDelta/trans.dur;
    const e=easeIO(Math.min(1,trans.t));
    cam.position.lerpVectors(trans.fromPos,trans.toPos,e);
    const lk=new THREE.Vector3().lerpVectors(trans.fromLook,trans.toLook,e);
    cam.lookAt(lk);
    if(trans.t>=1){
      if(mode==='descend'){ mode='walk'; $('pad').classList.add('show'); $('mayorbtn').classList.add('show'); camLook.copy(player.position); }
      else { mode='browse'; ['build','dive','skip'].forEach(id=>$(id).style.display=''); applyCam(); }
      trans=null;
    }
  }
  else if(mode==='walk'){                            // 歩き（スライスと同じ心臓）
    const dir=new THREE.Vector3(); let power=1;
    if(padVec.on && Math.hypot(padVec.x,padVec.y)>0.12){
      const fwd=new THREE.Vector3(-WOFF.x,0,-WOFF.z).normalize();
      const right=new THREE.Vector3(-fwd.z,0,fwd.x);
      dir.addScaledVector(right,padVec.x).addScaledVector(fwd,-padVec.y);
      power=Math.min(1,Math.hypot(padVec.x,padVec.y));
      dir.normalize(); walkTarget=null;
    } else {
      if(keys['w']||keys['arrowup'])   { dir.x-=1; dir.z-=1; }
      if(keys['s']||keys['arrowdown']) { dir.x+=1; dir.z+=1; }
      if(keys['a']||keys['arrowleft']) { dir.x-=1; dir.z+=1; }
      if(keys['d']||keys['arrowright']){ dir.x+=1; dir.z-=1; }
      if(dir.lengthSq()>0){ walkTarget=null; dir.normalize(); }
      else if(walkTarget){
        const to=new THREE.Vector3().subVectors(walkTarget,player.position); to.y=0;
        if(to.length()<0.25) walkTarget=null; else dir.copy(to.normalize());
      }
    }
    if(dir.lengthSq()>0){
      player.position.addScaledVector(dir,SPEED*power*delta);
      player.position.x=Math.max(-150,Math.min(150,player.position.x));
      player.position.z=Math.max(-150,Math.min(COAST(player.position.x)-3,player.position.z));   // 海には入らない
      for(const s2 of SOLIDS){                                // 建物にめり込まない
        const px=player.position.x, pz=player.position.z, r=0.45;
        if(px>s2.x0-r&&px<s2.x1+r&&pz>s2.z0-r&&pz<s2.z1+r){
          const dxl=px-(s2.x0-r), dxr=(s2.x1+r)-px, dzf=pz-(s2.z0-r), dzb=(s2.z1+r)-pz;
          const m2=Math.min(dxl,dxr,dzf,dzb);
          if(m2===dxl) player.position.x=s2.x0-r;
          else if(m2===dxr) player.position.x=s2.x1+r;
          else if(m2===dzf) player.position.z=s2.z0-r;
          else player.position.z=s2.z1+r;
        }
      }
      const yaw=Math.atan2(dir.x,dir.z);
      let d2=yaw-player.rotation.y;
      while(d2>Math.PI)d2-=Math.PI*2; while(d2<-Math.PI)d2+=Math.PI*2;
      player.rotation.y+=d2*Math.min(1,delta*12);
    }
    player.position.y=Math.max(0.5,groundH(player.position.x,player.position.z));
    const wantPos=new THREE.Vector3().addVectors(player.position,WOFF);
    cam.position.lerp(wantPos,Math.min(1,delta*4));
    camLook.lerp(player.position,Math.min(1,delta*6));
    cam.lookAt(camLook.x,camLook.y+1.0,camLook.z+3.0);
  }
  renderer.render(scene,cam);
});
</script>
