<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ねこ店長のカフェ経営</title>
<style>
  :root{
    --bg:#1a140e; --panel:#2a2018; --panel2:#352a20; --line:#473829;
    --txt:#f5ece0; --sub:#b39d84; --accent:#e0894a; --accent2:#c9602e;
    --gold:#ffce4d; --green:#7fc77f; --red:#e0685e; --cream:#f3e4cf;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:radial-gradient(1100px 650px at 70% -10%, #3a2a1a, var(--bg));
    color:var(--txt); font-family:-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    min-height:100vh; overflow-x:hidden;
  }
  .wrap{max-width:760px; margin:0 auto; padding:14px 14px 92px;}
  header{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  header h1{font-size:18px; margin:0; letter-spacing:.5px;}
  header .logo{font-size:26px;}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px;}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 6px; text-align:center;}
  .stat .v{font-size:17px; font-weight:800;}
  .stat .l{font-size:10px; color:var(--sub); margin-top:2px;}
  .gold{color:var(--gold);} .acc{color:var(--accent);} .green{color:var(--green);}

  .trend{background:linear-gradient(100deg,#43301c,#36281a); border:1px solid var(--accent2);
    border-radius:14px; padding:10px 12px; margin-bottom:12px; display:flex; align-items:center; gap:10px;}
  .trend .fire{font-size:22px; animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  .trend .t1{font-size:11px; color:var(--sub);}
  .trend .t2{font-size:15px; font-weight:800; color:var(--gold);}

  .section-title{font-size:12px; color:var(--sub); margin:14px 2px 8px; text-transform:uppercase; letter-spacing:1px;
    display:flex; justify-content:space-between; align-items:center;}

  .menu{display:flex; flex-direction:column; gap:10px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px;
    display:flex; gap:12px; align-items:center;}
  .icon{width:50px; height:50px; border-radius:14px; display:grid; place-items:center; font-size:28px; flex-shrink:0;
    background:linear-gradient(135deg,var(--accent2),var(--accent));}
  .cinfo{flex:1; min-width:0;}
  .cname{font-weight:800; font-size:15px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .badge{font-size:10px; background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:var(--sub);}
  .cmeta{font-size:11px; color:var(--sub); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap;}
  .btn{border:0; border-radius:10px; padding:9px 14px; font-weight:800; font-size:13px; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); white-space:nowrap; transition:transform .1s, filter .15s;}
  .btn:active{transform:scale(.94);}
  .btn:disabled{filter:grayscale(.7) brightness(.6); cursor:not-allowed;}
  .btn.ghost{background:var(--panel2); border:1px solid var(--line);}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#ff9d4d); color:#3a2a00;}

  .footer{position:fixed; left:0; right:0; bottom:0; background:rgba(26,20,14,.94); backdrop-filter:blur(8px);
    border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:10px; justify-content:center;}
  .footer .inner{display:flex; gap:10px; max-width:760px; width:100%; margin:0 auto;}
  .footer .btn{flex:1; padding:13px;}

  #feed{position:fixed; top:10px; left:50%; transform:translateX(-50%); width:calc(100% - 28px); max-width:732px;
    display:flex; flex-direction:column; gap:6px; z-index:50; pointer-events:none;}
  .toast{background:var(--panel2); border:1px solid var(--line); border-left:4px solid var(--accent);
    border-radius:10px; padding:8px 12px; font-size:13px; animation:slidein .3s, fadeout .4s 2.6s forwards;}
  .toast.good{border-left-color:var(--gold); background:linear-gradient(100deg,#43340f,#352a20);}
  .toast.bad{border-left-color:var(--red);}
  @keyframes slidein{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeout{to{opacity:0; transform:translateY(-8px)}}

  .modal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; place-items:center; z-index:100; padding:16px;}
  .modal.show{display:grid;}
  .sheet{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px; width:100%; max-width:460px;}
  .sheet h2{margin:0 0 4px; font-size:18px;}
  .sheet p{color:var(--sub); font-size:13px; margin:0 0 14px;}
  .list{display:flex; flex-direction:column; gap:10px; max-height:62vh; overflow-y:auto;}
  .center{text-align:center;}
  .big{font-size:42px; font-weight:900;}

  /* open day animation overlay */
  .daybanner{position:fixed; inset:0; display:none; place-items:center; z-index:80; pointer-events:none;}
  .daybanner.show{display:grid; animation:fadeout 1.4s forwards;}
  .daybanner .txt{font-size:30px; font-weight:900; color:var(--cream); text-shadow:0 4px 20px #000;}
</style>
</head>
<body>
<div id="feed"></div>
<div class="daybanner" id="daybanner"><div class="txt" id="daytxt"></div></div>

<div class="wrap">
  <header>
    <span class="logo">🐱</span>
    <h1>ねこ店長のカフェ経営</h1>
  </header>

  <div class="stats">
    <div class="stat"><div class="v gold" id="s-money">¥0</div><div class="l">売上金</div></div>
    <div class="stat"><div class="v acc" id="s-rep">0</div><div class="l">お店の評判</div></div>
    <div class="stat"><div class="v" id="s-day">1日目</div><div class="l">営業日数</div></div>
    <div class="stat"><div class="v green" id="s-star">★1</div><div class="l">お店ランク</div></div>
  </div>

  <div class="trend">
    <span class="fire">🔥</span>
    <div>
      <div class="t1">今日の人気（提供すると売上＆評判UP）</div>
      <div class="t2" id="trend-name">―</div>
    </div>
  </div>

  <div class="section-title"><span>メニュー</span><span id="menu-count" style="color:var(--sub)"></span></div>
  <div class="menu" id="menu"></div>

  <div class="section-title"><span>お店の改善</span></div>
  <div class="menu">
    <div class="card">
      <div class="icon">🪑</div>
      <div class="cinfo">
        <div class="cname">内装アップグレード <span class="badge" id="deco-lv">Lv.1</span></div>
        <div class="cmeta">席数と評判が上がり、1日の来客が増える</div>
      </div>
      <button class="btn gold" id="btn-deco">¥<span id="deco-cost">800</span></button>
    </div>
    <div class="card">
      <div class="icon">📣</div>
      <div class="cinfo">
        <div class="cname">SNSで宣伝</div>
        <div class="cmeta">評判を即UP！次の営業の集客力が上がる</div>
      </div>
      <button class="btn gold" id="btn-promo">¥<span id="promo-cost">400</span></button>
    </div>
  </div>
</div>

<div class="footer"><div class="inner">
  <button class="btn ghost" id="btn-newmenu">＋ 新メニュー開発</button>
  <button class="btn" id="btn-open">🔔 開店する</button>
</div></div>

<!-- New menu modal -->
<div class="modal" id="modal-menu">
  <div class="sheet">
    <h2>新メニューを開発</h2>
    <p>開発候補から1つ選んでメニューに追加しよう。</p>
    <div class="list" id="newmenu-list"></div>
    <div style="margin-top:14px; text-align:right;">
      <button class="btn ghost" onclick="closeModal('modal-menu')">閉じる</button>
    </div>
  </div>
</div>

<!-- Result modal -->
<div class="modal" id="modal-result">
  <div class="sheet center">
    <div class="big" id="res-emoji">☕</div>
    <h2 id="res-title">結果</h2>
    <div id="res-body" style="text-align:left; color:var(--cream); font-size:14px; line-height:1.7; margin:6px 0 16px;"></div>
    <button class="btn" style="width:100%" onclick="closeModal('modal-result')">OK</button>
  </div>
</div>

<script>
// ====== データ ======
const MENU_POOL = [
  {name:"ブレンドコーヒー", icon:"☕", price:450, cost:120, cat:"drink"},
  {name:"カフェラテ", icon:"🥛", price:550, cost:160, cat:"drink"},
  {name:"抹茶ラテ", icon:"🍵", price:600, cost:200, cat:"drink"},
  {name:"アイスティー", icon:"🧊", price:480, cost:130, cat:"drink"},
  {name:"いちごミルク", icon:"🍓", price:580, cost:190, cat:"drink"},
  {name:"チーズケーキ", icon:"🍰", price:520, cost:200, cat:"sweet"},
  {name:"パンケーキ", icon:"🥞", price:780, cost:280, cat:"sweet"},
  {name:"プリンアラモード", icon:"🍮", price:680, cost:240, cat:"sweet"},
  {name:"クロワッサン", icon:"🥐", price:380, cost:120, cat:"food"},
  {name:"サンドイッチ", icon:"🥪", price:650, cost:260, cat:"food"},
  {name:"ナポリタン", icon:"🍝", price:880, cost:340, cat:"food"},
  {name:"クッキー盛り", icon:"🍪", price:420, cost:140, cat:"sweet"},
  {name:"フルーツタルト", icon:"🥧", price:720, cost:300, cat:"sweet"},
  {name:"ホットサンド", icon:"🧀", price:620, cost:230, cat:"food"},
  {name:"季節のスムージー", icon:"🥤", price:640, cost:220, cat:"drink"},
];
const CATS = {drink:"ドリンク", sweet:"スイーツ", food:"フード"};

const state = {
  money: 1500,
  rep: 10,
  day: 1,
  starMenu: 0,
  menu: [],
  decoLv: 1,
  decoCost: 800,
  promoCost: 400,
  promoBoost: 0,
};

function rint(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function fmtMoney(n){return "¥"+Math.round(n).toLocaleString("ja-JP");}

function starRank(){
  if(state.rep>=2000)return 5; if(state.rep>=800)return 4; if(state.rep>=300)return 3; if(state.rep>=100)return 2; return 1;
}

// ====== レンダリング ======
function render(){
  document.getElementById("s-money").textContent = fmtMoney(state.money);
  document.getElementById("s-rep").textContent = Math.round(state.rep);
  document.getElementById("s-day").textContent = state.day+"日目";
  document.getElementById("s-star").textContent = "★"+starRank();
  document.getElementById("deco-lv").textContent = "Lv."+state.decoLv;
  document.getElementById("deco-cost").textContent = state.decoCost.toLocaleString("ja-JP");
  document.getElementById("promo-cost").textContent = state.promoCost.toLocaleString("ja-JP");
  document.getElementById("menu-count").textContent = state.menu.length+"品";
  document.getElementById("btn-deco").disabled = state.money < state.decoCost;
  document.getElementById("btn-promo").disabled = state.money < state.promoCost;

  const star = state.menu[state.starMenu];
  document.getElementById("trend-name").textContent = star ? `${star.icon} ${star.name}` : "―";

  const wrap = document.getElementById("menu");
  if(state.menu.length===0){
    wrap.innerHTML = `<div class="card"><div class="cinfo"><div class="cname">メニューがありません</div><div class="cmeta">「新メニュー開発」から最初の一品を作ろう！</div></div></div>`;
    return;
  }
  wrap.innerHTML = state.menu.map((m,i)=>{
    const isStar = i===state.starMenu;
    const profit = m.price - m.cost;
    return `<div class="card">
      <div class="icon">${m.icon}</div>
      <div class="cinfo">
        <div class="cname">${m.name} ${isStar?'<span class="badge" style="color:var(--gold);border-color:var(--gold)">🔥本日の人気</span>':''}</div>
        <div class="cmeta"><span>${CATS[m.cat]}</span><span>価格 ${fmtMoney(m.price)}</span><span>原価 ${fmtMoney(m.cost)}</span><span class="green">利益 ${fmtMoney(profit)}</span></div>
      </div>
      <button class="btn ghost" data-star="${i}" ${isStar?'disabled':''}>推す</button>
    </div>`;
  }).join("");
  wrap.querySelectorAll("[data-star]").forEach(b=>{
    b.onclick = ()=>{ state.starMenu = +b.getAttribute("data-star"); render(); };
  });
}

// ====== フィード ======
function toast(msg, type=""){
  const f = document.getElementById("feed");
  const el = document.createElement("div");
  el.className = "toast "+type;
  el.innerHTML = msg;
  f.appendChild(el);
  setTimeout(()=>el.remove(), 3000);
}

// ====== 開店（1日の営業） ======
document.getElementById("btn-open").onclick = ()=>{
  if(state.menu.length===0){ toast("メニューが無いと開店できません！","bad"); return; }
  // 来客数：評判 + 内装 + 宣伝ブースト + 運
  const baseCustomers = 6 + state.decoLv*3 + Math.floor(state.rep/40) + state.promoBoost + rint(-2,4);
  const customers = Math.max(3, baseCustomers);
  let revenue=0, costSum=0, sold=0, repGain=0, happy=0, unhappy=0;
  const star = state.menu[state.starMenu];

  for(let i=0;i<customers;i++){
    // 各客は注文数 1〜3
    const orders = rint(1,3);
    for(let o=0;o<orders;o++){
      // 人気メニューは選ばれやすい
      let m;
      if(Math.random() < 0.4) m = star;
      else m = pick(state.menu);
      // 在庫切れ（運）で時々ロス
      revenue += m.price; costSum += m.cost; sold++;
      if(m===star) repGain += 1.5; else repGain += 0.6;
    }
    if(Math.random() < (0.6 + Math.min(0.3, state.rep/3000))) { happy++; } else { unhappy++; }
  }
  repGain += happy*1.2 - unhappy*0.8;
  const profit = revenue - costSum;
  state.money += profit;
  state.rep = Math.max(0, state.rep + repGain);
  state.promoBoost = 0;

  // メニュー数ボーナス（品揃え）
  const variety = state.menu.length;

  // 日進める
  state.day++;
  // 新トレンド（人気メニューを入れ替え）
  state.starMenu = rint(0, state.menu.length-1);

  showResult("📊", `${state.day-1}日目の営業結果`,
    `🚶 来客数：<b>${customers}人</b>（${happy}人が満足 / ${unhappy}人が不満）<br>`+
    `🍽️ 提供数：<b>${sold}品</b>（品揃え ${variety}種）<br>`+
    `💴 売上：${fmtMoney(revenue)}　原価：${fmtMoney(costSum)}<br>`+
    `💰 利益：<b class="${profit>=0?'green':''}" style="color:var(--gold)">${fmtMoney(profit)}</b><br>`+
    `⭐ 評判：<b>+${Math.round(repGain)}</b>（合計 ${Math.round(state.rep)}）`
  );

  // 節目
  if((state.day-1) % 7 === 0){
    const bonus = 500 + starRank()*1200;
    state.money += bonus;
    setTimeout(()=>toast(`🏆 週間ベスト店舗ボーナス +${fmtMoney(bonus)}！`,"good"), 200);
  }
  showDayBanner(`☀️ ${state.day}日目`);
  render();
};

function showDayBanner(t){
  const b = document.getElementById("daybanner");
  document.getElementById("daytxt").textContent = t;
  b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
}

// ====== 内装 ======
document.getElementById("btn-deco").onclick = ()=>{
  if(state.money < state.decoCost) return;
  state.money -= state.decoCost;
  state.decoLv++;
  state.rep += 15;
  state.decoCost = Math.round(state.decoCost*1.6);
  toast(`🪑 内装をLv.${state.decoLv}にアップ！席が増えて評判UP`,"good");
  render();
};

// ====== 宣伝 ======
document.getElementById("btn-promo").onclick = ()=>{
  if(state.money < state.promoCost) return;
  state.money -= state.promoCost;
  state.rep += 25;
  state.promoBoost += rint(4,8);
  state.promoCost = Math.round(state.promoCost*1.3);
  toast(`📣 SNSで話題に！次の開店で来客UP（評判+25）`,"good");
  render();
};

// ====== 新メニュー開発 ======
function openNewMenu(){
  const owned = new Set(state.menu.map(m=>m.name));
  const avail = MENU_POOL.filter(m=>!owned.has(m.name));
  const list = document.getElementById("newmenu-list");
  if(avail.length===0){ list.innerHTML = `<div class="card"><div class="cinfo"><div class="cname">全メニュー開発済み！</div><div class="cmeta">あなたは立派なカフェ店長です🐱</div></div></div>`; openModal('modal-menu'); return; }
  // 候補3つ
  const candidates=[];
  const pool=[...avail];
  for(let i=0;i<3 && pool.length;i++){ candidates.push(pool.splice(rint(0,pool.length-1),1)[0]); }
  list.innerHTML = candidates.map((m,i)=>{
    const dev = m.cost*5; // 開発費
    return `<div class="card">
      <div class="icon">${m.icon}</div>
      <div class="cinfo">
        <div class="cname">${m.name}</div>
        <div class="cmeta"><span>${CATS[m.cat]}</span><span>価格 ${fmtMoney(m.price)}</span><span class="green">利益 ${fmtMoney(m.price-m.cost)}</span></div>
      </div>
      <button class="btn gold" data-dev="${i}" ${state.money<dev?'disabled':''}>開発 ${fmtMoney(dev)}</button>
    </div>`;
  }).join("");
  list.querySelectorAll("[data-dev]").forEach(b=>{
    const i=+b.getAttribute("data-dev"); const m=candidates[i]; const dev=m.cost*5;
    b.onclick=()=>{
      if(state.money<dev) return;
      state.money-=dev;
      state.menu.push({...m});
      if(state.menu.length===1) state.starMenu=0;
      toast(`🎉 新メニュー「${m.name}」を開発！`,"good");
      closeModal('modal-menu');
      render();
    };
  });
  openModal('modal-menu');
}
document.getElementById("btn-newmenu").onclick = openNewMenu;

// ====== モーダル ======
function openModal(id){document.getElementById(id).classList.add("show");}
function closeModal(id){document.getElementById(id).classList.remove("show");}
function showResult(emoji,title,bodyHtml){
  document.getElementById("res-emoji").textContent=emoji;
  document.getElementById("res-title").textContent=title;
  document.getElementById("res-body").innerHTML=bodyHtml;
  openModal('modal-result');
}

// ====== 初期化 ======
state.menu.push({...MENU_POOL[0]}); // ブレンドコーヒーでスタート
state.starMenu = 0;
toast(`🐱 ようこそ店長！まず開店してお客さんを迎えよう。利益で新メニューを増やそう！`,"good");
render();
</script>
</body>
</html>
