<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cafe Tycoon — 第1スライス（グレーボックス試作）</title>
<style>
  :root{ --txt:#f3ece0; --sub:#b9a98f; --panel:rgba(26,20,14,.82); --line:#4a3b2a;
         --accent:#e0894a; --gold:#ffce4d; --green:#7fc77f; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; height:100%; overflow:hidden; background:#10141a;
    font-family:-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; color:var(--txt);}
  #app{position:fixed; inset:0;}
  canvas{display:block; touch-action:none;}

  /* ---- HUD ---- */
  .hud{position:fixed; left:0; right:0; top:0; padding:12px; display:flex; gap:10px; align-items:flex-start; pointer-events:none;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px; backdrop-filter:blur(6px); pointer-events:auto;}
  .stats{display:flex; gap:16px;}
  .stat{flex-shrink:0;}
  .stat .v{font-size:18px; font-weight:800; line-height:1; white-space:nowrap;}
  .stat .l{font-size:10px; color:var(--sub); margin-top:3px; white-space:nowrap;}
  .gold{color:var(--gold);} .green{color:var(--green);} .acc{color:var(--accent);}
  .clock{font-variant-numeric:tabular-nums;}
  .spacer{flex:1;}

  .timectrl{display:flex; gap:6px; align-items:center;}
  .tbtn{border:1px solid var(--line); background:rgba(0,0,0,.25); color:var(--txt);
    border-radius:8px; padding:6px 10px; font-weight:800; font-size:12px; cursor:pointer;}
  .tbtn.active{background:var(--accent); color:#231400; border-color:var(--accent);}

  /* ---- bottom controls ---- */
  .bottom{position:fixed; left:0; right:0; bottom:0; padding:12px; display:flex; gap:10px; justify-content:center; pointer-events:none;}
  .btn{pointer-events:auto; border:0; border-radius:12px; padding:12px 18px; font-weight:800; font-size:14px; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,var(--accent),#c9602e); box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .btn.ghost{background:var(--panel); border:1px solid var(--line);}
  .btn:active{transform:scale(.96);}

  .hint{position:fixed; left:50%; transform:translateX(-50%); bottom:70px; background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:6px 14px; font-size:12px; color:var(--sub); pointer-events:none; white-space:nowrap;}

  .carrybadge{position:fixed; left:50%; transform:translateX(-50%); bottom:108px; background:var(--panel); border:1px solid var(--gold);
    color:var(--gold); border-radius:20px; padding:5px 14px; font-size:13px; font-weight:800; pointer-events:none;}

  /* 注文タグ（客の頭上） */
  .ordertag{position:fixed; transform:translate(-50%,-100%); pointer-events:none; text-align:center; z-index:40;}
  .ordertag .em{font-size:24px; line-height:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
  .ordertag .pat{width:42px; height:5px; background:rgba(0,0,0,.55); border-radius:3px; margin:3px auto 0; overflow:hidden;}
  .ordertag .pat > i{display:block; height:100%; width:100%; background:#7fc77f; transition:width .2s linear;}

  /* 常連の名前タグ */
  .nametag{position:fixed; transform:translate(-50%,-100%); pointer-events:none; z-index:39;
    background:rgba(255,142,199,.92); color:#3a0a22; font-size:11px; font-weight:800;
    border-radius:10px; padding:1px 8px; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.4);}

  /* ダッシュボード */
  #btn-dash{position:fixed; top:70px; right:12px; z-index:30; pointer-events:auto;
    background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:12px;
    padding:8px 12px; font-size:16px; cursor:pointer;}
  .dash-sheet{max-width:480px; text-align:left;}
  .dash-tabs{display:flex; gap:8px; margin-bottom:10px;}
  .dash-tab{flex:1; padding:7px; border-radius:9px; border:1px solid var(--line); background:var(--panel2);
    color:var(--sub); font-weight:800; font-size:13px; cursor:pointer; text-align:center;}
  .dash-tab.active{background:var(--accent); color:#231400; border-color:var(--accent);}
  .dash-kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px;}
  .kpi{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 10px;}
  .kpi .v{font-size:18px; font-weight:800;} .kpi .l{font-size:10px; color:var(--sub);}
  .dash-h{font-size:12px; color:var(--sub); margin:12px 2px 6px; font-weight:800;}
  .barrow{display:flex; align-items:center; gap:8px; margin:5px 0; font-size:13px;}
  .barrow .nm{width:84px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barrow .bar{flex:1; height:14px; background:var(--panel2); border-radius:7px; overflow:hidden;}
  .barrow .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:7px;}
  .barrow .vv{width:54px; text-align:right; flex-shrink:0; color:var(--sub); font-variant-numeric:tabular-nums;}

  /* 経営パネル */
  #btn-manage{position:fixed; top:118px; right:12px; z-index:30; pointer-events:auto;
    background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:12px;
    padding:8px 12px; font-size:16px; cursor:pointer;}
  #btn-manage.alert{border-color:var(--red); box-shadow:0 0 0 2px rgba(224,104,94,.4);}
  .m-tab{flex:1; padding:7px; border-radius:9px; border:1px solid var(--line); background:var(--panel2);
    color:var(--sub); font-weight:800; font-size:13px; cursor:pointer; text-align:center;}
  .m-tab.active{background:var(--accent); color:#231400; border-color:var(--accent);}
  .mrow{display:flex; align-items:center; gap:7px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .mrow .nm{flex:1; min-width:0;}
  .mrow .sub2{font-size:10px; color:var(--sub); margin-top:2px;}
  .mbtn{border:1px solid var(--line); background:var(--panel2); color:var(--txt); border-radius:8px; padding:5px 9px; font-weight:800; font-size:12px; cursor:pointer;}
  .mbtn.on{background:var(--green); color:#06301c; border-color:var(--green);}
  .mbtn.sel{background:var(--accent); color:#231400; border-color:var(--accent);}
  .mbtn:disabled{filter:grayscale(.6) brightness(.6); cursor:not-allowed;}
  .low{color:var(--red); font-weight:800;}
  .note{font-size:11px; color:var(--sub); margin-top:8px; line-height:1.5;}

  /* カード型の選択肢（画像つき） */
  .dash-sheet{max-height:86vh; overflow-y:auto;}
  .mcard{display:flex; gap:11px; align-items:center; background:var(--panel2); border:1px solid var(--line);
    border-radius:13px; padding:9px; margin-bottom:9px;}
  .mcard.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .thumb{width:58px; height:58px; border-radius:11px; overflow:hidden; flex-shrink:0; background:#11131c;}
  .thumb svg, .thumb .ethumb{width:100%; height:100%; display:block;}
  .ethumb{display:flex; align-items:center; justify-content:center; font-size:31px; line-height:1;}
  .mcard .info{flex:1; min-width:0;}
  .mcard .ttl{font-weight:800; font-size:14px; line-height:1.2;}
  .mcard .meta{font-size:11px; color:var(--sub); margin-top:4px; line-height:1.4;}
  .mcard .act{display:flex; flex-direction:column; gap:5px; align-items:stretch; flex-shrink:0;}
  .stepper{display:flex; align-items:center; gap:4px;}
  .stepper .pz{width:48px; text-align:center; font-weight:800; font-size:13px;}
  .step-btn{width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--panel);
    color:var(--txt); font-weight:800; font-size:15px; cursor:pointer; line-height:1;}

  /* ---- speech / dialog ---- */
  .bubble{position:fixed; background:#fff; color:#1a140e; border-radius:14px; padding:8px 12px; font-size:13px; font-weight:700;
    transform:translate(-50%,-100%); pointer-events:none; box-shadow:0 6px 18px rgba(0,0,0,.4); max-width:220px; line-height:1.4;}
  .bubble:after{content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%);
    border:7px solid transparent; border-top-color:#fff; border-bottom:0;}

  /* ---- day summary modal ---- */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; place-items:center; z-index:50;}
  .modal.show{display:grid;}
  .sheet{background:#241a12; border:1px solid var(--line); border-radius:18px; padding:22px; width:min(420px,90vw); text-align:center;}
  .sheet h2{margin:0 0 6px;} .sheet .row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .sheet .row b{color:var(--gold);}

  /* ---- loading ---- */
  #load{position:fixed; inset:0; display:grid; place-items:center; background:#10141a; z-index:100; font-size:14px; color:var(--sub);}

  /* ---- スマホ縦画面の調整 ---- */
  @media (max-width:480px){
    .hud{padding:8px; gap:6px; flex-wrap:wrap;}
    .stats{gap:12px;}
    .panel{padding:6px 9px;}
    .stat .v{font-size:15px;}
    .timectrl{gap:5px;}
    .tbtn{padding:6px 9px;}
    .hint{font-size:11px; max-width:92vw; white-space:normal; text-align:center; line-height:1.4; bottom:66px;}
    .bottom{padding:10px;}
    .btn{padding:12px 14px; font-size:13px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="load">☕ 読み込み中…</div>

<div class="hud">
  <div class="panel stats">
    <div class="stat"><div class="v gold" id="s-money">¥0</div><div class="l">所持金</div></div>
    <div class="stat"><div class="v" id="s-day">1日目</div><div class="l">経営日数</div></div>
    <div class="stat"><div class="v acc" id="s-cust">0/0</div><div class="l">提供/来客</div></div>
  </div>
  <div class="spacer"></div>
  <div class="panel timectrl">
    <div class="stat" style="margin-right:6px"><div class="v clock" id="s-clock">08:00</div><div class="l">店内時刻</div></div>
    <button class="tbtn" data-speed="0" id="sp-pause">⏸</button>
    <button class="tbtn active" data-speed="1" id="sp-1">▶</button>
    <button class="tbtn" data-speed="3" id="sp-3">▶▶</button>
  </div>
</div>

<div class="carrybadge" id="carry" style="display:none"></div>
<button id="btn-dash" title="ダッシュボード">📊</button>
<button id="btn-manage" title="経営（事務所）">🏢</button>
<div class="hint" id="hint"></div>

<div class="bottom">
  <button class="btn ghost" id="btn-mode">店に入る</button>
  <button class="btn" id="btn-close">閉店する</button>
</div>

<div class="modal" id="modal-manage">
  <div class="sheet dash-sheet">
    <h2>🏢 経営（事務所）</h2>
    <div class="dash-tabs">
      <button class="m-tab active" data-mtab="menu">メニュー</button>
      <button class="m-tab" data-mtab="supply">仕入れ</button>
      <button class="m-tab" data-mtab="equip">設備</button>
      <button class="m-tab" data-mtab="store">店舗</button>
      <button class="m-tab" data-mtab="finance">資金</button>
    </div>
    <div id="manage-body"></div>
    <button class="btn ghost" style="width:100%; margin-top:14px" id="manage-close">閉じる</button>
  </div>
</div>

<div class="modal" id="modal-dash">
  <div class="sheet dash-sheet">
    <h2>📊 経営ダッシュボード</h2>
    <div class="dash-tabs">
      <button class="dash-tab active" data-range="today">本日</button>
      <button class="dash-tab" data-range="total">累計</button>
    </div>
    <div id="dash-body"></div>
    <button class="btn ghost" style="width:100%; margin-top:14px" id="dash-close">閉じる</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2 id="m-title">1日目 閉店</h2>
    <div class="row"><span>来客数</span><span id="m-cust">0人</span></div>
    <div class="row"><span>売上</span><b id="m-rev">¥0</b></div>
    <div class="row"><span>所持金</span><b id="m-money">¥0</b></div>
    <div id="m-breakdown" style="margin-top:10px"></div>
    <div id="m-pl" style="margin-top:10px; text-align:left"></div>
    <button class="btn" style="width:100%; margin-top:16px" id="m-next">翌日へ ▶</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// =====================================================================
// Cafe Tycoon — 第1スライス（グレーボックス試作）
//  目的：俯瞰↔店内3人称の行き来 / 常時進行する時計 / 客の入店→着席→退店 / 会話 / 閉店サマリー
//  すべて簡素なジオメトリ（箱）で構築。アートは後フェーズで差し替える前提。
// =====================================================================

// ---- シミュレーション状態（表示と分離した"頭脳"の芽） ----
const sim = {
  money: 30000,
  day: 1,
  custToday: 0,
  revToday: 0,
  servedToday: 0,    // 提供できた組
  lostToday: 0,      // 我慢の限界で帰った組
  // 時間：分単位で保持。リアル1秒=ゲーム1分（=リアル1分でゲーム1時間）
  minutes: 8 * 60,   // 08:00 開店
  speed: 1,          // 0=停止, 1=等速, 3=倍速
  mode: 'store',     // 'overview' | 'store'
};
const OPEN_MIN = 8 * 60;
const SEAT_PRICE = 600; // 1組あたりの平均客単価（仮）

// ---- 集計データ（客層・商品別の売上をためる）----
const blankStats = ()=>({ visits:{}, sold:{}, served:0, lost:0, tips:0, revenue:0, cogs:0, capex:0 });
let dayStats = blankStats();      // 本日分
let totalStats = blankStats();    // これまでの累計（前日まで）
function mergeInto(t, s){
  t.served+=s.served; t.lost+=s.lost; t.tips+=s.tips; t.revenue+=s.revenue; t.cogs+=s.cogs; t.capex+=s.capex;
  for(const k in s.visits) t.visits[k]=(t.visits[k]||0)+s.visits[k];
  for(const k in s.sold)   t.sold[k]  =(t.sold[k]  ||0)+s.sold[k];
}

// ---- 資金繰り（家賃・ローン・投資）----
const RENT = { downtown:4000, college:2500, residential:2000, tourist:3500 }; // 立地別の日次家賃
const LOAN_RATE = 0.02;     // 借入の日利
const INVEST_RATE = 0.015;  // 運用の日利
const finance = { debt:0, invest:0 };
function takeLoan(n){ sim.money += n; finance.debt += n; }
function repayLoan(n){ const a=Math.min(n, finance.debt, sim.money); if(a>0){ sim.money-=a; finance.debt-=a; } }
function deposit(n){ const a=Math.min(n, sim.money); if(a>0){ sim.money-=a; finance.invest+=a; } }
function withdrawAll(){ sim.money += Math.round(finance.invest); finance.invest = 0; }

// ---- Three.js 基本セット ----
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);

// 2つのシーン：店内 / 俯瞰（依存する定数の宣言後、最下部で初期化する）
let storeScene, overScene;

// ---- ライト共通生成 ----
function addLights(scene, intensity=1){
  const hemi = new THREE.HemisphereLight(0xfff3e0, 0x402a1a, 0.9*intensity);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffe8c8, 1.0*intensity);
  dir.position.set(8, 16, 6);
  dir.castShadow = true;
  dir.shadow.mapSize.set(1024,1024);
  dir.shadow.camera.left=-20; dir.shadow.camera.right=20; dir.shadow.camera.top=20; dir.shadow.camera.bottom=-20;
  scene.add(dir);
}

// =====================================================================
//  店内シーン
// =====================================================================
const STORE = { w: 16, d: 12 };   // 店の床サイズ
const seats = [];                 // 座席 {pos, occupied}
let player;                       // プレイヤー（店長）
let storeFloor;                   // 床（タップ移動のレイキャスト対象）
let moveMarker;                   // タップ先マーカー
let counterMesh;                  // 注文カウンター（レジ）
const customers = [];             // 客リスト

// ---- 注文カウンターの行列 ----
const QUEUE_MAX = 5;
const queue = [];                 // 並んでいる客（先頭=queue[0]）
const queueSpots = [];            // 行列の立ち位置（先頭→後ろ）
for(let i=0;i<QUEUE_MAX;i++) queueSpots.push(new THREE.Vector3(-0.5, 0, -3.2 + i*1.25));
const BARISTA_SPOT = new THREE.Vector3(-2.3, 0, -3.0); // 店長がレジで接客する位置

function buildStoreScene(){
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1d160f);
  scene.fog = new THREE.Fog(0x1d160f, 30, 60);
  addLights(scene);

  // 床
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(STORE.w, STORE.d),
    new THREE.MeshStandardMaterial({ color:0x6b4f36 })
  );
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
  scene.add(floor);
  storeFloor = floor;

  // タップ移動の目的地マーカー（リング）
  moveMarker = new THREE.Mesh(
    new THREE.RingGeometry(0.3, 0.46, 22),
    new THREE.MeshBasicMaterial({ color:0xffce4d, transparent:true, opacity:0, side:THREE.DoubleSide })
  );
  moveMarker.rotation.x = -Math.PI/2; moveMarker.position.y = 0.03;
  scene.add(moveMarker);

  // 壁（3面・正面は開口＝入口側）
  const wallMat = new THREE.MeshStandardMaterial({ color:0x8a6c4a });
  const wallH = 3;
  const mkWall = (w,h,d,x,y,z)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), wallMat); m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; scene.add(m); };
  mkWall(STORE.w, wallH, 0.3, 0, wallH/2, -STORE.d/2);          // 奥
  mkWall(0.3, wallH, STORE.d, -STORE.w/2, wallH/2, 0);          // 左
  mkWall(0.3, wallH, STORE.d,  STORE.w/2, wallH/2, 0);          // 右

  // カウンター（奥）
  const counter = new THREE.Mesh(new THREE.BoxGeometry(6,1.1,1.2), new THREE.MeshStandardMaterial({ color:0x4a3b2a }));
  counter.position.set(-3, 0.55, -STORE.d/2 + 1.4); counter.castShadow=counter.receiveShadow=true;
  scene.add(counter);
  counterMesh = counter;
  // カウンター上のドリンクマシン（左）
  const machine = new THREE.Mesh(new THREE.BoxGeometry(1,0.7,0.7), new THREE.MeshStandardMaterial({ color:0x9aa0a6, metalness:0.3 }));
  machine.position.set(-4.4, 1.45, -STORE.d/2 + 1.4); machine.castShadow=true; scene.add(machine);
  // レジ（注文位置の目印・右寄り）
  const register = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.45,0.5), new THREE.MeshStandardMaterial({ color:0x2e2e38 }));
  register.position.set(-0.5, 1.32, -STORE.d/2 + 1.4); register.castShadow=true; scene.add(register);
  const regScreen = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.35,0.05), new THREE.MeshStandardMaterial({ color:0x3ddc97, emissive:0x0a3a28 }));
  regScreen.position.set(-0.5, 1.5, -STORE.d/2 + 1.16); scene.add(regScreen);

  // 入口マット（手前中央）
  const door = new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.6), new THREE.MeshStandardMaterial({ color:0xcaa24a }));
  door.rotation.x=-Math.PI/2; door.position.set(0,0.01, STORE.d/2 - 0.9);
  scene.add(door);

  // テーブル＆席（2x3 配置）
  const tableMat = new THREE.MeshStandardMaterial({ color:0x3a2a1c });
  for(let r=0;r<3;r++){
    for(let c=0;c<2;c++){
      const x = -3 + c*6;
      const z = -2 + r*3.2;
      const table = new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,0.9,12), tableMat);
      table.position.set(x,0.45,z); table.castShadow=table.receiveShadow=true; scene.add(table);
      seats.push({ pos:new THREE.Vector3(x, 0, z+0.05), occupied:false, mesh:table });
    }
  }

  // プレイヤー（店長＝箱人間）
  player = makeHuman(0xffd27f);
  player.position.set(0,0, STORE.d/2 - 3);
  player.userData.task = null;    // {type:'serve'}
  scene.add(player);

  scene._isStore = true;
  return scene;
}

// 箱人間（体＋頭）。Group を返す
function makeHuman(color, accessory){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.7, 4, 10), new THREE.MeshStandardMaterial({ color }));
  body.position.y = 0.75; body.castShadow=true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 12), new THREE.MeshStandardMaterial({ color:0xf3d6b0 }));
  head.position.y = 1.45; head.castShadow=true; g.add(head);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', onClick);
function onClick(e){
  pointer.x = (e.clientX/innerWidth)*2-1;
  pointer.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer, camera);

  if(sim.mode==='overview'){
    const hit = raycaster.intersectObject(myCafeMesh, false)[0];
    if(hit) enterStore();
  } else {
    // 客タップ：並んでる客=レジで接客 / くつろぎ客=会話
    const meshes = customers.map(c=>c.group.userData.body);
    const chit = raycaster.intersectObjects(meshes, false)[0];
    if(chit){
      const cust = customers.find(c=>c.group.userData.body===chit.object);
      if(cust){
        if(cust.state==='QUEUE') goServeFront();
        else if(cust.state==='SEATED') talkTo(cust);
        return;
      }
    }
    // レジ（カウンター）タップ：先頭客を接客しに行く
    if(counterMesh){
      const khit = raycaster.intersectObject(counterMesh, false)[0];
      if(khit){ goServeFront(); return; }
    }
    // それ以外は床タップ＝その地点へ移動
    const fhit = raycaster.intersectObject(storeFloor, false)[0];
    if(fhit) setMoveTarget(fhit.point);
  }
}

// タップした床地点へ歩く（タスク無し）
function setMoveTarget(point){
  const x = THREE.MathUtils.clamp(point.x, -STORE.w/2+0.6, STORE.w/2-0.6);
  const z = THREE.MathUtils.clamp(point.z, -STORE.d/2+0.6, STORE.d/2-0.6);
  player.userData.task = null;
  player.userData.moveTarget = new THREE.Vector3(x, 0, z);
  moveMarker.position.set(x, 0.03, z);
  moveMarker.material.opacity = 0.95;
}
// レジへ向かい、行列の先頭客を接客する
function goServeFront(){
  if(queue.length===0) return;
  player.userData.task = { type:'serve' };
  player.userData.moveTarget = BARISTA_SPOT.clone();
  moveMarker.position.set(BARISTA_SPOT.x, 0.03, BARISTA_SPOT.z);
  moveMarker.material.opacity = 0.95;
}
// 目的地（レジ）に着いたときタスクを実行：先頭客に提供
function arriveTask(){
  const task = player.userData.task;
  player.userData.task = null;
  if(!task || task.type!=='serve') return;
  const c = queue[0];
  if(!c || c.state!=='QUEUE') return;           // 先頭がいない/もう帰った
  queue.shift();                                 // 列から外す（後続が前進）
  removeOrderTag(c);
  const ratio = Math.max(0, c.patience/c.patienceMax);
  const tip = Math.round(c.pay*ratio*0.3*(c.tipFactor||1)*qualityMult());   // 待たせない×ペルソナ×常連×設備品質
  const total = c.pay + tip;
  sim.money += total; sim.revToday += total; sim.servedToday++;
  dayStats.sold[c.order.emoji] = (dayStats.sold[c.order.emoji]||0) + 1;  // 商品別の販売を記録
  dayStats.served++; dayStats.tips += tip; dayStats.revenue += total;
  if(c.regular) loyalty[c.regular.name]++;                    // 常連の親密度UP
  // 受け取ったドリンクを頭上に（演出）
  floatText(c.group, (c.regular?('💖'+c.regular.name+' '):'☕ ')+'+¥'+total + (tip>0?' ⭐':''));
  // 空席があれば席へ、満席ならテイクアウトで退店（支払い済み）
  const seat = seats.find(s=>!s.occupied);
  if(seat){ seat.occupied=true; c.seat=seat; c.state='GO_SEAT'; }
  else { c.state='LEAVE'; }
}

// 来店ペルソナを抽選：時間帯 × 立地 × 内装の雰囲気 × 価格帯 で重み付け
function pickPersona(){
  const h = curHour();
  const weights = PERSONAS.map(p=>{
    let w = (h>=p.peak[0] && h<p.peak[1]) ? 3 : 1;                          // 時間帯
    if(store.location===p.loc) w *= 2.2;                                    // 立地の相性
    if(store.vibe===p.vibe)    w *= 1.6;                                    // 内装の雰囲気
    w *= Math.max(0.3, Math.min(2, 1 + (p.priceTol - store.priceLevel)));   // 価格帯の合致
    return w;
  });
  let r = Math.random()*weights.reduce((a,b)=>a+b,0);
  for(let i=0;i<PERSONAS.length;i++){ r-=weights[i]; if(r<=0) return PERSONAS[i]; }
  return PERSONAS[0];
}

const materialCost = item => Object.entries(item.recipe).reduce((a,[m,q])=>a + q*(materials[m]?.cost||0), 0);
const inStock = item => Object.entries(item.recipe).every(([m,q])=> (materials[m]?.stock||0) >= q);

function recomputePriceLevel(){

function restock(key){

// ペルソナ/常連の希望から、提供中＆在庫ありの一品を選ぶ
function chooseOrder(persona, regular){

  if(avail.length===0) return null;
  if(regular){ const f = avail.find(m=>m.emoji===regular.fav); if(f) return f; }
  const liked = avail.filter(m=>persona.menu.includes(m.emoji));
  const pool = liked.length ? liked : avail;

function trySpawnCustomer(dtGameMin){
  // 営業時間内のみ。時間あたりの来店ペース（仮）
  spawnAccum += dtGameMin;
  const interval = 7; // ゲーム内7分ごとに来店判定
  while(spawnAccum >= interval){
    spawnAccum -= interval;
    if(queue.length >= queueCap()) continue;   // 行列が一杯なら入店しない（設備で拡張）
    if(Math.random() < 0.6) spawnCustomer();
  }
}

function spawnCustomer(){
  // 常連が来るか？（日が経つほど確率UP、最大45%）
  const regChance = Math.min(0.5, 0.08 + sim.day*0.04 + (equip.decor.lv-1)*0.02);
  let regular=null, persona;
  if(Math.random() < regChance){
    regular = REGULARS[(Math.random()*REGULARS.length)|0];
    persona = PMAP[regular.key];
  } else {
    persona = pickPersona();           // 店の属性×時間帯で客層が偏る
  }
  // 注文：提供中＆在庫ありから（常連は"いつもの"優先）。何も作れなければ入店せず帰る
  const order = chooseOrder(persona, regular);
  if(!order) return;                             // 在庫切れ等＝入店せず
  consume(order);                                // 材料を消費（仕込み）
  const color = regular ? regular.color : persona.color;
  const g = makeHuman(color, persona.acc);
  g.position.set(0,0, STORE.d/2 - 1);   // 入口から
  storeScene.add(g);
  const loy = regular ? loyalty[regular.name] : 0;
  const cust = {
    group:g, seat:null, state:'QUEUE', t:0, persona, regular, order,
    stay: rrange(persona.stay),                  // 着席後の滞在(ゲーム分)
    patience: rrange(persona.patience) * ambianceMult(), // 居心地が良いほど待てる
    pay: order.price,                            // 客単価＝メニュー価格
    tipFactor: persona.tip + loy*0.05,           // 常連は通うほどチップが厚い
    tag:null, nameTag:null,
  };
  cust.patienceMax = cust.patience;
  customers.push(cust);
  queue.push(cust);          // 入店＝注文の列に並ぶ
  sim.custToday++;
  dayStats.visits[persona.key] = (dayStats.visits[persona.key]||0) + 1;  // 客層を記録
  makeOrderTag(cust);        // 注文（頭上に表示）
  if(regular) makeNameTag(cust);
}

function updateCustomers(dtReal, dtGameMin){
  const speed = 2.2 * dtReal; // 歩行速度
  for(let i=customers.length-1;i>=0;i--){
    const c = customers[i];
    if(c.state==='QUEUE'){
      // 自分の並び位置へ歩く（先頭が抜けると前に詰める）
      const idx = queue.indexOf(c);
      const spot = queueSpots[Math.min(idx, queueSpots.length-1)];
      stepToward(c.group.position, spot, speed);
      c.group.rotation.y = Math.PI;   // カウンターを向く
      // 列で待つ間、我慢が減る
      c.patience -= dtGameMin;
      if(c.patience<=0){              // 我慢の限界→怒って退店（支払いなし）
        const qi = queue.indexOf(c); if(qi>=0) queue.splice(qi,1);
        c.state='LEAVE'; c.angry=true; sim.lostToday++; dayStats.lost++;
        removeOrderTag(c);
        floatText(c.group, '💢 帰っちゃった…');
      }
    } else if(c.state==='GO_SEAT'){
      if(stepToward(c.group.position, c.seat.pos, speed)){ c.state='SEATED'; c.t=0; }
    } else if(c.state==='SEATED'){
      c.t += dtGameMin;
      if(c.t >= c.stay){ c.state='LEAVE'; }
    } else if(c.state==='LEAVE'){
      const exit = new THREE.Vector3(0,0, STORE.d/2 - 0.5);
      if(stepToward(c.group.position, exit, speed)){
        if(c.seat) c.seat.occupied=false;
        storeScene.remove(c.group);
        removeOrderTag(c); removeNameTag(c);
        if(c._bubble) c._bubble.remove();
        customers.splice(i,1);
      }
    }
  }
}

// xz平面で target に向けて step。到達したら true
function stepToward(pos, target, step){
  const dx=target.x-pos.x, dz=target.z-pos.z;
  const dist=Math.hypot(dx,dz);
  if(dist < 0.12) return true;
  pos.x += dx/dist*Math.min(step,dist);
  pos.z += dz/dist*Math.min(step,dist);
  return false;
}

// =====================================================================
//  プレイヤー移動（店内のみ）
// =====================================================================
function updatePlayer(dt){
  if(sim.mode!=='store') return;
  const sp = 4.5*dt;
  let vx=0, vz=0;
  if(keys.KeyW||keys.ArrowUp) vz-=1;
  if(keys.KeyS||keys.ArrowDown) vz+=1;
  if(keys.KeyA||keys.ArrowLeft) vx-=1;
  if(keys.KeyD||keys.ArrowRight) vx+=1;

  if(vx||vz){
    // キーボード操作（タップ移動・タスクは中断）
    player.userData.moveTarget = null; player.userData.task = null;
    const l=Math.hypot(vx,vz); vx/=l; vz/=l;
    player.position.x = THREE.MathUtils.clamp(player.position.x+vx*sp, -STORE.w/2+0.6, STORE.w/2-0.6);
    player.position.z = THREE.MathUtils.clamp(player.position.z+vz*sp, -STORE.d/2+0.6, STORE.d/2-0.6);
    player.rotation.y = Math.atan2(vx,vz);
  } else if(player.userData.moveTarget){
    // タップ移動：目的地へ歩く
    const t = player.userData.moveTarget;
    const dx=t.x-player.position.x, dz=t.z-player.position.z;
    const dist=Math.hypot(dx,dz);
    if(dist<0.2){ player.userData.moveTarget=null; arriveTask(); }
    else{
      player.position.x += dx/dist*Math.min(sp,dist);
      player.position.z += dz/dist*Math.min(sp,dist);
      player.rotation.y = Math.atan2(dx,dz);
    }
  }

  // マーカーをゆっくりフェードアウト
  if(moveMarker && moveMarker.material.opacity>0){
    moveMarker.material.opacity = Math.max(0, moveMarker.material.opacity - dt*0.5);
  }
}

}

// 日次PL（営業損益）
function plRent(){ return RENT[store.location]||0; }
function plInterest(){ return Math.round(finance.debt*LOAN_RATE); }
function plBreakdown(){
  const tips = dayStats.tips;
  const sales = dayStats.revenue - tips;
  const rent = plRent(), interest = plInterest();
  const op = sales + tips - dayStats.cogs - rent - interest;
  const row = (l,v,neg)=>`<div class="row"><span>${l}</span><span style="${neg?'color:var(--red)':''}">${neg?'−':''}¥${Math.abs(v).toLocaleString('ja-JP')}</span></div>`;
  let h = `<div class="dash-h">📒 日次損益（PL）</div>`;
  h += row('売上（商品）', sales);
  h += row('チップ', tips);
  h += row('仕入（原価）', dayStats.cogs, true);
  h += row(`家賃（${LOC_JP[store.location]}）`, rent, true);
  if(interest>0) h += row('借入利息', interest, true);
  h += `<div class="row" style="border-bottom:0"><span><b>営業損益</b></span><b style="color:${op>=0?'var(--gold)':'var(--red)'}">${op<0?'−':''}¥${Math.abs(op).toLocaleString('ja-JP')}</b></div>`;
  if(dayStats.capex>0) h += `<div class="note">※ 別途 設備投資 −¥${dayStats.capex.toLocaleString('ja-JP')}（現金から支出済み）</div>`;
  return h;
}
function miniBreakdown(){
  const s = dayStats;
  const topP = PERSONAS.map(p=>({n:p.name, v:s.visits[p.key]||0})).sort((a,b)=>b.v-a.v)[0];
  const topM = MENU.map(m=>({n:m.emoji+m.name, v:s.sold[m.emoji]||0})).sort((a,b)=>b.v-a.v)[0];
  return `<div class="row"><span>一番多い客層</span><span>${topP&&topP.v? topP.n+`（${topP.v}組）`:'—'}</span></div>
          <div class="row"><span>売れ筋商品</span><span>${topM&&topM.v? topM.n+`（${topM.v}杯）`:'—'}</span></div>`;
}

    for(const [k,mt] of Object.entries(materials)){
      const low = mt.stock < mt.buyAmt*0.5;
      const meta = `原価¥${mt.cost}/${mt.unit}・在庫 <span class="${low?'low':''}">${mt.stock}${mt.unit}</span>`;
      const act = `<button class="mbtn" data-buy="${k}" ${sim.money<mt.buyCost?'disabled':''}>+${mt.buyAmt}<br>¥${mt.buyCost.toLocaleString('ja-JP')}</button>`;
      h += mcard(matThumb(k), mt.name, meta, act);
    }
    h += `<div class="note">提供で材料を消費。在庫切れの品は注文されません（仕入れ＝原価の支払い）。</div>`;
  } else if(mtab==='equip'){
    h += `<div class="dash-h">🪑 家具（店内デザイン）</div>`;
    const full = extraUsed>=EXTRA_SLOTS.length;
    h += mcard(ART.table, 'テーブル席を増設', `現在 ${seats.length}席（満席だと客を逃す）`,
      `<button class="mbtn" data-furniture="1" ${full||sim.money<furnitureCost()?'disabled':''}>${full?'増設不可':'＋1席<br>¥'+furnitureCost().toLocaleString('ja-JP')}</button>`);
    h += `<div class="dash-h">⚙️ 設備投資</div>`;
    for(const [k,e] of Object.entries(equip)){
      const max = e.lv>=e.max;
      h += mcard(ART[k], `${e.name} <b>Lv.${e.lv}</b>`, e.desc,
        `<button class="mbtn" data-equip="${k}" ${max||sim.money<equipCost(e)?'disabled':''}>${max?'最大':'強化<br>¥'+equipCost(e).toLocaleString('ja-JP')}</button>`);
    }
    h += `<div class="note">席＝取りこぼし減／マシン＝チップ／POS＝行列収容／内装＝居心地（我慢・常連化）。</div>`;
  } else if(mtab==='store'){
    h += `<div class="dash-h">📍 立地（移転 ¥${RELOCATE_COST.toLocaleString('ja-JP')}）</div>`;
    const locHint = { downtown:'会社員が多い', college:'学生が多い', residential:'家族が多い', tourist:'観光客が多い' };
    for(const k in LOC_JP){
      const cur = store.location===k;
      h += mcard(ART[k], LOC_JP[k], locHint[k], `<button class="mbtn ${cur?'sel':''}" data-loc="${k}" ${cur?'disabled':''}>${cur?'選択中':'移転'}</button>`, cur);
    }
    h += `<div class="dash-h">🎨 内装の雰囲気（改装 ¥${RENOVATE_COST.toLocaleString('ja-JP')}）</div>`;
    const vibeHint = { cozy:'家族・学生に好相性', chic:'会社員・観光客に好相性', pop:'学生に好相性' };
    for(const k in VIBE_JP){
      const cur = store.vibe===k;
      h += mcard(ART[k], VIBE_JP[k], vibeHint[k], `<button class="mbtn ${cur?'sel':''}" data-vibe="${k}" ${cur?'disabled':''}>${cur?'選択中':'改装'}</button>`, cur);
    }
    h += `<div class="note">立地×内装×価格で来る客層が変わります。</div>`;
  } else if(mtab==='finance'){
    const rent = RENT[store.location]||0;
    h += `<div class="dash-kpis">
       <div class="kpi"><div class="v gold">¥${sim.money.toLocaleString('ja-JP')}</div><div class="l">現金</div></div>
       <div class="kpi"><div class="v" style="color:var(--red)">¥${finance.debt.toLocaleString('ja-JP')}</div><div class="l">借入残（日利2%）</div></div>
       <div class="kpi"><div class="v green">¥${Math.round(finance.invest).toLocaleString('ja-JP')}</div><div class="l">運用中（日利1.5%）</div></div>
       <div class="kpi"><div class="v">¥${rent.toLocaleString('ja-JP')}/日</div><div class="l">家賃（${LOC_JP[store.location]}）</div></div>
     </div>`;
    h += `<div class="dash-h">🏦 借入 / 返済</div>`;
    h += `<div class="mrow"><div class="nm">融資を受ける<div class="sub2">現金が増えるが借入残＝日利2%</div></div>
      <button class="mbtn" data-loan="10000">+¥1万</button><button class="mbtn" data-loan="30000">+¥3万</button></div>`;
    h += `<div class="mrow"><div class="nm">返済する<div class="sub2">借入残・現金の範囲で返済</div></div>
      <button class="mbtn" data-repay="10000" ${finance.debt<=0||sim.money<=0?'disabled':''}>¥1万 返済</button></div>`;
    h += `<div class="dash-h">📈 投資（運用）</div>`;
    h += `<div class="mrow"><div class="nm">余剰資金を運用<div class="sub2">毎日+1.5%で増える</div></div>
      <button class="mbtn" data-deposit="10000" ${sim.money<10000?'disabled':''}>¥1万 預入</button>
      <button class="mbtn" data-withdraw="1" ${finance.invest<=0?'disabled':''}>全額引出</button></div>`;
    h += `<div class="note">毎日の閉店時に家賃と借入利息が引かれ、運用は+1.5%増えます。日次の損益は閉店サマリーで確認できます。</div>`;
  }
  el.innerHTML = h;
}
document.getElementById('manage-body').addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.price){
    const [em,dir] = t.dataset.price.split('|'); const m = MENU.find(x=>x.emoji===em);
    if(m){ m.price = Math.max(100, m.price + (dir==='+'?50:-50)); recomputePriceLevel(); }
  } else if(t.dataset.toggle){
    const m = MENU.find(x=>x.emoji===t.dataset.toggle); if(m){ m.enabled=!m.enabled; recomputePriceLevel(); }
  } else if(t.dataset.dev!==undefined){
    const d = DEV_CATALOG[+t.dataset.dev];
    if(d && sim.money>=d.devCost && !MENU.some(m=>m.name===d.name)){
      sim.money -= d.devCost; dayStats.capex += d.devCost;
      MENU.push({ emoji:d.emoji, name:d.name, basePrice:d.basePrice, price:d.basePrice, enabled:true, recipe:d.recipe });
      recomputePriceLevel();
    }
  } else if(t.dataset.buy){
    restock(t.dataset.buy);
  } else if(t.dataset.furniture){
    buyFurniture();
  } else if(t.dataset.equip){
    upgradeEquip(t.dataset.equip);
  } else if(t.dataset.loc){
    if(store.location!==t.dataset.loc && sim.money>=RELOCATE_COST){ sim.money-=RELOCATE_COST; dayStats.capex+=RELOCATE_COST; store.location=t.dataset.loc; }
  } else if(t.dataset.vibe){
    if(store.vibe!==t.dataset.vibe && sim.money>=RENOVATE_COST){ sim.money-=RENOVATE_COST; dayStats.capex+=RENOVATE_COST; store.vibe=t.dataset.vibe; }
  } else if(t.dataset.loan){
    takeLoan(+t.dataset.loan);
  } else if(t.dataset.repay){
    repayLoan(+t.dataset.repay);
  } else if(t.dataset.deposit){
    deposit(+t.dataset.deposit);
  } else if(t.dataset.withdraw){
    withdrawAll();
  }
  renderManage();
});
const manageModal = document.getElementById('modal-manage');
document.getElementById('btn-manage').onclick = ()=>{ renderManage(); manageModal.classList.add('show'); };
document.getElementById('manage-close').onclick = ()=> manageModal.classList.remove('show');
document.querySelectorAll('.m-tab').forEach(t=>{
  t.onclick = ()=>{
    mtab = t.dataset.mtab;
    document.querySelectorAll('.m-tab').forEach(x=>x.classList.toggle('active', x===t));
    renderManage();
  };
});
recomputePriceLevel();   // 起動時に価格帯を算出

// =====================================================================
//  HUD更新
// =====================================================================
function updateHUD(){
  document.getElementById('s-money').textContent = '¥'+sim.money.toLocaleString('ja-JP');
  document.getElementById('s-day').textContent = sim.day+'日目';
  document.getElementById('s-cust').textContent = sim.servedToday+'/'+sim.custToday;
  document.getElementById('s-clock').textContent = fmtClock(sim.minutes);
}

// =====================================================================
//  シーン初期化（依存定数がすべて宣言された後に実行）
// =====================================================================
storeScene = buildStoreScene();
overScene  = buildOverviewScene();

// =====================================================================
//  メインループ
// =====================================================================
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); // リアル秒（スパイク抑制）

  // ゲーム内時間の進行：リアル1秒 = ゲーム1分 × speed
  const dtGameMin = dt * 60 * sim.speed / 60; // = dt*speed (分) … 1秒で1分
  if(sim.speed>0){
    sim.minutes += dt * sim.speed; // 1リアル秒で speed ゲーム分
    if(sim.mode==='store' || true) trySpawnCustomer(dt*sim.speed);
  }

  updatePlayer(dt);
  if(sim.speed>0) updateCustomers(dt, dt*sim.speed);
  updateCamera(dt);
  updateBubble(dt);
  updateFloats(dt);
  updateOrderTags();
  updateNameTags();

  // 俯瞰のカップを回す（ちょい演出）
  if(myCafeMesh.userData.cup) myCafeMesh.userData.cup.rotation.y += dt;

  updateHUD();
  renderer.render(sim.mode==='store' ? storeScene : overScene, camera);
}

// =====================================================================
//  起動
// =====================================================================
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
btnMode.textContent = sim.mode==='store' ? '街に出る（俯瞰）' : '店に入る';
updateHint();
document.getElementById('load').style.display='none';
animate();
</script>
