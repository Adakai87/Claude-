name: Enable and Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Enabling GitHub Pages..."
          RESPONSE=$(gh api repos/${{ github.repository }}/pages \
            -X POST \
            --field source[branch]=gh-pages \
            --field source[path]=/ \
            2>&1) || true
          echo "Response: $RESPONSE"

          echo "Checking Pages status..."
          gh api repos/${{ github.repository }}/pages 2>&1 || echo "Pages not yet available"
