<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MOMENTUM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="1" stop-color="#080810"/>
    </linearGradient>
    <radialGradient id="aurora" cx="66%" cy="34%" r="55%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0.30" y1="0.78" x2="0.74" y2="0.26">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="0.8" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="head" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#e0f7ff"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#aurora)"/>
  <g fill="#ffffff">
    <circle cx="102" cy="143" r="4" opacity="0.9"/>
    <circle cx="420" cy="358" r="3.4" opacity="0.8"/>
    <circle cx="154" cy="256" r="2.6" opacity="0.7"/>
    <circle cx="297" cy="317" r="3" opacity="0.75"/>
    <circle cx="399" cy="235" r="2.2" opacity="0.7"/>
  </g>
  <path d="M154 399 L379 133" stroke="url(#trail)" stroke-width="26" stroke-linecap="round" fill="none" filter="url(#glow)" opacity="0.92"/>
  <circle cx="379" cy="133" r="62" fill="url(#head)"/>
  <circle cx="379" cy="133" r="20" fill="#ffffff" filter="url(#glow)"/>
