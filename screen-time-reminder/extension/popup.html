<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>推しリマインダー</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hd">
    <span class="hd-emoji" id="hd-emoji">🔥</span>
    <div>
      <div class="hd-title">推しリマインダー</div>
      <div class="hd-sub">今日の利用時間</div>
    </div>
  </header>

  <ul id="usage-list" class="usage-list">
    <li class="empty">まだ計測データがありません</li>
  </ul>

  <div class="actions">
    <button id="reset-btn" class="btn ghost">今日の記録をリセット</button>
    <button id="options-btn" class="btn primary">⚙ 設定を開く</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
