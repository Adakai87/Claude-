<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京 v3.1 — BuildIt質感の地形（L0）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2c5f88;font-family:system-ui,'Hiragino Sans',sans-serif}
  #app{position:fixed;inset:0}
  .tag{position:absolute;transform:translate(-50%,-50%);background:rgba(20,24,30,.78);color:#ffd987;
       padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;pointer-events:none;white-space:nowrap;
       border:1px solid rgba(255,217,135,.35)}
  .tag.b{color:#9fd4ff;border-color:rgba(159,212,255,.35)}
  #note{position:fixed;left:12px;bottom:12px;color:#eaf2f8;font-size:12px;background:rgba(20,30,40,.72);
        padding:8px 12px;border-radius:10px;max-width:440px;line-height:1.6}
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app"></div>
<div id="note"><b>東京 v3.1 — BuildIt質感の地形（L0のみ・道路なし）</b><br>
なめらか海岸線／水の深度グラデ＋波打ち際／街フラット＋海辺だけ坂／外は海。<br>
内部データは100×100タイルのまま（道路計画に影響なし）。</div>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2c5f88);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('app').appendChild(renderer.domElement);

const q = new URLSearchParams(location.search);
const VH = +q.get('h') || 118, VX = +q.get('x') || 0, VZ = +q.get('z') || 0;
let cam;
function makeCam(){
  const a = innerWidth/innerHeight;
  cam = new THREE.OrthographicCamera(-VH*a, VH*a, VH, -VH, 1, 2000);
  cam.position.set(VX+150, 170, VZ+150); cam.lookAt(VX,0,VZ);
}
makeCam();
addEventListener('resize', ()=>{ renderer.setSize(innerWidth,innerHeight); makeCam(); render(); placeTags(); });

scene.add(new THREE.HemisphereLight(0xfffaf0, 0x7a9a68, 1.1));
const dl = new THREE.DirectionalLight(0xffedc4, 1.05); dl.position.set(80,120,50); scene.add(dl);

// ================= 地形の定義（連続関数＝なめらかさの源泉） =================
const N=100, CS=3, HALF=N*CS/2;
const EXT=22, Ne=N+EXT*2;
const T = { LAND:0, BAY:1, RIVER:2, FILL:3 };

const coastX = z => 62 - 0.22*z + 13*Math.sin(z*0.031) + 5*Math.sin(z*0.11+2);
const riverX = z => -22 + 15*Math.sin((z+150)*0.021) + 0.42*Math.max(0, z+42);
const RIVER_HALF = 4.5;
const ISLANDS = [ {x:84, z:16, w:30, d:21}, {x:63, z:75, w:27, d:18} ];

// 陸への「符号つき距離」: 正=陸side / 負=水side。全てが連続量→海岸線が滑らかな曲線になる
function sdParts(x,z){
  const sBay = coastX(z) - x;                                        // 湾
  const sRiv = (z<121) ? Math.abs(x - riverX(z)) - RIVER_HALF : 1e9; // 川
  let sIsl = -1e9;                                                   // 埋立地（内側で正）
  for(const s of ISLANDS){
    const v = Math.min(s.w/2 - Math.abs(x-s.x), s.d/2 - Math.abs(z-s.z));
    if(v > sIsl) sIsl = v;
  }
  let sd = Math.min(sBay, sRiv);
  if(sIsl > sd) sd = sIsl;
  return { sd, sBay, sRiv, sIsl };
}

// ゲーム用コアグリッド（道路計画は今後もこのタイルで進める）
function typeAt(x,z){
  const p = sdParts(x,z);
  if(p.sIsl > 0) return T.FILL;
  if(p.sd > 0) return T.LAND;
  return (p.sRiv < p.sBay) ? T.RIVER : T.BAY;
}
const grid = new Uint8Array(N*N);
const cellX = i => -HALF + i*CS + CS/2, cellZ = j => -HALF + j*CS + CS/2;
for(let j=0;j<N;j++)for(let i=0;i<N;i++) grid[j*N+i] = typeAt(cellX(i), cellZ(j));
window.CITY = { N, CS, HALF, T, grid, cellX, cellZ };

const hash=(i,j)=> (((i*73856093 ^ j*19349663)>>>0)%1000)/1000;
const clamp01=v=>Math.min(1,Math.max(0,v));

// 地形の高さ（地形メッシュと道路が同じ関数を共有＝浮き/めり込みが起きない）
function terrainH(x,z){
  const {sd, sIsl} = sdParts(x,z);
  if(sIsl > 0) return (sIsl<=1) ? -0.12 + sIsl*0.34 : Math.min(0.5, 0.22 + (sIsl-1)*0.08);
  if(sd <= 0) return -0.12 + Math.max(-2.4, sd*0.42);
  if(sd <= 1) return -0.12 + sd*0.28;
  if(sd <= 5) return 0.16;
  return 0.16 + clamp01((sd-5)/9)*1.3;
}

// ================= 地形メッシュ（頂点=連続距離から高さと色を決める） =================
const SUB=3, STEPV=CS/SUB;                       // 頂点間隔=1.0
const NV=Ne*SUB, V=NV+1;
const vxAt = vi => -HALF + (vi/SUB - EXT)*CS;
{
  const pos=new Float32Array(V*V*3), col=new Float32Array(V*V*3);
  const cGrass=new THREE.Color(0x66ad49), cSand=new THREE.Color(0xecd9a6), cWet=new THREE.Color(0xcfbd8f);
  const cBed=new THREE.Color(0xc2b083), cFill=new THREE.Color(0xa8b29b), cLush=new THREE.Color(0x7cc258);
  const tmp=new THREE.Color();
  for(let vj=0;vj<V;vj++)for(let vi=0;vi<V;vi++){
    const x=vxAt(vi), z=vxAt(vj);
    const {sd, sBay, sRiv, sIsl} = sdParts(x,z);
    const h = terrainH(x,z);   // 水際は連続な斜面で水面を横切る＝波打ち際が滑らか。街は完全フラット
    const o=(vj*V+vi)*3;
    pos[o]=x; pos[o+1]=h; pos[o+2]=z;
    // ---- 色 ----
    if(sIsl > 0){ tmp.copy(cFill); const f=1+(hash(vi,vj)-0.5)*0.05; tmp.r*=f; tmp.g*=f; tmp.b*=f; }
    else {
      tmp.copy(cGrass);
      const f = 1 + ((hash(vi>>3,vj>>3)*0.65 + hash(vi>>1,vj>>1)*0.35) - 0.5)*0.09;
      tmp.r*=f; tmp.g*=f; tmp.b*=f;
      if(sRiv < 2.6) tmp.lerp(cLush, 0.5*(1 - sRiv/2.6));             // 川辺は瑞々しく
      const sandF = 1 - clamp01((sBay-4)/4);                          // 湾に近いほど砂
      if(sandF > 0) tmp.lerp(cSand, sandF);
    }
    // 水面下への移行も連続ブレンド（閾値なし）：濡れ砂→海底
    const under = clamp01((0.5 - sd)/1.6);
    if(under > 0){ tmp.lerp(cWet, Math.min(1, under*1.15)); tmp.lerp(cBed, clamp01((-sd-1.5)/2.5)); }
    col[o]=tmp.r; col[o+1]=tmp.g; col[o+2]=tmp.b;
  }
  const idx=[];
  for(let vj=0;vj<NV;vj++)for(let vi=0;vi<NV;vi++){
    const a=vj*V+vi, b=a+1, c=a+V, d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.95})));
}

// ================= 水面（全域1枚の板・色は距離グラデ）=================
// 地形が水面より高い所では隠れる→見えている境界線＝連続関数の等高線＝完全に滑らかな波打ち際
{
  const pos=new Float32Array(V*V*3), col=new Float32Array(V*V*3);
  const cFoam=new THREE.Color(0xf2fbf6), cShal=new THREE.Color(0x55c2d8), cDeep=new THREE.Color(0x2465a8);
  const tmp=new THREE.Color();
  for(let vj=0;vj<V;vj++)for(let vi=0;vi<V;vi++){
    const x=vxAt(vi), z=vxAt(vj);
    const {sd} = sdParts(x,z);
    const w = -sd;                                                    // 水側の深さ(概算)
    // 泡→浅瀬→深海を全て連続ブレンド（閾値なし＝ギザギザしない）
    tmp.copy(cShal).lerp(cDeep, clamp01((w-1.6)/15));
    const foamF = 1 - clamp01((w-0.2)/2.2);
    if(foamF > 0) tmp.lerp(cFoam, foamF);
    const o=(vj*V+vi)*3;
    pos[o]=x; pos[o+1]=0.02; pos[o+2]=z;
    col[o]=tmp.r; col[o+1]=tmp.g; col[o+2]=tmp.b;
  }
  const idx=[];
  for(let vj=0;vj<NV;vj++)for(let vi=0;vi<NV;vi++){
    const a=vj*V+vi, b=a+1, c=a+V, d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.BufferAttribute(col,3));
  geo.setIndex(idx); geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.33, metalness:0.05})));
}
// さらに外側は深い海
{
  const far=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400), new THREE.MeshStandardMaterial({color:0x2465a8, roughness:0.4}));
  far.rotation.x=-Math.PI/2; far.position.y=-0.05; scene.add(far);
}

// ================= L1 道路・第1弾（湾岸幹線＋環状幹線） =================
window.CITY.road = new Uint8Array(N*N);           // 道路タイル記録（後の街路・街区づくりの土台）

function resample(pts, step){
  const out=[pts[0]]; let acc=0;
  for(let i=1;i<pts.length;i++){
    let [px,pz]=out[out.length-1]; const [qx,qz]=pts[i];
    let d=Math.hypot(qx-px,qz-pz);
    while(acc+d>=step){ const t=(step-acc)/d; const mx=px+(qx-px)*t, mz=pz+(qz-pz)*t; out.push([mx,mz]); px=mx; pz=mz; d=Math.hypot(qx-px,qz-pz); acc=0; }
    acc+=d;
  }
  out.push(pts[pts.length-1]); return out;
}
// 高さつきリボン（各点にy）
function ribbonY(P, Y, w, lift, color, rough=0.9){
  const pos=[]; const n=P.length; const nx=[], nz=[];
  for(let i=0;i<n;i++){
    const a=P[Math.max(0,i-1)], b=P[Math.min(n-1,i+1)];
    let dx=b[0]-a[0], dz=b[1]-a[1]; const L=Math.hypot(dx,dz)||1;
    nx.push(-dz/L); nz.push(dx/L);
  }
  for(let i=0;i<n-1;i++){
    const h=w/2;
    const ax=P[i][0]+nx[i]*h, az=P[i][1]+nz[i]*h, bx=P[i][0]-nx[i]*h, bz=P[i][1]-nz[i]*h;
    const cx=P[i+1][0]+nx[i+1]*h, cz=P[i+1][1]+nz[i+1]*h, dx2=P[i+1][0]-nx[i+1]*h, dz2=P[i+1][1]-nz[i+1]*h;
    const y0=Y[i]+lift, y1=Y[i+1]+lift;
    pos.push(ax,y0,az, bx,y0,bz, cx,y1,cz,  bx,y0,bz, dx2,y1,dz2, cx,y1,cz);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:rough, side:THREE.DoubleSide}));
  scene.add(m); return m;
}
const pillarMat = new THREE.MeshStandardMaterial({color:0x8b939d});
// 幹線舗装：地形の高さをなぞる。水面上は自動で橋（デッキ高1.05＋橋脚）、前後は自然なスロープ
function paveArterial(pts, {closed=false, flatY=null}={}){
  const W_AS=7.0, W_SW=W_AS+2.6;
  let P = resample(pts, 2.5);
  if(closed){ P.push(P[0], P[1]); }                                 // ループは重ねて閉じる＝継ぎ目レス
  // 高さ: 街なか道路はフラット固定。地形追従型は「水の上(sd<0.3)だけ」橋になる
  const rawY = P.map(([x,z])=>{
    if(flatY!==null) return flatY;
    return sdParts(x,z).sd > 0.3 ? terrainH(x,z) : 1.05;
  });
  const Y=rawY.slice();
  if(flatY===null)
    for(let pass=0; pass<3; pass++)                                 // 平滑化＝橋の取り付けスロープ
      for(let i=1;i<Y.length-1;i++) Y[i]=(Y[i-1]+Y[i]*2+Y[i+1])/4;
  // 橋区間の検出（水の上の連続区間）→ デッキを緩いアーチに
  const runs=[];
  if(flatY===null){
    let s=-1;
    for(let i=0;i<P.length;i++){
      const onW = sdParts(P[i][0],P[i][1]).sd < 0.3;
      if(onW && s<0) s=i;
      if((!onW || i===P.length-1) && s>=0){ const e=onW? i : i-1; if(e-s>=3) runs.push([Math.max(0,s-2), Math.min(P.length-1,e+2)]); s=-1; }
    }
    for(const [a,b] of runs) for(let i=a;i<=b;i++){ const t=(i-a)/(b-a); Y[i]+=Math.sin(t*Math.PI)*0.55; }
  }
  ribbonY(P,Y,W_SW,0.045,0xdcd6c4,0.95);                            // 歩道縁（ベージュ）
  ribbonY(P,Y,W_AS,0.075,0x7d838b,0.85);                            // アスファルト（明るめ）
  // 白の破線センターライン
  for(let i=0;i+2<P.length;i+=4){
    ribbonY(P.slice(i,i+2), Y.slice(i,i+2), 0.5, 0.095, 0xf7f5ec, 0.8);
  }
  // ===== 橋の装飾（朱色の鋼アーチ＋吊り材＋白欄干＋コンクリ橋脚）=====
  const archMat=new THREE.MeshStandardMaterial({color:0xc84b3f, roughness:0.55, metalness:0.25});
  const railMat=new THREE.MeshStandardMaterial({color:0xf4f3ea, roughness:0.7});
  const pierMat=new THREE.MeshStandardMaterial({color:0x9aa0a6, roughness:0.9});
  const girdMat=new THREE.MeshStandardMaterial({color:0x5f6771, roughness:0.8});
  function offsetPts(seg, off){
    const O=[]; const n=seg.length;
    for(let i=0;i<n;i++){
      const a=seg[Math.max(0,i-1)], b=seg[Math.min(n-1,i+1)];
      let dx=b[0]-a[0], dz=b[1]-a[1]; const L=Math.hypot(dx,dz)||1;
      O.push([seg[i][0]-dz/L*off, seg[i][1]+dx/L*off]);
    }
    return O;
  }
  for(const [a,b] of runs){
    const seg=P.slice(a,b+1), segY=Y.slice(a,b+1), n=seg.length;
    // 桁（デッキ側面の見付け）
    ribbonY(seg, segY, W_SW+0.2, -0.22, 0x5f6771, 0.8);
    const span=(n-1)*2.5, pk=Math.min(4.6, span*0.24);
    for(const side of [1,-1]){
      const O=offsetPts(seg, side*(W_AS/2+0.6));
      // 朱色アーチ主桁
      const v3=O.map((p,k)=>{ const t=k/(n-1); return new THREE.Vector3(p[0], segY[k]+0.3+Math.sin(t*Math.PI)*pk, p[1]); });
      scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(v3), 28, 0.3, 6), archMat));
      // 吊り材
      for(let k=1;k<n-1;k+=2){
        const t=k/(n-1), hgt=0.3+Math.sin(t*Math.PI)*pk;
        const c=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,hgt,4), archMat);
        c.position.set(O[k][0], segY[k]+hgt/2, O[k][1]); scene.add(c);
      }
      // 白い欄干（支柱＋笠木）
      const R=offsetPts(seg, side*(W_AS/2+0.15));
      for(let k=0;k<n;k+=2){
        const post=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.6,0.1), railMat);
        post.position.set(R[k][0], segY[k]+0.3, R[k][1]); scene.add(post);
      }
      ribbonY(R, segY, 0.16, 0.62, 0xf4f3ea, 0.7);
    }
    // コンクリ橋脚（両端＋中央、水中のみ）
    for(const m of [a+2, Math.round((a+b)/2), b-2]){
      if(m<=a||m>=b) continue;
      if(sdParts(P[m][0],P[m][1]).sd < 0){
        const p=new THREE.Mesh(new THREE.BoxGeometry(2.2, Y[m]+0.6, 1.3), pierMat);
        p.position.set(P[m][0], (Y[m]-0.6)/2, P[m][1]); scene.add(p);
      }
    }
  }
  // 道路タイルを記録
  for(const [x,z] of P){
    const ci=Math.round((x+HALF-CS/2)/CS), cj=Math.round((z+HALF-CS/2)/CS);
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
      const i2=ci+a, j2=cj+b;
      if(i2<0||j2<0||i2>=N||j2>=N) continue;
      const dx=cellX(i2)-x, dz=cellZ(j2)-z;
      if(dx*dx+dz*dz < (W_AS/2+1.2)**2) window.CITY.road[j2*N+i2]=1;
    }
  }
}
// --- 湾岸幹線（海岸線に沿う。河口は自動で橋になる）---
{
  const pts=[]; for(let z=-148; z<=148; z+=4) pts.push([coastX(z)-8, z]);
  paveArterial(pts);
}
// --- 環状幹線（ダウンタウン予定地を囲む角丸ループ。川の西側）---
const RING={cx:-60, cz:-20, hx:40, hz:46, r:15};
{
  const pts=[]; const {cx,cz,hx,hz,r}=RING;
  const seg=(x0,z0,x1,z1)=>{ const L=Math.hypot(x1-x0,z1-z0), st=Math.max(2,Math.round(L/3));
    for(let k=0;k<st;k++) pts.push([x0+(x1-x0)*k/st, z0+(z1-z0)*k/st]); };
  const arc=(ax,az,a0,a1)=>{ for(let k=0;k<=8;k++){ const a=a0+(a1-a0)*k/8; pts.push([ax+Math.cos(a)*r, az+Math.sin(a)*r]); } };
  seg(cx-hx+r,cz-hz, cx+hx-r,cz-hz); arc(cx+hx-r,cz-hz+r, -Math.PI/2, 0);
  seg(cx+hx,cz-hz+r, cx+hx,cz+hz-r); arc(cx+hx-r,cz+hz-r, 0, Math.PI/2);
  seg(cx+hx-r,cz+hz, cx-hx+r,cz+hz); arc(cx-hx+r,cz+hz-r, Math.PI/2, Math.PI);
  seg(cx-hx,cz+hz-r, cx-hx,cz-hz+r); arc(cx-hx+r,cz-hz+r, Math.PI, Math.PI*1.5);
  paveArterial(pts, {closed:true, flatY:1.46});   // 街なかの環状線は完全フラット
}

// ================= ラベル =================
const TAGS=[
  ['東京湾', 100, 80, 'b'],
  ['川（隅田川イメージ）', riverX(-70), -70, 'b'],
  ['河口', riverX(112), 112, 'b'],
  ['埋立地A', ISLANDS[0].x, ISLANDS[0].z, ''],
  ['埋立地B', ISLANDS[1].x, ISLANDS[1].z, ''],
  ['湾岸幹線', coastX(-100)-8, -100, ''],
  ['環状幹線', -60, -66, ''],
];
const tagEls = TAGS.map(([t,,,c])=>{ const d=document.createElement('div'); d.className='tag '+c; d.textContent=t; document.body.appendChild(d); return d; });
const _v=new THREE.Vector3();
function placeTags(){
  if(q.get('h')){ tagEls.forEach(e=>e.style.display='none'); return; }
  TAGS.forEach(([t,x,z],i)=>{ _v.set(x,2,z).project(cam);
    tagEls[i].style.left=((_v.x*0.5+0.5)*innerWidth)+'px';
    tagEls[i].style.top=((-_v.y*0.5+0.5)*innerHeight)+'px';
  });
}
function render(){ renderer.render(scene,cam); }
render(); placeTags();
</script>
</body>
</html>
