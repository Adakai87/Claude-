<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東京 v3 タイルベース — L0地形のみ</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#20242b;font-family:system-ui,'Hiragino Sans',sans-serif}
  #app{position:fixed;inset:0}
  .tag{position:absolute;transform:translate(-50%,-50%);background:rgba(20,24,30,.78);color:#ffd987;
       padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;pointer-events:none;white-space:nowrap;
       border:1px solid rgba(255,217,135,.35)}
  .tag.b{color:#9fd4ff;border-color:rgba(159,212,255,.35)}
  #note{position:fixed;left:12px;bottom:12px;color:#cfd4dc;font-size:12px;background:rgba(20,24,30,.7);
        padding:8px 12px;border-radius:10px;max-width:440px;line-height:1.6}
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app"></div>
<div id="note"><b>東京 v3（タイルベース）— L0 地形のみ</b><br>
100×100セル。湾・蛇行する川・埋立地2つ。道路はまだ無し。<br>
ここから幹線→街路→街区の順にセル上へ設置していく。</div>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3038);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('app').appendChild(renderer.domElement);

const q = new URLSearchParams(location.search);
const VH = +q.get('h') || 118, VX = +q.get('x') || 0, VZ = +q.get('z') || 0;
let cam;
function makeCam(){
  const a = innerWidth/innerHeight;
  cam = new THREE.OrthographicCamera(-VH*a, VH*a, VH, -VH, 1, 1000);
  cam.position.set(VX+150, 170, VZ+150); cam.lookAt(VX,0,VZ);
}
makeCam();
addEventListener('resize', ()=>{ renderer.setSize(innerWidth,innerHeight); makeCam(); render(); placeTags(); });

scene.add(new THREE.HemisphereLight(0xfff2dd, 0x54606e, 0.95));
const dl = new THREE.DirectionalLight(0xffe2b0, 1.0); dl.position.set(60,90,40); scene.add(dl);

// ================= セルグリッド（全ての土台） =================
// type: 0=陸 1=湾 2=川 3=埋立地
const N=100, CS=3, HALF=N*CS/2;
const T = { LAND:0, BAY:1, RIVER:2, FILL:3 };
const grid = new Uint8Array(N*N);
const gi = (i,j)=> j*N+i;
const cellX = i => -HALF + i*CS + CS/2;          // セル中心のワールド座標
const cellZ = j => -HALF + j*CS + CS/2;

// --- 地形の source of truth（連続関数）→ セルに焼き込む ---
const coastX = z => 62 - 0.22*z + 13*Math.sin(z*0.031) + 5*Math.sin(z*0.11+2);
const riverX = z => -22 + 15*Math.sin((z+150)*0.021) + 0.42*Math.max(0, z+42);
const RIVER_HALF = 4.5;
const ISLANDS = [ {x:84, z:16, w:30, d:21}, {x:63, z:75, w:27, d:18} ];   // タイル世界では軸整列が正義

for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const x=cellX(i), z=cellZ(j);
  let t = T.LAND;
  if(x > coastX(z)) t = T.BAY;
  if(z < 121 && Math.abs(x - riverX(z)) < RIVER_HALF && t===T.LAND) t = T.RIVER;
  if(t===T.BAY && ISLANDS.some(s=> Math.abs(x-s.x)<s.w/2 && Math.abs(z-s.z)<s.d/2)) t = T.FILL;
  grid[gi(i,j)] = t;
}
// 川が湾に合流する所: 川セルが湾に触れたらそこから先は湾
// （連続関数で既に湾側は BAY 判定なので追加処理不要）

const isWater = t => t===T.BAY || t===T.RIVER;

// ================= 描画（マージ済みジオメトリ＝1タイプ1メッシュ） =================
function buildLayer(cells, y, baseColor, jitter=0.035){
  // cells: [i,j] の配列。1枚のBufferGeometryにまとめ、頂点色で微妙な揺らぎ
  const pos=[], col=[], c=new THREE.Color();
  for(const [i,j] of cells){
    const x0=-HALF+i*CS, z0=-HALF+j*CS, x1=x0+CS, z1=z0+CS;
    c.setHex(baseColor);
    const f = 1 + (((i*73856093 ^ j*19349663)>>>0)%1000/1000 - 0.5)*2*jitter;   // 決定的ジッター
    const r=Math.min(1,c.r*f), g=Math.min(1,c.g*f), b=Math.min(1,c.b*f);
    pos.push(x0,y,z0, x0,y,z1, x1,y,z1,  x0,y,z0, x1,y,z1, x1,y,z0);
    for(let k=0;k<6;k++) col.push(r,g,b);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, side:THREE.DoubleSide}));
  scene.add(m); return m;
}

// 底面（湾の色。継ぎ目隠し）
{
  const base=new THREE.Mesh(new THREE.PlaneGeometry(N*CS, N*CS), new THREE.MeshStandardMaterial({color:0x35688c}));
  base.rotation.x=-Math.PI/2; base.position.y=0; scene.add(base);
}

const landCells=[], bayCells=[], riverCells=[], fillCells=[], sandCells=[], bankCells=[];
const at=(i,j)=> (i<0||j<0||i>=N||j>=N)? T.LAND : grid[gi(i,j)];   // 範囲外は陸扱い（マップ縁に偽砂浜を作らない）
for(let j=0;j<N;j++)for(let i=0;i<N;i++){
  const t=grid[gi(i,j)];
  if(t===T.BAY) bayCells.push([i,j]);
  else if(t===T.RIVER) riverCells.push([i,j]);
  else {
    const n4=[at(i+1,j),at(i-1,j),at(i,j+1),at(i,j-1)];
    if(t===T.LAND && n4.includes(T.BAY)) sandCells.push([i,j]);            // 湾に面した陸＝砂浜
    else if(n4.includes(T.RIVER)) bankCells.push([i,j]);                    // 川に面した陸＝護岸
    else if(t===T.FILL) fillCells.push([i,j]);
    else landCells.push([i,j]);
  }
}
buildLayer(bayCells,   0.04, 0x3d7ca8, 0.02);
buildLayer(riverCells, 0.05, 0x4185ae, 0.02);
buildLayer(landCells,  0.14, 0x93a07e);
buildLayer(fillCells,  0.12, 0x9aa48b, 0.02);
buildLayer(sandCells,  0.11, 0xd6cba2, 0.02);
buildLayer(bankCells,  0.13, 0xa8b096, 0.02);

// 次フェーズ（道路設置）用に公開
window.CITY = { N, CS, HALF, T, grid, cellX, cellZ };

// ================= ラベル =================
const TAGS=[
  ['東京湾', 100, 80, 'b'],
  ['川（隅田川イメージ）', riverX(-70), -70, 'b'],
  ['河口', riverX(112), 112, 'b'],
  ['埋立地A', ISLANDS[0].x, ISLANDS[0].z, ''],
  ['埋立地B', ISLANDS[1].x, ISLANDS[1].z, ''],
];
const tagEls = TAGS.map(([t,,,c])=>{ const d=document.createElement('div'); d.className='tag '+c; d.textContent=t; document.body.appendChild(d); return d; });
const _v=new THREE.Vector3();
function placeTags(){
  if(q.get('h')){ tagEls.forEach(e=>e.style.display='none'); return; }
  TAGS.forEach(([t,x,z],i)=>{ _v.set(x,2,z).project(cam);
    tagEls[i].style.left=((_v.x*0.5+0.5)*innerWidth)+'px';
    tagEls[i].style.top=((-_v.y*0.5+0.5)*innerHeight)+'px';
  });
}
function render(){ renderer.render(scene,cam); }
render(); placeTags();
</script>
</body>
</html>
